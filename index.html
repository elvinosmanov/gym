let fuelWT = null;
function fuelIn(){
  const p = state.profile;
  p.age = parseFloat($("#f-age").value)||"";
  p.h = parseFloat($("#f-h").value)||"";
  p.act = parseFloat($("#f-act").value);
  p.sur = parseInt($("#f-sur").value);
  p.sex = $("#f-sex").value;
  $("#surV").textContent = "+"+p.sur;
  /* Bodyweight lands in weights[], not profile.w — otherwise Qida and Bugün disagree.
     Debounced so typing "78" doesn't first record an entry for "7". Overwrites today. */
  clearTimeout(fuelWT);
  fuelWT = setTimeout(()=>{
    const v = parseFloat($("#f-w") ? $("#f-w").value : NaN);
    if(setWeight(v)){ save(); cloudPush(); renderFuelOut(); }
  }, 600);
  save(); renderFuelOut();
}
/* Single definition of the calorie target — the meal template and the macro card
   must never compute it differently. wOverride lets the live input drive it while typing. */
function fuelTarget(wOverride){
  const p = state.profile;
  const w = (wOverride!=null && wOverride>0) ? wOverride : latestW();
  if(!(p.age && p.h && w)) return null;
  /* Mifflin-St Jeor: +5 male, -161 female. Existing users default to "m" via migrate(). */
  const bmr = 10*w + 6.25*p.h - 5*p.age + (p.sex==="f" ? -161 : 5);
  return Math.round((bmr*p.act + p.sur)/10)*10;
}
function mealScale(){ const t = fuelTarget(); return t ? t/MEALS_BASE : 1; }
function renderFuelOut(){
  const p = state.profile, w = parseFloat($("#f-w") ? $("#f-w").value : latestW());
  const box = $("#fuelOut");
  const target = fuelTarget(w);
  if(!target){ box.innerHTML = `<div class="card"><div class="empty">Hədəflərinizi görmək üçün yaş, boy və çəkinizi daxil edin.</div></div>`; return; }
  const tdee = target - p.sur;
  const pr = Math.round(2.0*w), fat = Math.round(0.9*w);
  const carbs = Math.max(0, Math.round((target - pr*4 - fat*9)/4));
  const pct = v => Math.round(v/target*100);
  box.innerHTML = `<div class="card">
    <div class="small" style="letter-spacing:.16em;text-transform:uppercase;font-size:10.5px">Gündəlik hədəf · kütlə artımı</div>
    <div class="bignum num">${target.toLocaleString()} <small>kkal</small></div>
    <div class="kcalrow"><span>Saxlama ≈ <b class="num">${Math.round(tdee).toLocaleString()}</b></span><span>Hədəf: <b class="num">+${(w*0.0025).toFixed(1)}–${(w*0.005).toFixed(1)} kq/həftə</b></span></div>
    <div class="macro">
      <div class="mrow"><span>Zülal</span><b class="num">${pr} q · ${pct(pr*4)}%</b></div><div class="mbar"><i style="width:${pct(pr*4)}%;background:var(--b)"></i></div>
    </div>
    <div class="macro">
      <div class="mrow"><span>Karbohidrat</span><b class="num">${carbs} q · ${pct(carbs*4)}%</b></div><div class="mbar"><i style="width:${pct(carbs*4)}%;background:var(--c)"></i></div>
    </div>
    <div class="macro">
      <div class="mrow"><span>Yağ</span><b class="num">${fat} q · ${pct(fat*9)}%</b></div><div class="mbar"><i style="width:${pct(fat*9)}%;background:var(--a)"></i></div>
    </div>
  </div>`;
}

/* ================= PROGRESS ================= */
function chartSVG(pts,color,unit){
  if(!pts.length) return `<div class="empty">Hələ heç nə qeyd edilməyib — məlumat burada özü çəkilir.</div>`;
  const W=340,H=150,L=8,R=14,T=18,B=22;
  const ys = pts.map(p=>p.y);
  let mn=Math.min(...ys), mx=Math.max(...ys);
  if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  const X=i=> L + (W-L-R) * (pts.length===1 ? 0.5 : i/(pts.length-1));
  const Y=v=> T + (H-T-B) * (1-(v-mn)/(mx-mn));
  const path = pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const dots = pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?color:"#171b21"}" stroke="${color}" stroke-width="2"/>`).join("");
  const lastX=X(pts.length-1), lastY=Y(pts[pts.length-1].y);
  const anchor = lastX > W-64 ? "end" : "middle";
  const grid = [0.25,0.5,0.75].map(f=>`<line x1="${L}" x2="${W-R}" y1="${(T+(H-T-B)*f).toFixed(1)}" y2="${(T+(H-T-B)*f).toFixed(1)}" stroke="#232933" stroke-width="1"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${grid}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${lastX}" y="${Math.max(lastY-11,12)}" text-anchor="${anchor}" font-size="12.5" font-weight="700" fill="${color}" font-family="var(--mono)">${pts[pts.length-1].y}${unit}</text>
    <text x="${L}" y="${H-4}" font-size="10" fill="#6b7480">${fmtD(pts[0].d)}</text>
    <text x="${W-R}" y="${H-4}" text-anchor="end" font-size="10" fill="#6b7480">${fmtD(pts[pts.length-1].d)}</text>
  </svg>`;
}
function renderProg(){
  const wPts = state.weights.map(x=>({d:x.d, y:Math.round(x.kg*10)/10}));
  const liftKeys = [...new Set(state.sessions.flatMap(s=>s.ex.map(e=>e.key)))];
  if(!selLift || !liftKeys.includes(selLift)) selLift = liftKeys.includes("sq") ? "sq" : liftKeys[0] || null;

  let liftBlock = `<div class="empty">İlk məşqinizi bitirin, güc qrafikləri burada görünəcək.</div>`;
  if(selLift){
    /* charts show every session, foundation included — only progression math skips it */
    const rows = [];
    state.sessions.forEach(s=>{ const f=s.ex.find(e=>e.key===selLift); if(f) rows.push({d:s.d, sets:f.sets}); });
    const sel = `<select class="lift" onchange="pickLift(this.value)">${liftKeys.map(k=>`<option value="${k}" ${k===selLift?"selected":""}>${esc(exName(k))}</option>`).join("")}</select>`;
    const loaded = rows.some(r=>r.sets.some(st=>st.kg>0));
    if(loaded){
      const pts=[]; let pr=null;
      rows.forEach(r=>{
        let best=null;
        r.sets.forEach(st=>{ if(!(st.kg>0)) return; /* a 0 kg set would flatten the 1RM line */
          const v=e1rm(st.kg,st.reps); if(!best||v>best.v) best={v,kg:st.kg,reps:st.reps}; });
        if(best){ pts.push({d:r.d, y:Math.round(best.v)}); if(!pr||best.v>pr.v) pr={...best,d:r.d}; }
      });
      liftBlock = `${sel}
      <div class="chartbox">${chartSVG(pts,"#f3b73f"," kq")}</div>
      ${pr?`<div class="small">Təxmini 1TM trendi · Ən yaxşı dövr: <b style="color:var(--ink)" class="num">${pr.kg} kq × ${pr.reps}</b> (${fmtD(pr.d)})<span class="prbadge">REKORD ${Math.round(pr.v)} kq</span></div>`:""}`;
    } else {
      /* unloaded lift: 1RM is meaningless, total reps per session is the real progression */
      const pts = rows.map(r=>({ d:r.d, y:r.sets.reduce((a,st)=>a+st.reps,0) }));
      const best = pts.reduce((m,p)=>(!m||p.y>m.y)?p:m, null);
      liftBlock = `${sel}
      <div class="chartbox">${chartSVG(pts,"#3ecf8e"," təkrar")}</div>
      ${best?`<div class="small">Bədən çəkisi ilə — ümumi təkrar trendi. Ən yaxşı məşq: <b style="color:var(--ink)" class="num">${best.y} təkrar</b> (${fmtD(best.d)})<span class="prbadge">REKORD ${best.y} TƏKRAR</span></div>`:""}`;
    }
  }

  const hist = state.sessions.length ? state.sessions.slice().reverse().map((s,ri)=>{
    const i = state.sessions.length-1-ri;
    const n = s.ex.reduce((a,e)=>a+e.sets.length,0);
    return `<details class="hist"><summary><span><span class="mini-plate mp-${dayMeta(s.day).cls}"></span><b>${dayMeta(s.day).name}</b>${s.foundation?` <span class="prbadge">TƏMƏL</span>`:""} · ${fmtD(s.d)}</span><span class="hs num">${n} dövr${s.min!=null?` · ${hm(s.min)}`:""}</span></summary>
      ${s.ex.map(e=>`<div class="histset"><b>${esc(e.name)}</b> — <span class="num">${perfStr(e)}</span></div>`).join("")}
      <button class="btn sm danger" style="margin:8px 0 10px" onclick="delSession(${i})">Məşqi sil</button>
    </details>`;
  }).join("") : `<div class="empty">Hələ məşq yoxdur. Məşq etdikcə tarixçə özü yazılacaq.</div>`;

  $("#view-prog").innerHTML = `
    <div class="sect">Bədən çəkisi</div>
    <div class="card">
      <div class="chartbox">${chartSVG(wPts,"#4a7dff"," kq")}</div>
      <div class="inline-log" style="margin-top:10px">
        <input id="pw" type="number" inputmode="decimal" step="0.1" placeholder="Bugünkü çəkini qeyd et (kq)">
        <button class="btn sm" onclick="addWeight('pw')">Qeyd et</button>
      </div>
      ${state.weights.length?`<div class="loglist">${state.weights.slice(-6).reverse().map(x=>{
        const idx = state.weights.indexOf(x);
        return `<div class="logrow"><span class="num"><b>${x.kg} kq</b></span><span class="d">${fmtD(x.d)}</span><button class="xdel" onclick="delWeight(${idx})">✕</button></div>`;
      }).join("")}</div>`:""}
    </div>

    <div class="sect">Güc · təxmini 1TM</div>
    <div class="card">${liftBlock}</div>

    <div class="sect">Tarixçə</div>
    <div class="card">${hist}</div>`;
}
function pickLift(k){ selLift=k; renderProg(); }
function delWeight(i){ ask("Çəki qeydi silinsin?", `${state.weights[i].kg} kq · ${fmtD(state.weights[i].d)}`, "Sil", ()=>{ state.weights.splice(i,1); if(state.weights.length) state.profile.w = state.weights[state.weights.length-1].kg; save(); cloudPush(true); renderProg(); toast("Silindi"); }, true); }
function delSession(i){ const s=state.sessions[i]; ask("Məşq tarixçədən silinsin?", `${dayMeta(s.day).name} · ${fmtD(s.d)}`, "Sil", ()=>{ state.sessions.splice(i,1); save(); cloudPush(true); renderProg(); toast("Silindi"); }, true); }

/* slot siyahısından əzələ üzrə dövr sayı */
function muscleVolume(slots){
  const vol = {};
  slots.forEach(sl=>{
    const e = libEx(sl.k); if(!e) return;
    const n = Math.max(1, +sl.sets || 1);
    (e.pri||[]).forEach(m => vol[m] = (vol[m]||0) + n);
    (e.sec||[]).forEach(m => vol[m] = (vol[m]||0) + n/2);
  });
  return vol;
}
function volOpacity(v){ return v>0 ? Math.min(0.18 + v*0.055, 0.95) : 0; }
function bodySVG(view, vol){
  const parts = Object.entries(SHAPES[view]).map(([m,shape]) =>
    `<g fill="var(--red)" fill-opacity="${volOpacity(vol[m]||0).toFixed(2)}">${shape}</g>`).join("");
  return `<svg viewBox="0 0 100 220" role="img" aria-label="${view==="front"?"ön":"arxa"} görünüş">
    <g fill="var(--card2)" stroke="var(--line)" stroke-width="1">${BODY_BASE}</g>${parts}</svg>`;
}
/* Plan bölməsindəki kart: gün / həftə seçimi ilə */

function volumeCard(D){
  const slots = volMode==="week" ? DAYS.flatMap(k=>daySlots(k)) : daySlots(D);

  const mins = volMode==="week" ? DAYS.reduce((a,k)=>a+dayMinutes(k),0) : dayMinutes(D);

    .map(m=>({m, v:vol[m]||0}))

/* ================= PLAN (öz proqramını qur) =================
   state.plan[D] mövcud olduqda həmin gün tamamilə istifadəçinindir; olmadıqda
   PROGRAM_DEF-dəki standart sıra işləyir. Beləliklə "standarta qaytar" = sadəcə sil. */
let planDay = null, libFilter = "all", libQuery = "";

function ensurePlan(D){
  state.plan = state.plan || {};
  if(!Array.isArray(state.plan[D])) state.plan[D] = daySlots(D).map(s => ({...s}));
  return state.plan[D];
}
function planLocked(D){ return !!(state.active && state.active.day===D); }
function planTouch(){ buildProgram(); save(); cloudPush(); renderPlan(); }
function selPlanDay(k){ planDay = k; renderPlan(); }

function renderPlan(){
  if(!planDay || !DAY_META[planDay]) planDay = nextDay();
  const D = planDay, meta = DAY_META[D], slots = daySlots(D);
  const custom = !!(state.plan && state.plan[D]);

      <b>${DAY_META[k].name.split(" · ")[0]}</b></button>`).join("");

    <div class="sect">Mənim hərəkətlərim</div>
    <div class="card">
      ${mine.length ? mine.map(k=>{
        const e = mkEx(defSlot(k), null);
        return `<div class="planrow">
          ${exImg(e,"exanim sm still")}
          <div class="ptxt"><b>${esc(e.name)}</b><small>${e.sets} × ${e.rMin}-${e.rMax} · ${esc(e.tag||"")}</small></div>

            <button onclick="openCustom('${k}')" aria-label="düzəliş">⚙</button>

          </div>
        </div>`;
      }).join("") : `<div class="empty">Hələ öz hərəkətiniz yoxdur.</div>`}
      <button class="btn block" style="margin-top:12px" onclick="openCustom('')">＋ Öz hərəkətini yarat</button>
      <div class="small" style="margin-top:10px">Kitabxanada olmayan bir hərəkət edirsinizsə onu buradan yaradın — sonra istənilən günə əlavə edə bilərsiniz.</div>
    </div>

    <div class="sect">Qeyd</div>
    <div class="card tight"><div class="small">Dəyişiklikləriniz yalnız gələcək məşqlərə təsir edir; tarixçə və qrafiklər olduğu kimi qalır. Bir hərəkəti plandan çıxarsanız belə, onun keçmiş qeydləri Proqres bölməsində saxlanılır.</div></div>`;
}

function planMove(D,i,dir){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  const p = ensurePlan(D), j = i+dir;
  if(j<0 || j>=p.length) return;
  const t = p[i]; p[i] = p[j]; p[j] = t;
  planTouch();
}
function planRemove(D,i){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  const p = ensurePlan(D);
  const nm = (libEx(p[i].k)||{}).name || p[i].k;
  ask("Hərəkət çıxarılsın?", `“${esc(nm)}” bu gündən çıxarılacaq.\n\nKeçmiş qeydləriniz və qrafikləriniz silinmir.`, "Çıxar",
      ()=>{ p.splice(i,1); planTouch(); toast("Çıxarıldı"); }, true);
}
function planReset(D){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  ask("Standart plana qaytarılsın?", "Bu gün üçün etdiyiniz dəyişikliklər itəcək — hərəkətlər ilkin siyahıya qayıdacaq.", "Qaytar",
      ()=>{ if(state.plan) delete state.plan[D]; planTouch(); toast("Standart plan bərpa edildi"); }, true);
}
function planPick(D, key, idx){
  const p = ensurePlan(D);
  if(p.some((s,i)=> s.k===key && i!==idx)){ toast("Bu hərəkət artıq həmin gündədir"); return; }
  if(idx===null || idx===undefined) p.push(defSlot(key));
  else p[idx] = { ...defSlot(key), sets:p[idx].sets, rMin:p[idx].rMin, rMax:p[idx].rMax, rest:p[idx].rest };
  closeSheet(); planTouch();
  toast(idx===null||idx===undefined ? "Əlavə edildi" : "Dəyişdirildi");
}

const GRP = { push:"İtələmə (döş · çiyin · triseps)", pull:"Çəkmə (kürək · biseps)", legs:"Ayaq", core:"Qarın · Bel", mine:"Mənim hərəkətlərim" };
function libSetFilter(g){ libFilter = g; renderLibList(); }
function libSearch(v){ libQuery = (v||"").toLowerCase(); renderLibList(); }
function openLibPick(D, idx){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  libFilter = { P:"push", L:"pull", G:"legs" }[D] || "all";   /* günün qrupu ilə başla */
  libQuery = "";
  $("#sheet").innerHTML = `<div class="grab"></div>
    <h3>${idx===null?"Hərəkət əlavə et":"Hərəkəti əvəz et"}</h3>
    <div class="stag">${DAY_META[D].name}</div>
    <input class="srch" id="libq" placeholder="Axtar: bench, squat, curl..." oninput="libSearch(this.value)">
    <div class="chips fil" id="libfil"></div>
    <div id="liblist" class="swaplist"></div>
    <button class="btn block ghost" style="margin-top:6px" onclick="closeSheet()">Bağla</button>`;
  $("#sheet").dataset.d = D; $("#sheet").dataset.i = (idx===null||idx===undefined) ? "" : String(idx);
  renderLibList();
  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
}
function renderLibList(){
  const fil = $("#libfil"), box = $("#liblist");
  if(!box) return;
  const D = $("#sheet").dataset.d, iRaw = $("#sheet").dataset.i;
  const idx = iRaw==="" ? null : parseInt(iRaw);
  const groups = ["all","push","pull","legs","core","mine"];
  fil.innerHTML = groups.map(g=>`<span class="pick ${libFilter===g?"on":""}" onclick="libSetFilter('${g}')">${g==="all"?"Hamısı":(GRP[g]||g).split(" (")[0]}</span>`).join("");
  const mine = Object.keys(state.userEx||{});
  let keys = libFilter==="mine" ? mine : libKeys().filter(k => libFilter==="all" || (libEx(k)||{}).g===libFilter);
  if(libQuery) keys = keys.filter(k => ((libEx(k)||{}).name||"").toLowerCase().includes(libQuery) || ((libEx(k)||{}).tag||"").toLowerCase().includes(libQuery));
  if(!keys.length){ box.innerHTML = `<div class="empty">Tapılmadı.</div>`; return; }
  box.innerHTML = keys.map(k=>{
    const e = mkEx(defSlot(k), null);
    return `<button class="swopt" onclick="planPick('${D}','${k}',${idx===null?"null":idx})">
      ${exImg(e,"exanim sm still")}
      <span class="swtxt"><b>${esc(e.name)}</b><small>${esc(e.tag||"")} · ${e.sets}×${e.rMin}-${e.rMax}</small></span>
      <span class="swck">＋</span>
    </button>`;
  }).join("");
}

function openSlotEdit(D,i){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  const sl = daySlots(D)[i], ex = mkEx(sl, D);
  $("#sheet").innerHTML = `<div class="grab"></div>
    ${exImg(ex,"exanim big")}
    <h3>${esc(ex.name)}</h3><div class="stag">${esc(ex.tag||"")}</div>
    <div class="grid2">
      <div class="field"><label>Dövr sayı</label><input id="sl-sets" type="number" inputmode="numeric" min="1" max="10" value="${ex.sets}"></div>
      <div class="field"><label>İstirahət (san)</label><input id="sl-rest" type="number" inputmode="numeric" min="15" max="300" step="15" value="${ex.rest}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Təkrar — min</label><input id="sl-rmin" type="number" inputmode="numeric" min="1" max="50" value="${ex.rMin}"></div>
      <div class="field"><label>Təkrar — maks</label><input id="sl-rmax" type="number" inputmode="numeric" min="1" max="50" value="${ex.rMax}"></div>
    </div>
    <div class="small">Maks təkrara bütün dövrlərdə çatdıqda tətbiq çəkini +${ex.inc} kq artırmağı təklif edir.</div>
    <button class="btn block" style="margin-top:12px" onclick="applySlot('${D}',${i})">Yadda saxla</button>
    <button class="btn block ghost" style="margin-top:8px" onclick="openLibPick('${D}',${i})">⇄ Başqa hərəkətlə əvəz et</button>
    <button class="btn block danger" style="margin-top:8px" onclick="closeSheet();planRemove('${D}',${i})">Bu gündən çıxar</button>`;
  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
}
function applySlot(D,i){
  const p = ensurePlan(D);
  const n = (id,min,max,dflt) => { const v = parseInt($("#"+id).value); return (isNaN(v)||v<min||v>max) ? dflt : v; };
  const cur = p[i];
  cur.sets = n("sl-sets",1,10,cur.sets);
  cur.rest = n("sl-rest",15,300,cur.rest);
  let a = n("sl-rmin",1,50,cur.rMin), b = n("sl-rmax",1,50,cur.rMax);
  if(a > b){ const t=a; a=b; b=t; }
  cur.rMin = a; cur.rMax = b;
  closeSheet(); planTouch(); toast("Yadda saxlanıldı");
}

/* ---- öz hərəkətin ---- */
const clean = s => String(s||"").replace(/[<>]/g,"").trim();
function openCustom(key){
  const e = (key && state.userEx && state.userEx[key]) || { name:"", tag:"", g:"push", sets:3, rMin:10, rMax:12, rest:90, inc:2.5, cues:[] };
  $("#sheet").innerHTML = `<div class="grab"></div>
    <h3>${key?"Hərəkətə düzəliş":"Öz hərəkətini yarat"}</h3>
    <div class="field"><label>Ad</label><input id="cx-name" value="${esc(e.name)}" placeholder="məs. Landmine Press"></div>
    <div class="grid2">
      <div class="field"><label>Qrup</label><select id="cx-g">${["push","pull","legs","core"].map(g=>`<option value="${g}" ${e.g===g?"selected":""}>${GRP[g].split(" (")[0]}</option>`).join("")}</select></div>
      <div class="field"><label>İşləyən əzələ</label><input id="cx-tag" value="${esc(e.tag)}" placeholder="Döş · Triseps"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Dövr</label><input id="cx-sets" type="number" inputmode="numeric" value="${e.sets}"></div>
      <div class="field"><label>Təkrar min</label><input id="cx-rmin" type="number" inputmode="numeric" value="${e.rMin}"></div>
      <div class="field"><label>Təkrar maks</label><input id="cx-rmax" type="number" inputmode="numeric" value="${e.rMax}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>İstirahət (san)</label><input id="cx-rest" type="number" inputmode="numeric" step="15" value="${e.rest}"></div>
      <div class="field"><label>Çəki addımı (kq)</label><input id="cx-inc" type="number" inputmode="decimal" step="0.5" value="${e.inc}"></div>
    </div>
    <div class="field"><label>Əsas işləyən əzələlər</label>
      <div class="chips fil" id="cx-pri">${Object.keys(MUSN).map(m=>`<span class="pick ${(e.pri||[]).includes(m)?"on":""}" data-m="${m}" onclick="this.classList.toggle('on')">${MUSN[m]}</span>`).join("")}</div></div>
    <div class="field"><label>Köməkçi əzələlər (yarım dövr sayılır)</label>
      <div class="chips fil" id="cx-sec">${Object.keys(MUSN).map(m=>`<span class="pick ${(e.sec||[]).includes(m)?"on":""}" data-m="${m}" onclick="this.classList.toggle('on')">${MUSN[m]}</span>`).join("")}</div></div>
    <div class="field"><label>Şəkil (istəyə bağlı)</label><input id="cx-img" value="${esc(e.url||e.file||"")}" placeholder="şəkil linki və ya Commons fayl adı"></div>
    <div class="field"><label>Texnika qeydləri — hər sətir ayrı</label><textarea id="cx-cues" rows="4" placeholder="Dirsəklər bədənə yaxın&#10;Yuxarıda bir saniyə sıxın">${esc((e.cues||[]).join("\n"))}</textarea></div>
    <button class="btn block" style="margin-top:6px" onclick="saveCustom('${key||""}')">Yadda saxla</button>
    <button class="btn block ghost" style="margin-top:8px" onclick="closeSheet()">İmtina</button>`;
  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
}
function saveCustom(key){
  const name = clean($("#cx-name").value);
  if(!name){ toast("Ad yazın"); return; }
  const num = (id,d,min,max) => { const v = parseFloat($("#"+id).value); return (isNaN(v)||v<min||v>max) ? d : v; };
  const img = clean($("#cx-img").value);
  const k = key || ("u" + Date.now().toString(36));
  state.userEx = state.userEx || {};
  const prev = state.userEx[k] || {};
  state.userEx[k] = {
    name, tag: clean($("#cx-tag").value) || "Öz hərəkətim", g: $("#cx-g").value,
    sets: num("cx-sets", 3, 1, 10), rMin: num("cx-rmin", 10, 1, 50), rMax: num("cx-rmax", 12, 1, 50),
    rest: num("cx-rest", 90, 15, 300), inc: num("cx-inc", 2.5, 0.5, 20),
    cues: clean($("#cx-cues").value).split("\n").map(s=>s.trim()).filter(Boolean),
    mist: prev.mist || [],
    pri: [...document.querySelectorAll("#cx-pri .pick.on")].map(el=>el.dataset.m),
    sec: [...document.querySelectorAll("#cx-sec .pick.on")].map(el=>el.dataset.m),
    url: /^https?:\/\//i.test(img) ? img : "", file: /^https?:\/\//i.test(img) ? "" : img
  };
  if(state.userEx[k].rMin > state.userEx[k].rMax){
    const t = state.userEx[k].rMin; state.userEx[k].rMin = state.userEx[k].rMax; state.userEx[k].rMax = t;
  }
  closeSheet(); planTouch();
  toast(key ? "Yeniləndi" : `“${name}” yaradıldı — indi günə əlavə edin`);
}
function delCustom(k){
  const nm = (state.userEx[k]||{}).name || k;
  const used = DAYS.filter(D => daySlots(D).some(s => s.k===k));
  const extra = used.length ? `\n\nO, bu günlərdən də çıxarılacaq: ${used.map(D=>DAY_META[D].name).join(", ")}.` : "";
  ask("Hərəkət silinsin?", `“${esc(nm)}” kitabxanadan tamamilə silinəcək.${esc(extra)}`, "Sil", ()=>{
    used.forEach(D => { const p = ensurePlan(D); const i = p.findIndex(s=>s.k===k); if(i>=0) p.splice(i,1); });
    delete state.userEx[k];
    planTouch(); toast("Silindi");
  }, true);
}
