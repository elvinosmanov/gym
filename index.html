<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FORGE · Push · Pull · Legs · Tam Bədən</title>
<meta name="theme-color" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101318; --card:#171b21; --card2:#1e232b; --line:#272d38;
  --ink:#eef1f5; --mut:#96a0ad; --dim:#6b7480;
  --chalk:#f0ede3; --chalk-ink:#15181d;
  --a:#e0484e; --b:#4a7dff; --c:#f3b73f; --d:#33b56f;  /* competition plate colors: red / blue / yellow / green */
  --green:#3ecf8e; --red:#e0484e;
  --disp:'Oswald',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.5;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.014) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.014) 0 1px, transparent 1px 7px);
}
.app{max-width:500px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:20px 0 6px}
.wordmark{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:.14em;line-height:1}
.wordmark i{font-style:normal;color:var(--c)}
.eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut);margin-top:5px}
.datechip{font-size:12px;color:var(--mut);text-align:right;line-height:1.35}
.datechip b{color:var(--ink);font-weight:600}

/* ---------- cards & type ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.tight{padding:14px 16px}
.sect{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:22px 2px 4px}
.h-big{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.03em;line-height:1.15}
.sub{color:var(--mut);font-size:13px}
.small{font-size:12.5px;color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
hr.split{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--chalk);color:var(--chalk-ink);border:0;border-radius:12px;
  font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.09em;text-transform:uppercase;
  padding:13px 18px;transition:transform .06s ease,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid #3d2225}
.btn.sm{padding:9px 13px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- stat chips ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;text-align:left}
.stat .v{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.1}
.stat .v small{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.03em}
.stat .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.delta-up{color:var(--green);font-size:12px;font-weight:600}
.delta-dn{color:var(--red);font-size:12px;font-weight:600}

/* ---------- plate day selector (signature) ---------- */
.dayrow{display:flex;gap:8px;justify-content:center;padding:14px 0 2px}
.daysel{flex:1;min-width:0;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.daysel b{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;text-align:center;line-height:1.25}
.daysel.on b,.daysel:has(.plate.on) b{color:var(--ink)}
.daysel.lock{opacity:.45;pointer-events:none}
.plate{position:relative;width:100%;max-width:74px;aspect-ratio:1;border-radius:50%;border:0;
  display:grid;place-items:center;color:#101010;background:var(--pc,#888);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.28), inset 0 0 0 9px rgba(255,255,255,.09), inset 0 0 0 10px rgba(0,0,0,.22), 0 6px 16px rgba(0,0,0,.35);
  filter:grayscale(.85) brightness(.55);transform:scale(.93);transition:filter .18s,transform .18s}
.plate::after{content:"";position:absolute;inset:35%;border-radius:50%;background:var(--bg);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7)}
.plate span{position:relative;z-index:1;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink)}
.plate.on{filter:none;transform:scale(1)}
.plate.lock{pointer-events:none;opacity:.45}
.plate-a{--pc:var(--a)} .plate-b{--pc:var(--b)} .plate-c{--pc:var(--c)} .plate-d{--pc:var(--d)}
.mini-plate{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:7px;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.35)}
.mp-a{background:var(--a)}.mp-b{background:var(--b)}.mp-c{background:var(--c)}.mp-d{background:var(--d)}

/* ---------- schedule strip (one day on, one day off) ---------- */
.strip{display:flex;gap:6px;justify-content:space-between}
.sday{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:10px;background:var(--card2);border:1px solid transparent}
.sday .wd{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.sday .dn{font-size:13px;color:var(--mut);font-weight:600}
.sday .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.sday.on .dot{background:var(--c)}
.sday.on .dn{color:var(--ink)}
.sday.today{border-color:var(--line)}
.sday.today .wd{color:var(--ink)}

/* ---------- exercise cards ---------- */
.ex{border-left:3px solid var(--dc,var(--line))}
.ex .name{font-family:var(--disp);font-weight:600;font-size:16.5px;letter-spacing:.03em}
.ex .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
  border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:var(--card2)}
.tag.hot{color:var(--ink);border-color:transparent;background:rgba(240,237,227,.12)}
.lastline{font-size:12.5px;color:var(--mut);margin-top:8px}
.lastline b{color:var(--ink);font-weight:600}
.hint{font-size:12.5px;margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--card2);border:1px dashed var(--line)}
.hint.up{border-color:rgba(62,207,142,.4);color:var(--green)}
.hint b{color:var(--ink)}
.hint.up b{color:var(--green)}
.ramp{font-size:12px;color:var(--mut);margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--card2)}
.ramp b{color:var(--ink);font-weight:600}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{display:flex;gap:10px;align-items:flex-start}

/* ---------- exercise illustration (2 frames, cross-faded) ----------
   contain, never cover: these are full-body line drawings — cropping them to a
   square is exactly what made the old photos unreadable. */
.exanim{position:relative;background:#f4f2ea;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.exanim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px}
.exanim img.f2{opacity:0;animation:frameflip 2.6s infinite}
.exanim.sm{width:64px;height:64px}
.exanim.big{width:100%;height:min(46vh,300px);border-radius:16px;margin-bottom:8px}
.exanim.big img{padding:10px}
.exanim.ph{display:grid;place-items:center;background:var(--card2)}
.exanim.ph img{display:none}
.exanim.ph::after{content:"🏋️";font-size:22px}
.exanim.still img.f2{display:none}
/* hard cut, not a cross-fade: two overlapping line drawings at 50% opacity read as
   one messy tangle — a 2-frame flip reads as movement */
@keyframes frameflip{0%,49.9%{opacity:0}50%,99.9%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){ .exanim img.f2{opacity:1;animation:none} }
.framelbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 2px 10px}
.techbtn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:9px;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;white-space:nowrap}
.techbtn:hover{color:var(--ink)}
.exbtns{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.tag.swp{color:#f3b73f;border-color:rgba(243,183,63,.4)}
.swaplist{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.swopt{display:flex;align-items:center;gap:11px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;color:var(--ink);text-align:left}
.swopt.on{border-color:var(--green)}
.swopt .swtxt{flex:1;min-width:0}
.swopt .swtxt b{display:block;font-size:14px;line-height:1.25}
.swopt .swtxt small{color:var(--mut);font-size:11.5px}
.swopt .swck{flex:none;color:var(--green);font-size:17px;width:18px;text-align:center}

/* ---------- plan editor ---------- */
.planrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.planrow:last-of-type{border-bottom:0}
.planrow .exanim.sm{width:52px;height:52px}
.planrow .ptxt{min-width:0}
.planrow .ptxt b{display:block;font-size:13px;line-height:1.25;font-weight:600}
.planrow .ptxt small{display:block;color:var(--mut);font-size:11px;margin-top:3px;line-height:1.35}
.pbtns{display:flex;gap:4px;flex:none}
.pbtns button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:12.5px;line-height:1;padding:0}
.pbtns button:disabled{opacity:.3}
.pbtns button.del{color:var(--red);border-color:#3d2225}
.srch{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:11px 12px;font-size:16px;margin:6px 0 8px}
.chips.fil{margin:0 0 6px}
.chips .pick{font-size:12px;border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:5px 11px;color:var(--mut);cursor:pointer}
.chips .pick.on{color:var(--chalk-ink);background:var(--chalk);border-color:var(--chalk);font-weight:600}
/* ---------- warm-up + session clock ---------- */
.wulist{list-style:none;counter-reset:wu;margin-top:8px}
.wulist li{counter-increment:wu;position:relative;padding:8px 0 8px 26px;border-bottom:1px solid var(--line)}
.wulist li:last-child{border-bottom:0}
.wulist li::before{content:counter(wu);position:absolute;left:0;top:8px;width:18px;height:18px;border-radius:6px;
  background:var(--card2);border:1px solid var(--line);color:var(--mut);font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.wulist li b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.wulist li small{color:var(--mut);font-size:11.5px}
.card.wu.done .wulist{opacity:.5}
.card.wu.done .wulist li b{text-decoration:line-through}
.clock{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 14px;margin:10px 0 2px;cursor:pointer}
.clock .cl-l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.clock b{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.02em}
.clock .cl-r{margin-left:auto;font-size:11px;color:var(--dim);text-align:right}

/* ---------- muscle map ---------- */
.bodywrap{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.bodyfig{flex:1;max-width:150px;text-align:center}
.bodyfig svg{width:100%;height:auto;display:block}
.bodyfig span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.mlist{margin-top:2px}
.mrowv{display:grid;grid-template-columns:1fr 76px 34px;gap:8px;align-items:center;padding:5px 0;font-size:12.5px}
.mrowv .mn{color:var(--ink)}
.mrowv .mb{height:7px;border-radius:99px;background:var(--card2);overflow:hidden}
.mrowv .mb i{display:block;height:100%;border-radius:99px;background:var(--red)}
.mrowv .mv{text-align:right;color:var(--mut);font-weight:600}
.mrowv.zero .mn,.mrowv.zero .mv{color:var(--dim)}
.mrowv.zero .mb i{background:var(--line)}

.sheet textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:12px;font-size:15px;font-family:inherit;resize:vertical}

/* ---------- set rows ---------- */
.sethdr,.setrow{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:6px;align-items:center}
.sethdr{margin:12px 0 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}
.setrow{margin:7px 0}
.setrow .idx{font-family:var(--disp);font-weight:600;color:var(--mut);text-align:center}
.stepper{display:flex;align-items:stretch;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:32px;flex:none;background:transparent;border:0;color:var(--mut);font-size:19px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.stepper button:active{background:rgba(240,237,227,.1);color:var(--ink)}
.stepper input{flex:1;min-width:0;width:100%;background:transparent;border:0;
  color:var(--ink);padding:12px 0;font-size:16px;text-align:center;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}
.stepper input::placeholder{color:var(--dim)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.check{width:46px;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
  color:var(--dim);font-size:17px;line-height:1;transition:background .12s}
.check.done{background:var(--green);border-color:var(--green);color:#0b120e}

/* ---------- inputs ---------- */
.field{margin:10px 0}
.field label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;
  color:var(--ink);padding:12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inline-log{display:flex;gap:8px}
.inline-log input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:12px;font-size:16px;text-align:center}
.supprow{display:flex;flex-direction:column;gap:8px}
.suppbtn{display:flex;align-items:center;gap:11px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink);text-align:left}
.suppbtn .si{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.suppbtn.on{border-color:var(--green)}
.suppbtn.on .si{background:var(--green);border-color:var(--green);color:#0b120e}
.suppbtn .st{flex:1}
.suppbtn .st b{display:block;font-size:14px}
.suppbtn .st small{color:var(--mut);font-size:11px}
.suppbtn .sk{font-size:12px;color:var(--mut);white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--chalk)}

/* ---------- rules / details ---------- */
details.rules{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
details.rules summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:"+";font-size:19px;color:var(--mut);font-weight:400}
details.rules[open] summary::after{content:"–"}
details.rules .inner{padding:0 16px 14px;border-top:1px solid var(--line)}
.rule{padding:11px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule b{display:block;font-size:13.5px;margin-bottom:2px}
.rule p{font-size:13px;color:var(--mut)}

/* ---------- coach tip ---------- */
.coach{display:flex;gap:12px;align-items:flex-start}
.coach .cq{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--c);line-height:.8;margin-top:2px}
.coach p{font-size:14px;color:var(--ink)}
.coach .who{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:6px}

/* ---------- fuel ---------- */
.bignum{font-family:var(--disp);font-weight:700;font-size:42px;line-height:1;letter-spacing:.02em}
.bignum small{font-size:15px;color:var(--mut);font-weight:600;letter-spacing:.06em}
.kcalrow{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:10px}
.kcalrow b{color:var(--ink)}
.macro{margin:13px 0 4px}
.macro .mrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.macro .mrow b{font-variant-numeric:tabular-nums}
.mbar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px}
.meal{padding:11px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .mt{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.meal .mt span:last-child{color:var(--mut);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.meal p{font-size:13px;color:var(--mut);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chips span{font-size:12.5px;border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:5px 12px;color:var(--ink)}

/* ---------- progress ---------- */
.chartbox{margin:8px 0 4px}
.chartbox svg{width:100%;height:auto;display:block}
.loglist{margin-top:6px}
.logrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.logrow:last-child{border-bottom:0}
.logrow .d{color:var(--mut)}
.xdel{background:none;border:0;color:var(--dim);font-size:15px;padding:4px 8px}
.xdel:hover{color:var(--red)}
select.lift{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:12px;font-size:15px;margin:8px 0}
.prbadge{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#151515;background:var(--c);
  border-radius:7px;padding:3px 9px;font-weight:700;margin-left:8px}
details.hist{border-bottom:1px solid var(--line);padding:4px 0}
details.hist:last-child{border-bottom:0}
details.hist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13.5px}
details.hist summary::-webkit-details-marker{display:none}
details.hist .hs{color:var(--mut);font-size:12.5px}
.histset{font-size:12.5px;color:var(--mut);padding:3px 0 3px 10px;border-left:2px solid var(--line);margin:4px 0}
.histset b{color:var(--ink)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;
  display:flex;gap:2px;background:rgba(14,17,22,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:8px 10px calc(9px + env(safe-area-inset-bottom));z-index:40}
.tabbar button{flex:1;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:6px 2px;border-radius:11px}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--chalk);margin-top:1px}

/* ---------- rest timer (full-screen) ---------- */
.timer{position:fixed;inset:0;background:rgba(8,9,12,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:70;
  padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
.timer.on{display:flex}
.timer .tlab{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut);text-align:center}
.timer .exlab{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.03em;text-align:center;margin-top:2px}
.tring{position:relative;width:min(72vw,290px);height:min(72vw,290px);display:grid;place-items:center}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .trk{fill:none;stroke:var(--card2);stroke-width:9}
.tring .prg{fill:none;stroke:var(--red);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(224,72,78,.55));transition:stroke-dashoffset .25s linear}
.timer .digits{position:absolute;font-family:var(--mono);font-weight:700;font-size:min(15vw,60px);line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums}
.timer.done .tring .prg{stroke:var(--green);filter:drop-shadow(0 0 10px rgba(62,207,142,.55))}
.timer.done .digits{animation:blink .5s steps(2) 3}
@keyframes blink{50%{opacity:.25}}
.timer .tbtns{display:flex;gap:12px;width:100%;max-width:320px}
.timer .tbtns .btn{flex:1}

/* ---------- sheet / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,8,11,.66);backdrop-filter:blur(3px);z-index:60;display:none}
.overlay.on{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:500px;z-index:61;
  background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:none;max-height:82vh;overflow-y:auto}
.sheet.on{display:block}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.03em}
.sheet .stag{font-size:12px;color:var(--mut);margin:2px 0 10px}
.cuelist{margin:8px 0 4px}
.cue{display:flex;gap:10px;padding:7px 0;font-size:13.5px}
.cue .ic{flex-shrink:0;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.cue.good .ic{background:rgba(62,207,142,.15);color:var(--green)}
.cue.bad .ic{background:rgba(224,72,78,.14);color:var(--red)}
.cue p{color:#cfd6de}
.sheet .protoc{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}

/* ---------- misc ---------- */
.banner{background:rgba(74,125,255,.1);border:1px solid rgba(74,125,255,.35);border-radius:13px;padding:11px 14px;font-size:13px;margin:12px 0}
.warnnote{background:rgba(243,183,63,.09);border:1px solid rgba(243,183,63,.3);border-radius:13px;padding:10px 14px;font-size:12.5px;color:#e8d9b0;margin:12px 0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);z-index:80;
  background:var(--chalk);color:var(--chalk-ink);font-weight:600;font-size:14px;border-radius:12px;padding:11px 18px;
  transition:transform .25s ease;box-shadow:0 10px 26px rgba(0,0,0,.4);max-width:88%;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 8px}
.view{display:none}.view.on{display:block}
.footnote{font-size:11.5px;color:var(--dim);text-align:center;margin:20px 0 6px;line-height:1.6}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* Hər hərəkətin İKİ kadrı var: başlanğıc (1) və bitiş (2) vəziyyəti. Kartda və texnika
   vərəqində onlar avtomatik növbələşir — hərəkət canlı görünsün deyə. Hamısı eyni
   illüstrasiya dəstindəndir (Wikimedia Commons, CC BY-SA), ona görə üslub sabitdir. */
const IMGU = "https://upload.wikimedia.org/wikipedia/commons/";
function frames(ex){
  if(!ex) return [];
  if(ex.im && IMG[ex.im]) return IMG[ex.im].map(p => IMGU + p);
  if(ex.url) return [ex.url];                       /* öz hərəkəti: birbaşa link */
  if(ex.file) return ["https://commons.wikimedia.org/wiki/Special:FilePath/"
                      + encodeURIComponent(String(ex.file).replace(/ /g,"_")) + "?width=500"];
  return [];
}
/* animasiyalı və ya tək kadrlı şəkil bloku — cls: "exanim" (böyük) / "exanim sm" (kiçik) */
function exImg(ex, cls){
  const f = frames(ex);
  if(!f.length) return `<div class="${cls} ph">🏋️</div>`;
  const alt = esc(ex.name||"");
  return `<div class="${cls}"><img src="${f[0]}" alt="${alt}" loading="lazy" onerror="this.closest('.exanim').classList.add('ph')">${f[1]?`<img class="f2" src="${f[1]}" alt="" loading="lazy" onerror="this.remove()">`:""}</div>`;
}

  mist:["Ombanın yastıqdan qalxması — yükü beldən ötürür.","Ağır çəki ilə yarımçıq amplituda işləmək.","Enmə fazasını buraxıb çəkinin sərbəst düşməsinə icazə vermək."]},
lex:{name:"Leg Extension", tag:"Dördbaşlı əzələ", g:"legs", pri:["quads"], sec:[], sets:3, rMin:12, rMax:15, rest:60, inc:2.5, im:"legext",
  cues:["Diz oynağı aparatın oxu ilə üst-üstə düşsün, yastıq ayaq biləyinin üstündə olsun.","Ombanı oturacağa basılı saxlayın, tutacaqlardan yapışın.","Ayaqları tam açın və yuxarıda 1 saniyə dördbaşlı əzələni sıxın.","Nəzarətlə endirin — çəki yığınına toxunmadan dayanın, gərginlik itməsin."],
  mist:["Ombanı qaldırıb ətalətlə təpik vurmaq.","Yuxarıda dayanmadan sürətli təkrarlar.","Diz ağrısı varsa çox ağır çəki — bu hərəkət yüngül çəki və yüksək təkrar sevir."]},
calf:{name:"Standing Calf Raise", tag:"Baldır əzələsi", g:"legs", pri:["calves"], sec:[], sets:4, rMin:12, rMax:15, rest:60, inc:2.5, im:"calfm",
  cues:["Aşağıda tam gərilmə — orada bir saniyə dayanın.","Ayaq barmaqlarının ucuna qədər qalxın və 1-2 saniyə sıxın.","Yavaş enmə. Baldır əzələsi sıçramadan yox, tam amplitüddən böyüyür."],
  mist:["Gərilmə refleksindən istifadə edərək sıçramaq.","Sürətli, yarımçıq təkrarlar.","Çəkini hiylə ilə qaldırmaq üçün dizləri bükmək."]},

gsq:{name:"Goblet / Dumbbell Squat", tag:"Dördbaşlı əzələ · Sağrı əzələsi", g:"legs", pri:["quads","glutes"], sec:["hams"], sets:3, rMin:10, rMax:12, rest:120, inc:2, im:"dbsquat",
  cues:["Hanteli sinəyə sıxın (və ya iki hanteli böyürdə saxlayın), gövdəni dik tutun.","Dabanların arasına oturun, dizlər barmaqlar istiqamətində açılsın.","Rahat gedən ən dərin nöqtəyə enin, sonra dabanlarla itələyin.","Ayaq günündən sonra gəldiyi üçün burada çəki yox, texnika və amplituda əsasdır."],
  mist:["Gövdənin önə çökməsi.","Dabanların qalxması.","Aşağıda sıçrayış — nəzarətli enin."]},
mchp:{name:"Machine Chest Press", tag:"Döş · Triseps", g:"push", pri:["chest"], sec:["triceps","delts"], sets:3, rMin:10, rMax:12, rest:90, inc:2.5, im:"machbp",
  cues:["Oturacağı elə qurun ki, tutacaqlar döşün orta xəttində olsun.","Kürəkləri arxaya sıxın, döşü qabağa çıxarın.","Tam itələyin, dirsəkləri kilidləmədən dayanın.","Nəzarətlə geri buraxın, döşdə gərilmə hiss edin."],
  mist:["Oturacağın çox aşağı/yuxarı qalması — çiyinlərə yük düşür.","Yarımçıq amplituda.","Çiyinlərin önə düşməsi."]},
upd:{name:"Underhand Lat Pulldown", tag:"Enli kürək · Biseps", g:"pull", pri:["lats"], sec:["biceps"], sets:3, rMin:10, rMax:12, rest:90, inc:2.5, im:"underpd",
  cues:["Ovuclar özünüzə baxsın, tutuş çiyin enində olsun.","Döşü çubuğa doğru qaldırın, dirsəkləri aşağı-arxaya çəkin.","Çubuq döşün yuxarısına toxunanda kürəkləri sıxın.","Yuxarıda qolları tam açın — hər təkrar tam gərilmədən başlasın."],
  mist:["Yalnız qollarla dartmaq — əvvəl dirsəkləri düşünün.","Bədəni həddindən artıq arxaya yatırmaq.","Yarımçıq amplituda sürətli təkrarlar."]},
msp:{name:"Machine Shoulder Press", tag:"Çiyinlər · Triseps", g:"push", pri:["delts"], sec:["triceps"], sets:3, rMin:10, rMax:12, rest:90, inc:2.5, im:"machshp",
  cues:["Tutacaqlar çiyin səviyyəsində başlasın — oturacağı ona görə tənzimləyin.","Beli söykənəcəyə basılı saxlayın, qarını gərin.","Yuxarı itələyin, dirsəkləri tam kilidləməyin.","Nəzarətlə qulaq səviyyəsinə qədər endirin."],
  mist:["Beli qövsə salmaq.","Yarımçıq eniş.","Boynu önə uzatmaq."]},
be:{name:"Back Extension", tag:"Bel · Sağrı · Arxa bud", g:"legs", pri:["lowback","glutes"], sec:["hams"], sets:3, rMin:12, rMax:15, rest:90, inc:2.5, bodyweight:true, im:"hyper",
  cues:["Bədəni yastıqcığın üzərinə qoyun, ayaq biləkləri diyircəklərin altında sabitlənsin.","Başlanğıc üçün qolları döşün üzərində çarpazlayın — asan gəldikdə döşünüzə disk qoyun.","Arxa budun əzələlərində gərilmə hiss edənə qədər nəzarətlə enin.","Sağrı və arxa budu sıxaraq düz xəttə qalxın — daha da geri əyilməyin."],
  mist:["Hiperekstenziya — yuxarıda neytral vəziyyətdən çox geri əyilmək onurğaya zərər verir.","Aşağıda sıçramaq.","Enərkən belin yumrulanması.","Ətalətlə dartınmaq."]},
abs:{name:"Cable Crunch", tag:"Qarın əzələləri", g:"core", pri:["abs"], sec:[], sets:3, rMin:12, rMax:15, rest:60, inc:2.5, im:"cablecr",
  cues:["Kanat başınızın yanında olacaq şəkildə diz üstə oturun.","Qabırğaları çanağa doğru bükün — onurğanı əyin, budları yox.","Aşağıda bərk nəfəs verin, nəzarətlə geri qalxın."],
  mist:["Qollarla dartınmaq.","Qarını bükmək əvəzinə budlardan əyilmək.","Tələsmək — bu hərəkətdə əsas olan sıxılmadır."]},

/* ================= state & persistence ================= */
/* Bump when PROGRAM's day->exercise mapping changes. applyLoaded() uses it to
   retire an in-progress session whose exercise keys no longer match its day. */
const PROGRAM_VERSION = 3;
/* profile.w is SEED-ONLY: written during first-run setup, then never read again.
   state.weights[] is the single source of truth for bodyweight — see latestW().
   plan/userEx: the user's own program edits (Plan tab). plan[D] absent = default day. */
const DEFAULTS = { profile:{name:"Elvin",age:"",h:"",w:"",act:1.375,sur:350,sex:"m",weeklyTarget:4},
  weights:[], sessions:[], active:null, supps:[], deloadAt:null, plan:null, userEx:{}, pv:PROGRAM_VERSION };
let state = JSON.parse(JSON.stringify(DEFAULTS));
let storageOK = true, saveT = null;

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtD = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("az",{day:"numeric",month:"short"}); };
/* ================= proqramın qurulması =================
   PROGRAM sabit deyil: standart plan (PROGRAM_DEF) + istifadəçinin Plan bölməsindəki
   dəyişiklikləri (state.plan) + öz hərəkətləri (state.userEx) birləşdirilərək yığılır.
   Plan dəyişdikdə buildProgram() yenidən çağırılır — başqa heç nəyə toxunmadan. */
let PROGRAM = {};
const EXMAP = {};
function libEx(k){ return (state.userEx && state.userEx[k]) || LIB[k] || null; }
function libKeys(){ return Object.keys(LIB).concat(Object.keys(state.userEx||{})); }
function defSlot(k){ const e = libEx(k) || {}; return { k, sets:e.sets||3, rMin:e.rMin||10, rMax:e.rMax||12, rest:e.rest||90 }; }
function daySlots(D){
  const custom = state.plan && state.plan[D];
  if(Array.isArray(custom)) return custom.filter(s => libEx(s.k));
  return (PROGRAM_DEF[D] || []).map(defSlot);
}
function mkEx(sl, D){
  const e = libEx(sl.k) || { name:sl.k, tag:"" };
  return { ...e, key:sl.k, day:D,
    sets:Math.max(1, +sl.sets||1), rMin:Math.max(1, +sl.rMin||1), rMax:Math.max(1, +sl.rMax||1),
    rest:Math.max(15, +sl.rest||60), inc:e.inc || 2.5,
    cues:e.cues || [], mist:e.mist || [], bodyweight:!!e.bodyweight };
}
function buildProgram(){
  PROGRAM = {};
  DAYS.forEach(D => { PROGRAM[D] = { ...DAY_META[D], ex: daySlots(D).map(sl => mkEx(sl, D)) }; });
  /* EXMAP hər hərəkəti tanıyır — plandan çıxarılanları da, çünki tarixçə və qrafiklər
     köhnə açarların adını buradan oxuyur. Plandakılar öz günündəki resepti daşıyır. */
  Object.keys(EXMAP).forEach(k => delete EXMAP[k]);
  libKeys().forEach(k => { EXMAP[k] = mkEx(defSlot(k), null); });
  DAYS.forEach(D => PROGRAM[D].ex.forEach(ex => {
    EXMAP[ex.key] = ex;
    /* alternativ slotun dövr/təkrar/istirahətini götürür, öz artım addımını saxlayır */
    (ALT_OF[ex.key] || []).forEach(ak => {
      if(libEx(ak)) EXMAP[ak] = mkEx({ k:ak, sets:ex.sets, rMin:ex.rMin, rMax:ex.rMax, rest:ex.rest }, D);
    });
  }));
}
buildProgram();   /* standart plan — loadState() məlumatı gətirəndə yenidən qurulur */

/* tarixçədə adı olan, lakin kitabxanadan çıxarılmış hərəkətlər üçün ad tapıcısı */
function exName(k){
  if(EXMAP[k]) return EXMAP[k].name;
  for(let i=state.sessions.length-1;i>=0;i--){
    const f = state.sessions[i].ex.find(e => e.key===k);
    if(f) return f.name;
  }
  return k;
}
/* Session length from the prescription itself, so it can never drift from PROGRAM.
   ~40 s under the bar per working set + the prescribed rest after each. Warm-up ramp is extra. */
function dayMinutes(D){
  const ex = PROGRAM[D].ex;
  const sets = ex.reduce((a,e)=>a+e.sets,0);
  const rest = ex.reduce((a,e)=>a+e.sets*e.rest,0);
  return Math.round((sets*40 + rest)/60/5)*5;
}
/* aktiv məşqdə slot üçün seçilmiş effektiv hərəkət (əsas və ya alternativ) */
function effEx(slotKey){
  const ak = state.active && state.active.swap && state.active.swap[slotKey];
  return (ak && EXMAP[ak]) ? EXMAP[ak] : EXMAP[slotKey];
}
function openSwap(slotKey){

  const cur = effEx(slotKey).key;

      return `<button class="swopt ${o.key===cur?"on":""}" onclick="chooseEx('${slotKey}','${o.key}')">
        ${exImg(o,"exanim sm")}

        <span class="swck">${o.key===cur?"✓":""}</span>

    <div class="small">Daimi dəyişiklik istəyirsinizsə — <b style="color:var(--ink)">Plan</b> bölməsindən bu slotu tamamilə əvəz edin.</div>
    <button class="btn block ghost" style="margin-top:10px" onclick="closeSheet()">Bağla</button>`;
  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
}
function chooseEx(slotKey, key){
  if(key===slotKey){ if(state.active.swap) delete state.active.swap[slotKey]; }
  else { state.active.swap = state.active.swap || {}; state.active.swap[slotKey] = key; }
  const sug = suggestKg(key);
  state.active.ex[slotKey].forEach(s=>{ if(!s.done){ s.kg = sug ?? ""; s.reps = ""; } });
  closeSheet(); save(); renderTrain();
  toast(`Seçildi: ${EXMAP[key].name}`);
}

let migrationNote = "";
/* Silently upgrade any older forge-data shape. Never drops sessions/weights/supps. */
function migrate(s, fromPv){
  /* sex + weekly target: existing users keep the old hardcoded behaviour */
  if(!s.profile.sex) s.profile.sex = "m";
  if(!s.profile.weeklyTarget) s.profile.weeklyTarget = 4;
  if(s.deloadAt === undefined) s.deloadAt = null;
  if(!s.userEx || typeof s.userEx !== "object") s.userEx = {};
  if(s.plan !== null && typeof s.plan !== "object") s.plan = null;
  /* every-other-day split: 3 sessions/week was the A/B/C target, 3-4 is the PPL+full one */
  if(fromPv < 3 && s.profile.weeklyTarget == 3) s.profile.weeklyTarget = 4;

  /* bodyweight: profile.w was a second source of truth. Seed weights[] from it once. */
  if(!s.weights.length && parseFloat(s.profile.w)){
    s.weights.push({ d: todayISO(), kg: parseFloat(s.profile.w), ts: 0 });
  }
  s.weights.forEach(w => { if(w.ts === undefined) w.ts = 0; });

  /* PROGRAM restructure: an active session holds sets keyed by exercise, but
     renderTrain() walks the NEW day's exercise list. Keys that moved days would
     read undefined and throw. Retire the unfinished session; history is untouched. */
  if(fromPv < PROGRAM_VERSION && s.active){
    const dayKeys = (PROGRAM[s.active.day] ? PROGRAM[s.active.day].ex.map(e=>e.key) : null);
    /* dayKeys === null means the day itself no longer exists (A/B/C -> P/L/G/F) */
    const stale = dayKeys === null || dayKeys.some(k => !s.active.ex[k]);
    if(stale){
      s.active = null;
      migrationNote = "Proqram yeniləndi: artıq İtələmə → Çəkmə → Ayaq → Tam bədən bölgüsü işləyir, "
        + "bir gün məşq, bir gün istirahət. Yarımçıq qalmış məşq ləğv edildi, çünki günlərin hərəkətləri dəyişib. "
        + "Bitmiş məşq tarixçəniz və bütün çəki qeydləriniz olduğu kimi qalıb. "
        + "Hərəkətləri bəyənmirsinizsə — aşağıdakı <b>PLAN</b> bölməsindən hamısını özünüz qura bilərsiniz.";
    }
  }
  s.pv = PROGRAM_VERSION;
  return s;
}
function applyLoaded(v){
  if(!v) return;
  const d = JSON.parse(v);
  /* Read pv from the RAW payload. Reading it after the DEFAULTS spread would always
     see the current version — a pre-versioning save has no pv key at all, and
     JSON.stringify drops an explicit undefined, so the default would mask it. */
  const fromPv = d.pv || 1;
  state = migrate({...JSON.parse(JSON.stringify(DEFAULTS)), ...d, profile:{...DEFAULTS.profile, ...(d.profile||{})}}, fromPv);
  buildProgram();   /* the loaded state may carry the user's own plan */
}
async function loadState(){
  try{ /* inside Claude: artifact storage */
    if(typeof window.storage !== "undefined"){
      const r = await window.storage.get("forge-data");
      applyLoaded(r && r.value);
      return;
    }
  }catch(e){ /* fall through to localStorage — do NOT return, that skips the fallback */ }
  try{ /* self-hosted website: browser localStorage */
    applyLoaded(localStorage.getItem("forge-data"));
    return;
  }catch(e){}
  storageOK = false;
}
function save(){
  state.ts = Date.now();      /* set synchronously so a checkpoint cloudPush() right
                                 after save() ships the new timestamp, not the old one */
  if(sbUser) cloudDirty = true;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    const json = JSON.stringify(state);
    /* LOCAL ONLY. The cloud is pushed at checkpoints (finishSession, addWeight,
       delSession, delWeight, sign-in, import, deload) plus a 60 s idle retry — a
       per-keystroke network write drains the battery on weak gym signal. */
    try{
      if(typeof window.storage !== "undefined"){ await window.storage.set("forge-data", json); return; }
      localStorage.setItem("forge-data", json);
    }catch(e){ if(storageOK){ storageOK=false; renderSaveNote(); } }
  }, 350);
}

  const el = $("#saveNote"); if(!el) return;

/* ================= cloud sync (Supabase) =================
   localStorage is the fast/offline store and is written on every change.
   The cloud is pushed only at meaningful checkpoints (see cloudPush callers) and
   on a 60 s idle timer, so typing in a number field does not ship state per keystroke.
   Pulls are a real field-level MERGE, not last-write-wins — see mergeState(). */
const SB_URL = "https://jcavlzmsnwaqbaduhtkj.supabase.co";  // Supabase Project URL
const SB_KEY = "sb_publishable_Uoe0k2MtlM8gRcFo6T8sWA_jF1KNqpB";  // Supabase publishable (anon) key

/* ---- merge: union by natural key, never destructive ---- */
function mergeState(local, remote){
  if(!remote) return local;
  const out = {...local};

  /* sessions keyed on date+day; on collision keep the record with more logged sets */
  const setsOf = r => (r.ex||[]).reduce((a,e)=>a+(e.sets?e.sets.length:0), 0);
  const smap = new Map();
  (local.sessions||[]).forEach(s=>smap.set(s.d+"|"+s.day, s));
  (remote.sessions||[]).forEach(s=>{
    const k = s.d+"|"+s.day, cur = smap.get(k);
    if(!cur || setsOf(s) > setsOf(cur)) smap.set(k, s);
  });
  out.sessions = [...smap.values()].sort((a,b)=>a.d<b.d?-1:1);

  /* weights keyed on date; on collision keep the later ts */
  const wmap = new Map();
  (local.weights||[]).forEach(w=>wmap.set(w.d, w));
  (remote.weights||[]).forEach(w=>{
    const cur = wmap.get(w.d);
    if(!cur || (w.ts||0) > (cur.ts||0)) wmap.set(w.d, w);
  });
  out.weights = [...wmap.values()].sort((a,b)=>a.d<b.d?-1:1);

  /* supps keyed on date; OR the booleans so a tick on either device survives */
  const pmap = new Map();
  (local.supps||[]).forEach(s=>pmap.set(s.d, {...s}));
  (remote.supps||[]).forEach(s=>{
    const cur = pmap.get(s.d);
    if(!cur) pmap.set(s.d, {...s});
    else { cur.creatine = cur.creatine || s.creatine; cur.protein = cur.protein || s.protein; }
  });
  out.supps = [...pmap.values()].sort((a,b)=>a.d<b.d?-1:1);

  /* profile + deload marker + the user's own program: last-write-wins on ts is acceptable */
  if((remote.ts||0) > (local.ts||0)){
    out.profile = {...local.profile, ...(remote.profile||{})};
    if(remote.deloadAt && (!local.deloadAt || remote.deloadAt > local.deloadAt)) out.deloadAt = remote.deloadAt;
    if(remote.plan !== undefined) out.plan = remote.plan;
    out.userEx = {...(local.userEx||{}), ...(remote.userEx||{})};
  } else {
    out.userEx = {...(remote.userEx||{}), ...(local.userEx||{})};
  }
  /* active is NEVER merged — an in-progress workout on this device must survive a sync */
  out.active = local.active;
  out.ts = Math.max(local.ts||0, remote.ts||0);
  return out;
}

/* Was named cloudMerge while doing whole-state replacement. It merges now. */
async function cloudSync(){
  if(!sb || !sbUser) return;
  try{
    const { data, error } = await sb.from("forge_data").select("data,updated_at").eq("user_id", sbUser.id).maybeSingle();
    if(error){
      /* a duplicate user_id row makes maybeSingle() throw — that is a schema fault,
         not a transient one, and it must not fail quietly in a card nobody opens */
      sbStatus = "xəta";
      toast("Bulud oxunmadı: " + (error.message||"naməlum xəta"));
      return;
    }
    const remote = data && data.data ? data.data : null;
    if(remote){
      const before = JSON.stringify(state);
      state = mergeState(state, remote);
      state.pv = PROGRAM_VERSION;
      buildProgram();
      if(JSON.stringify(state) !== before){
        try{ localStorage.setItem("forge-data", JSON.stringify(state)); }catch(e){}
      }
    }
    sbStatus = "sinxrondur";
    await cloudPush(true);
  }catch(e){ sbStatus = "oflayn"; cloudDirty = true; }
}

/* Checkpoint push. Debounced ~10 s; pass immediate=true to skip the wait. */
function cloudPush(immediate){
  if(!sb || !sbUser){ return Promise.resolve(); }
  clearTimeout(pushT);
  if(!immediate){ pushT = setTimeout(()=>doPush(), 10000); return Promise.resolve(); }
  return doPush();
}
async function doPush(){
  if(!sb || !sbUser || pushing) return;
  pushing = true;
  try{
    const { error } = await sb.from("forge_data")
      .upsert({ user_id: sbUser.id, data: state, updated_at: new Date().toISOString() },
              { onConflict: "user_id" });   /* needs the unique constraint — see SQL */
    if(error){ cloudDirty = true; sbStatus = "gözləyir"; }
    else { cloudDirty = false; sbStatus = "sinxrondur"; }
  }catch(e){ cloudDirty = true; sbStatus = "oflayn"; }
  pushing = false;
}
/* idle heartbeat + retry when the network comes back */
setInterval(()=>{ if(sbUser && cloudDirty) doPush(); }, 60000);
window.addEventListener("online", ()=>{ if(sbUser && cloudDirty) doPush(); renderNet(); });
window.addEventListener("offline", ()=>renderNet());

/* RLS smoke test: ask for a row that is definitely not ours. With the policy in place
   this returns empty. If it returns data, every user's rows are world-readable. */
async function rlsProbe(){
  try{
    const { data, error } = await sb.from("forge_data").select("user_id").neq("user_id", sbUser.id).limit(1);
    if(!error && data && data.length){
      sbWarn = "⚠ TƏHLÜKƏSİZLİK: bulud bazasında RLS (Row Level Security) aktiv deyil — başqa istifadəçilərin qeydləri bu açarla oxuna bilir. Supabase-də siyasəti tətbiq edin.";
      refresh();
    }
  }catch(e){}
}

/* ================= tiny utils ================= */
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2400); }
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
/* state.weights[] is the ONLY source of truth. profile.w is seed-only and never read here
   — migrate() copies it into weights[] once for users created before this split. */
function latestW(){ return state.weights.length ? state.weights[state.weights.length-1].kg : null; }
/* single writer for bodyweight: Bugün, Qida and Proqres all funnel through this */
function setWeight(v){
  if(!(v>=25 && v<=350)) return false;
  const t = todayISO(), ex = state.weights.find(x=>x.d===t);
  if(ex){ ex.kg = v; ex.ts = Date.now(); }
  else state.weights.push({ d:t, kg:v, ts:Date.now() });
  state.weights.sort((a,b)=>a.d<b.d?-1:1);
  state.profile.w = v; /* kept in sync only so old exports still round-trip */
  return true;
}
function e1rm(kg,reps){ return kg*(1+reps/30); }
function nextDay(){
  if(state.active) return state.active.day;
  if(!state.sessions.length) return DAYS[0];
  const last = state.sessions[state.sessions.length-1].day;
  /* an A/B/C session from the old program gives indexOf === -1, which lands on DAYS[0] */
  return DAYS[(DAYS.indexOf(last)+1) % DAYS.length];
}
/* ---- bir gün məşq, bir gün istirahət ----
   Cədvəl təqvimə yox, son məşqə bağlıdır: son məşqdən 2 gün sonra növbəti məşq.
   Gecikmisinizsə növbəti məşq günü elə bu gündür — cərimə yoxdur, sıra pozulmur. */
function addDaysISO(iso, n){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d); dt.setDate(dt.getDate()+n);
  return isoOf(dt);
}
function nextTrainISO(){
  if(state.active || !state.sessions.length) return todayISO();
  const nxt = addDaysISO(state.sessions[state.sessions.length-1].d, 2);
  return nxt < todayISO() ? todayISO() : nxt;
}
function isRestToday(){ return nextTrainISO() > todayISO(); }
/* növbəti 7 gün: məşq günləri nextTrainISO()-dan başlayaraq bir gündən bir */
function scheduleStrip(){
  const start = nextTrainISO(), out = [];
  for(let i=0;i<7;i++){
    const iso = addDaysISO(todayISO(), i);
    const diff = Math.round((new Date(iso) - new Date(start)) / 86400000);
    out.push({ iso, on: diff>=0 && diff%2===0 });
  }
  return out;
}
/* Foundation day 1 is deliberately submaximal (halved sets, ~50-60% effort). Feeding it
   to the progression math anchors every later session to a light baseline, so progression
   lookups skip it. History and charts pass includeFoundation:true and still show it. */
function lastPerf(key, opts = {}){
  for(let i=state.sessions.length-1;i>=0;i--){
    if(state.sessions[i].foundation && !opts.includeFoundation) continue;
    const f = state.sessions[i].ex.find(e=>e.key===key);
    if(f && f.sets.length) return { d:state.sessions[i].d, sets:f.sets };
  }
  return null;
}
/* true when the only record we hold for this lift is the foundation session */
function onlyFoundation(key){
  return !lastPerf(key) && !!lastPerf(key, {includeFoundation:true});
}
function perfStr(p){ return p.sets.map(s=>`${s.kg>0?s.kg:"BÇ"}×${s.reps}`).join(", "); }
function suggestKg(key){
  const p = lastPerf(key), ex = EXMAP[key];
  if(!p) return null;
  const top = Math.max(...p.sets.map(s=>s.kg));
  /* unloaded movement: progression is reps, not load — never suggest 0+inc */
  if(ex.bodyweight && !(top>0)) return 0;
  const allTop = p.sets.every(s=>s.reps>=ex.rMax);
  return Math.round((allTop ? top+ex.inc : top)*10)/10;
}
function hintFor(ex, p){
  if(!p){
    if(onlyFoundation(ex.key)) return { cls:"", txt:"Təməl məşqi qeydə alındı — o, qəsdən yüngül idi, ona görə proqressiya bazası sayılmır. Bu gün <b>real iş çəkisi</b> seçin: son təkrardan sonra hələ ~2 təkrar edə biləcəyiniz çəki. Artım bundan sonra başlayır." };
    return { cls:"", txt:"İlk dəfə: ~2 əlavə təkrar edə biləcəyiniz çəki seçin. Qeyd edin — davamını mən götürəcəyəm." };
  }
  const sug = suggestKg(ex.key);
  const allTop = p.sets.every(s=>s.reps>=ex.rMax);
  if(ex.bodyweight && !(sug>0)){
    if(allTop) return { cls:"up", txt:`Bədən çəkisi ilə bütün dövrlərdə ${ex.rMax} təkrara çatdınız — indi <b>disk əlavə edin</b> (2.5-5 kq) və yenidən ${ex.rMin} təkrardan başlayın.` };
    return { cls:"", txt:`Bədən çəkisi ilə işləyin — kq xanasını boş buraxın. Hədəf: hər dövrdə <b>${ex.rMax} təkrar</b>. Çatanda növbəti dəfə disk əlavə edəcəksiniz.` };
  }
  if(allTop) return { cls:"up", txt:`Bu gün bütün dövrlər: <b>${sug} kq</b> (+${ex.inc} kq) — keçən dəfə hamısı ${ex.rMax} təkrara çatdı. Haqq etmisiniz.` };
  return { cls:"", txt:`Bu gün bütün dövrlər: <b>${sug} kq</b> — çəkini saxlayın, hər dövrdə ${ex.rMax} təkrara doğru çalışın. Proqres = əvvəl təkrar, sonra çəki.` };
}
const r25 = v => Math.round(v/2.5)*2.5;
/* Rolling 7 days, not since-Monday: training every other day drifts across the calendar
   week and a Monday anchor would report 2/3 on a perfectly on-schedule week. */
function weekCount(){
  const cut = new Date(); cut.setHours(0,0,0,0); cut.setDate(cut.getDate()-6);
  return state.sessions.filter(s=>{ const [y,m,d]=s.d.split("-").map(Number); return new Date(y,m-1,d)>=cut; }).length;
}
function weeklyTarget(){ return parseInt(state.profile.weeklyTarget) || 4; }
/* Deload: RULES advises a light week every 6-8 weeks. Every-other-day training is
   ~3.5 sessions/week, so 6-8 weeks is ~21-28; we prompt at 24 counting only real
   (non-foundation) sessions. */
const DELOAD_EVERY = 24;
function sinceDeload(){
  const real = state.sessions.filter(s=>!s.foundation);
  if(!state.deloadAt) return real.length;
  return real.filter(s=>s.d > state.deloadAt).length;
}
function deloadDue(){ return sinceDeload() >= DELOAD_EVERY; }
function dismissDeload(){
  state.deloadAt = todayISO();
  save(); cloudPush(); renderToday();
  toast("Qeyd edildi — sayğac sıfırlandı");
}
function profileDone(){ const p=state.profile; return p.name && p.age && p.h && (p.w || state.weights.length); }
function isFirstEver(){ return state.sessions.length===0; }
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function suppToday(kind){ const e=state.supps.find(x=>x.d===todayISO()); return !!(e && e[kind]); }
function toggleSupp(kind){
  const t = todayISO();
  let e = state.supps.find(x=>x.d===t);
  if(!e){ e = {d:t, creatine:false, protein:false}; state.supps.push(e); state.supps.sort((a,b)=>a.d<b.d?-1:1); }
  e[kind] = !e[kind];
  save(); renderToday();
}
function suppStreak(kind){
  let n=0, d=new Date();
  while(true){
    const e = state.supps.find(x=>x.d===isoOf(d));
    if(!e || !e[kind]) break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `forge-${todayISO()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  toast("Fayl yükləndi");
}
function importData(input){
  const file = input.files && input.files[0];
  input.value = ""; /* so re-picking the same file fires change again */
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d;
    try{ d = JSON.parse(rd.result); }catch(e){ info("Fayl oxunmadı", "Düzgün FORGE .json faylı seçin."); return; }
    if(!d || typeof d !== "object" || !Array.isArray(d.sessions) || !Array.isArray(d.weights)){
      info("Fayl uyğun deyil", "Bu FORGE yedək faylına oxşamır (sessions/weights tapılmadı)."); return;
    }
    const ns = d.sessions.length, nw = d.weights.length, nsp = Array.isArray(d.supps) ? d.supps.length : 0;
    ask("Fayldan birləşdirilsin?", `${ns} məşq · ${nw} çəki qeydi · ${nsp} əlavə günü\n\nMövcud qeydləriniz silinmir — yalnız çatışmayanlar əlavə olunur.`, "Birləşdir", ()=>{
      state = mergeState(state, migrate({...JSON.parse(JSON.stringify(DEFAULTS)), ...d, profile:{...DEFAULTS.profile, ...(d.profile||{})}}, d.pv || 1));
      buildProgram();
      save(); cloudPush(); refresh();
      toast(`Birləşdirildi — ${state.sessions.length} məşq, ${state.weights.length} çəki qeydi`);
    });
  };
  rd.readAsText(file);
}
function saveSetup(){
  const p = state.profile;
  p.name = $("#su-name").value.trim() || "İdmançı";
  p.age = parseFloat($("#su-age").value)||"";

  if(p.w && !state.weights.length) state.weights.push({d:todayISO(), kg:p.w});
  save(); toast("Protokol hazırdır 💪"); renderToday();
}
function addWeight(inputId){

/* ================= MƏŞQ VAXTI =================
   Problem: bəzən taymeri başlatmağı və ya bitirməyi unudursunuz.
   Həll: vaxt düymələrdən yox, QEYDLƏRDƏN hesablanır. Başlanğıc + hər işarələnmiş
   dövrün vaxtı nöqtə kimi saxlanılır; qonşu nöqtələr arasındakı fasilə 20 dəqiqədən
   çox olarsa, yalnız 20 dəqiqə sayılır. Beləliklə:
     · “Bitir”i basmağı unutsanız — saatlarla açıq qalan məşq vaxtı şişirtmir.
     · Zalda uzun söhbət/gözləmə olsa — o boşluq da kəsilir.
     · Başlatmağı unutsanız — başlanğıcı geriyə sürüşdürə bilirsiniz (aşağıda).
   Rəqəm “zalda keçən real vaxt”dır, ilk qeyddən sonuncu qeydə qədər. */
const GAP_CAP = 20*60000;   /* dövrlər arası ən çox sayılan fasilə */
const TAIL_CAP = 5*60000;   /* sonuncu dövrdən “Bitir”ə qədər sayılan vaxt */
function sessionMarks(a){
  const m = [];
  if(a && a.startedAt) m.push(a.startedAt);
  Object.values((a && a.ex) || {}).forEach(sets => sets.forEach(s => { if(s.t) m.push(s.t); }));
  return m.sort((x,y)=>x-y);
}
function sessionMinutes(a, tailCap){
  const m = sessionMarks(a);
  if(!m.length) return null;
  let tot = 0;
  for(let i=1;i<m.length;i++) tot += Math.min(m[i]-m[i-1], GAP_CAP);
  if(tailCap) tot += Math.min(Date.now()-m[m.length-1], tailCap);
  return Math.round(tot/60000);
}
function lastMark(a){ const m = sessionMarks(a); return m.length ? m[m.length-1] : 0; }
/* açıq qalmış məşq: sonuncu qeyddən 3 saatdan çox keçib */
function staleHours(){
  const a = state.active; if(!a) return 0;
  const l = lastMark(a); if(!l) return 0;
  const h = (Date.now()-l)/3600000;
  return h >= 3 ? h : 0;
}
function hm(min){
  if(min==null) return "—";
  return min >= 60 ? `${Math.floor(min/60)} sa ${min%60} dəq` : `${min} dəq`;
}
function clockChip(){
  const a = state.active; if(!a) return "";
  const live = sessionMinutes(a, staleHours() ? 0 : GAP_CAP);   /* açıq qalıbsa quyruq sayılmır */
  const idle = Math.round((Date.now()-lastMark(a))/60000);
  return `<div class="clock" onclick="openClockFix()">
    <span class="cl-l">Zalda</span><b class="num">${hm(live)}</b>
    <span class="cl-r">${idle>=10?`son qeyddən ${idle} dəq`:"davam edir"} · düzəlt</span></div>`;
}
function openClockFix(){
  const a = state.active; if(!a) return;
  const st = new Date(a.startedAt||Date.now());
  $("#sheet").innerHTML = `<div class="grab"></div>
    <h3>Məşq vaxtı</h3>
    <div class="stag">Başlanğıc: ${String(st.getHours()).padStart(2,"0")}:${String(st.getMinutes()).padStart(2,"0")} · hesablanan: ${hm(sessionMinutes(a, staleHours() ? 0 : GAP_CAP))}</div>
    <div class="small" style="margin:8px 0 12px">Zala girəndə tətbiqi açmağı unutmusunuzsa, başlanğıcı geriyə sürüşdürün. Vaxt onsuz da qeydlərdən hesablanır: dövrlər arasındakı 20 dəqiqədən uzun boşluqlar sayılmır, ona görə “Bitir”i basmağı unutmağınız nəticəni pozmur.</div>
    <div class="chips fil">
      <span class="pick" onclick="shiftStart(-5)">−5 dəq</span>
      <span class="pick" onclick="shiftStart(-10)">−10 dəq</span>
      <span class="pick" onclick="shiftStart(-15)">−15 dəq</span>
      <span class="pick" onclick="shiftStart(5)">+5 dəq</span>
    </div>
    <button class="btn block ghost" style="margin-top:12px" onclick="closeSheet()">Bağla</button>`;
  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
}
function shiftStart(min){
  const a = state.active; if(!a || !a.startedAt) return;
  const first = sessionMarks(a).filter(t=>t!==a.startedAt)[0] || Date.now();
  a.startedAt = Math.min(Math.max(a.startedAt + min*60000, Date.now()-8*3600000), first);
  save(); openClockFix(); renderTrain();
  toast("Başlanğıc düzəldildi: " + hm(sessionMinutes(a, staleHours() ? 0 : GAP_CAP)));
}
/* açıq qalmış məşq üçün xəbərdarlıq kartı (Bugün və Məşq səhifələrində) */
function staleCard(){
  const h = staleHours(); if(!h) return "";
  const a = state.active;
  return `<div class="warnnote">
    <b>Məşq hələ də açıqdır.</b> Sonuncu dövr ${Math.round(h)} saat əvvəl qeyd edilib —
    yəqin “Bitir”i basmağı unutmusunuz. Real vaxt buna görə şişmir: hesablanan müddət
    <b>${hm(sessionMinutes(a, 0))}</b>.
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn sm" style="flex:1" onclick="finishSession()">Bitir və yadda saxla</button>
      <button class="btn sm ghost" style="flex:1" onclick="switchTab('train')">Davam edirəm</button>
    </div></div>`;
}
/* canlı saat: yalnız aktiv məşq varkən və səhifə görünəndə işləyir */
setInterval(()=>{
  if(!state.active || document.hidden) return;

/* ================= TRAIN ================= */
function renderTrain(){
  if(viewDay===null) viewDay = nextDay();
  if(state.active) viewDay = state.active.day;
  if(!PROGRAM[viewDay]) viewDay = nextDay();
  const D = PROGRAM[viewDay];
  const days = DAYS.map(k=>`<button class="daysel ${state.active&&state.active.day!==k?"lock":""}" onclick="selDay('${k}')" aria-label="${DAY_META[k].name}">
      <span class="plate plate-${DAY_META[k].cls} ${viewDay===k?"on":""}"><span>${DAY_META[k].letter}</span></span>
      <b>${DAY_META[k].name.split(" · ")[0]}</b></button>`).join("");

  const rules = `<details class="rules"><summary>Məşqçinin qaydaları — bir dəfə oxuyun</summary><div class="inner">
      <div class="rule" style="border-bottom:1px solid var(--line)"><p style="padding-top:10px">${WARMUP}</p></div>
      ${RULES.map(r=>`<div class="rule"><b>${r.t}</b><p>${r.d}</p></div>`).join("")}
    </div></details>`;

  let body;
  if(state.active && state.active.day===viewDay){
    body = D.ex.map((ex,i)=>{
      const eff = effEx(ex.key), swapped = eff.key!==ex.key;
      const p = lastPerf(eff.key), st = state.active.ex[ex.key];
      const rows = st.map((s,si)=>{
        const pkg = smartKg(ex.key,si), prep = smartReps(ex.key,si);
        const kgPh = (pkg!=null && pkg>0) ? pkg : (eff.bodyweight ? "BÇ" : "kq");
        return `<div class="setrow">
          <div class="idx num">${si+1}</div>
          <div class="stepper">
            <button onclick="stepVal('${ex.key}',${si},'kg',-1)" aria-label="minus kg">−</button>
            <input id="in-${ex.key}-${si}-kg" type="number" inputmode="decimal" step="0.5" placeholder="${kgPh}" value="${s.kg}" oninput="setVal('${ex.key}',${si},'kg',this.value)">
            <button onclick="stepVal('${ex.key}',${si},'kg',1)" aria-label="plus kg">+</button>
          </div>
          <div class="stepper">
            <button onclick="stepVal('${ex.key}',${si},'reps',-1)" aria-label="minus reps">−</button>
            <input id="in-${ex.key}-${si}-reps" type="number" inputmode="numeric" placeholder="${prep}" value="${s.reps}" oninput="setVal('${ex.key}',${si},'reps',this.value)">
            <button onclick="stepVal('${ex.key}',${si},'reps',1)" aria-label="plus reps">+</button>
          </div>
          <button id="ck-${ex.key}-${si}" class="check ${s.done?"done":""}" onclick="toggleDone('${ex.key}',${si})" aria-label="set done">✓</button>
        </div>`;
      }).join("");
      const h = hintFor(eff,p);
      const wk = parseFloat(st[0].kg) || suggestKg(eff.key);
      const ramp = (eff.rest>=120 && wk && wk>=30) ? `<div class="ramp">Qızışma dövrləri: <b class="num">${r25(wk*0.4)} kq × 8 → ${r25(wk*0.6)} kq × 5 → ${r25(wk*0.8)} kq × 3</b> — sonra iş dövrləri (sayılmır)</div>` : "";
      return `<div class="card ex" style="--dc:var(--${D.cls})">
        <div class="exhead"><div class="exname">
          ${exImg(eff,"exanim sm")}
          <div>
            <div class="name">${i+1}. ${esc(eff.name)}</div>
            <div class="meta"><span class="tag hot">${eff.sets} × ${eff.rMin}-${eff.rMax}</span><span class="tag">⏱ ${Math.round(eff.rest/60*10)/10} dəq</span>${swapped?`<span class="tag swp">alternativ</span>`:`<span class="tag">${esc(eff.tag||"")}</span>`}</div>
          </div>
        </div><div class="exbtns"><button class="techbtn" onclick="openTech('${viewDay}',${i})">Texnika</button>${(ALT_OF[ex.key]||[]).length?`<button class="techbtn" onclick="openSwap('${ex.key}')" aria-label="alternativ hərəkət seç">⇄ Dəyiş</button>`:""}</div></div>
        ${p?`<div class="lastline">Son (${fmtD(p.d)}): <b class="num">${perfStr(p)}</b></div>`:""}
        <div class="hint ${h.cls}">${h.txt}</div>
        ${ramp}
        <div class="sethdr"><div>Dövr</div><div>kq</div><div>Təkrar</div><div>✓</div></div>
        ${rows}
      </div>`;
    }).join("");
    body += `<button class="btn block" style="margin-top:6px" onclick="finishSession()">Bitir və yadda saxla</button>
             <button class="btn block danger" style="margin-top:10px" onclick="cancelSession()">Məşqi ləğv et</button>`;
  } else {
    body = D.ex.map((ex,i)=>{
        const p = lastPerf(ex.key), h = hintFor(ex,p);
        return `<div class="card ex" style="--dc:var(--${D.cls})">
          <div class="exhead"><div class="exname">
            ${exImg(ex,"exanim sm")}
            <div>
              <div class="name">${i+1}. ${esc(ex.name)}</div>
              <div class="meta"><span class="tag hot">${ex.sets} × ${ex.rMin}-${ex.rMax}</span><span class="tag">⏱ ${Math.round(ex.rest/60*10)/10} dəq</span><span class="tag">${esc(ex.tag||"")}</span></div>
            </div>
          </div><button class="techbtn" onclick="openTech('${viewDay}',${i})">Texnika</button></div>
          ${p?`<div class="lastline">Son (${fmtD(p.d)}): <b class="num">${perfStr(p)}</b></div>`:""}
          <div class="hint ${h.cls}">${h.txt}</div>
        </div>`;
      }).join("") +
      `<button class="btn block" style="margin-top:6px" onclick="startSession('${viewDay}')">${D.name} başla</button>`;
  }

  $("#view-train").innerHTML = `
    <div class="dayrow">${days}</div>
    ${state.active && state.active.day===viewDay ? clockChip() : ""}
    ${staleCard()}
    ${rules}
    <div class="sect">${D.name} · ${D.sub}</div>
    ${(state.active ? state.active.foundation : isFirstEver()) ? `<div class="warnnote">${FOUNDATION_NOTE}</div>` : ""}
    ${warmupCard(viewDay)}
    ${body}`;
}
function selDay(k){ if(state.active && state.active.day!==k){ toast("Əvvəlcə cari məşqi bitirin və ya ləğv edin"); return; } viewDay=k; renderTrain(); }
function startSession(day){
  const foundation = isFirstEver();
  const exState = {};
  PROGRAM[day].ex.forEach(ex=>{
    const sug = suggestKg(ex.key);
    const setCount = foundation ? Math.max(2, Math.round(ex.sets/2)) : ex.sets;
    exState[ex.key] = Array.from({length:setCount},()=>({ kg: sug ?? "", reps:"", done:false }));
  });
  /* startedAt: saat “Başla”dan işə düşür. Zala gec açmısınızsa Məşq səhifəsindəki
     saat çipindən geriyə sürüşdürün — openClockFix(). */
  state.active = { day, started: todayISO(), startedAt: Date.now(), warmDone: false, ex: exState, foundation };
  viewDay = day; save(); switchTab("train");
  toast(foundation ? "Təməl məşqi başladı — yüngül saxlayın." : `${PROGRAM[day].name} başladı · saat işə düşdü.`);
}
function setVal(key,i,f,v){ state.active.ex[key][i][f] = v; save(); }
function smartKg(key,i){
  const st = state.active.ex[key];
  for(let j=i-1;j>=0;j--){ const v=parseFloat(st[j].kg); if(v) return v; }
  const p = lastPerf(effEx(key).key);
  if(p) return p.sets[i]?.kg ?? p.sets[p.sets.length-1].kg;
  return null;
}
function smartReps(key,i){
  const st = state.active.ex[key];
  for(let j=i-1;j>=0;j--){ const v=parseFloat(st[j].reps); if(v) return v; }
  return EXMAP[key].rMax;
}
function stepVal(key,i,f,dir){
  const s = state.active.ex[key][i];
  const step = f==="kg" ? (EXMAP[key].inc || 2.5) : 1;
  let v = parseFloat(s[f]);
  if(!v){ v = f==="kg" ? (smartKg(key,i) ?? step) : smartReps(key,i); } /* first tap = accept suggestion */
  else v += dir*step;
  v = Math.max(0, Math.round(v*10)/10);
  s[f] = String(v);
  const inp = document.getElementById(`in-${key}-${i}-${f}`);
  if(inp) inp.value = v;
  save();
}
function toggleDone(key,i){
  const s = state.active.ex[key][i]; s.done = !s.done;
  if(s.done){
    s.t = Date.now();   /* real vaxt bu nöqtələrdən hesablanır — sessionMinutes() */
    /* carrying the previous set's LOAD forward is a reasonable inference */
    if(!parseFloat(s.kg)){ const k=smartKg(key,i); if(k>0) s.kg = String(k); }
    /* ...inventing REPS is not. A fabricated rMax satisfies the double-progression
       test and walks the prescribed load above real strength. rMax stays a placeholder. */
    if(!(parseFloat(s.reps)>0)) toast("İşarələndi — proqressiyaya sayılması üçün təkrar sayını yazın");
    startTimer(EXMAP[key].rest, effEx(key).name);
  }
  save();
  /* Task 9.1: full renderTrain() here rebuilt the whole view, collapsing the open
     rules <details> and dropping input focus mid-workout. Only the tick changes. */
  const btn = document.getElementById(`ck-${key}-${i}`);
  if(btn) btn.classList.toggle("done", s.done); else renderTrain();
}
function finishSession(){
  const a = state.active; if(!a) return;
  /* d: məşqin BAŞLADIĞI gün — gecə yarısını keçən məşq dünənə yazılsın deyə */
  const startISO = a.startedAt ? isoOf(new Date(a.startedAt)) : (a.started || todayISO());
  const rec = { d: startISO, day: a.day, ex: [], foundation: !!a.foundation, min: sessionMinutes(a, staleHours() ? 0 : TAIL_CAP) };
  let n = 0, skipped = 0;
  PROGRAM[a.day].ex.forEach(ex=>{
    const eff = effEx(ex.key);
    const raw = a.ex[ex.key];
    /* a ticked set with no reps cannot be scored — count it so we can say so out loud */
    skipped += raw.filter(s=>s.done && !(parseFloat(s.reps)>0)).length;
    /* reps is the only requirement: kg 0 is legitimate (Back Extension, Assisted Pull-Up,
       Hanging Knee Raise, Decline Sit-Up, Band Pull-Apart all start unloaded) */
    const sets = raw.filter(s=>parseFloat(s.reps)>0)
      .map(s=>({kg:parseFloat(s.kg)||0, reps:parseFloat(s.reps)}));
    if(sets.length){ rec.ex.push({key:eff.key, name:eff.name, sets}); n += sets.length; }
  });
  if(!n){
    info("Təkrar sayı yazılmayıb",
      "Məşqi yadda saxlamaq üçün ən azı bir dövrün TƏKRAR xanası dolu olmalıdır — tək ✓ işarəsi kifayət etmir, çünki proqressiya təkrar sayına baxır.\n\nKq xanası boş qala bilər (bədən çəkisi ilə edilən hərəkətlərdə normaldır).");
    return;
  }
  const warn = skipped ? `\n\nDiqqət: işarələnmiş ${skipped} dövr təkrar sayı boş olduğu üçün qeyd edilməyəcək.` : "";
  const dur = rec.min!=null ? `\nZalda keçən real vaxt: ${hm(rec.min)}.` : "";
  ask(`${PROGRAM[a.day].name} yadda saxlanılsın?`, `${n} dövr qeyd edilib.${dur}${warn}`, "Bəli, yadda saxla", ()=>saveSession(rec));
}
function saveSession(rec){
  state.sessions.push(rec); state.active = null; timerSkip(); save(); cloudPush();
  const nxt = DAYS[(DAYS.indexOf(rec.day)+1) % DAYS.length];
  toast(`${dayMeta(rec.day).name} · ${hm(rec.min)} · növbəti: ${DAY_META[nxt].name}`);
  viewDay = nxt;
  switchTab("today");
}
function cancelSession(){ ask("Məşq ləğv edilsin?", "Bu məşqdə qeyd etdiyiniz dövrlər itiriləcək. Tarixçəyə heç nə yazılmayacaq.", "Bəli, ləğv et", ()=>{ state.active=null; timerSkip(); save(); renderTrain(); toast("Məşq ləğv edildi"); }, true); }

/* ---- təsdiq pəncərələri ----
   Brauzerin öz confirm()/alert() pəncərələri hər mühitdə görünmür (PWA, daxili
   brauzer, önizləmə paneli onları səssizcə bloklaya bilir) — belə olanda düymə

let askFn = null;

}

/* ================= rest timer ================= */
let tInt=null, tLeft=0, tTotal=0;
const RING_C = 565.5; // 2*pi*90, matches the SVG circle radius
function startTimer(sec,label){
  clearInterval(tInt); tLeft=sec; tTotal=sec;
  const el=$("#timer"); el.classList.add("on"); el.classList.remove("done");
  $("#timerLab").textContent = label.toUpperCase();
  tickRender();
  acquireWakeLock();
  tInt = setInterval(tick,1000);
}
function tick(){
  tLeft--; tickRender();
  if(tLeft<=0){
    clearInterval(tInt); tInt=null; $("#timer").classList.add("done"); beep();
    try{navigator.vibrate && navigator.vibrate([160,90,160]);}catch(e){}
    releaseWakeLock();
    setTimeout(()=>{ if(tLeft<=0) $("#timer").classList.remove("on"); },1900);
  }
}
function tickRender(){
  const m=Math.floor(Math.max(tLeft,0)/60), s=Math.max(tLeft,0)%60;
  $("#timerDigits").textContent = m+":"+String(s).padStart(2,"0");
  const frac = tTotal>0 ? Math.min(1,Math.max(0,tLeft/tTotal)) : 0;
  $("#timerRing").setAttribute("stroke-dashoffset", (RING_C*(1-frac)).toFixed(1));
}
function timerAdd(){
  tLeft+=30; tTotal=Math.max(tTotal,tLeft); $("#timer").classList.remove("done");
  if(!tInt){ $("#timer").classList.add("on"); acquireWakeLock(); tInt=setInterval(tick,1000); }
  tickRender();
}
function timerSkip(){ clearInterval(tInt); tInt=null; tLeft=0; tTotal=0; $("#timer").classList.remove("on"); releaseWakeLock(); }

/* ---- keep the screen awake while resting (iOS 16.4+ Safari) ---- */
let wakeLock = null;
async function acquireWakeLock(){
  try{ if("wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); } }catch(e){}
}
function releaseWakeLock(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && tInt) acquireWakeLock(); });
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="square"; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.16);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.18);
    });
  }catch(e){}
}
