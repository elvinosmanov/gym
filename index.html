<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FORGE · 3 Günlük Kütlə Protokolu</title>
<meta name="description" content="3 günlük tam bədən kütlə protokolu — ikiqat proqressiya, məşq jurnalı, qidalanma hədəfləri.">
<meta name="theme-color" content="#101318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101318; --card:#171b21; --card2:#1e232b; --line:#272d38;
  --ink:#eef1f5; --mut:#96a0ad; --dim:#6b7480;
  --chalk:#f0ede3; --chalk-ink:#15181d;
  --a:#e0484e; --b:#4a7dff; --c:#f3b73f;      /* competition plate colors: red / blue / yellow */
  --green:#3ecf8e; --red:#e0484e;
  /* əzələ xəritəsi */
  --muscle-body:#1b212a; --muscle-edge:#39424f; --muscle-off:#333c49;
  --muscle-pri:#e0484e; --muscle-sec:#8c4257;
  --heat-0:#2b3341; --heat-1:#4a4657; --heat-2:#a87b2e; --heat-3:#3ecf8e; --heat-4:#4a7dff;
  --disp:'Oswald',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.5;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.014) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.014) 0 1px, transparent 1px 7px);
}
.app{max-width:500px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:20px 0 6px}
.wordmark{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:.14em;line-height:1}
.wordmark i{font-style:normal;color:var(--c)}
.eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut);margin-top:5px}
.datechip{font-size:12px;color:var(--mut);text-align:right;line-height:1.35}
.datechip b{color:var(--ink);font-weight:600}

/* ---------- cards & type ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.tight{padding:14px 16px}
.sect{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:22px 2px 4px}
.h-big{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.03em;line-height:1.15}
.sub{color:var(--mut);font-size:13px}
.small{font-size:12.5px;color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
hr.split{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--chalk);color:var(--chalk-ink);border:0;border-radius:12px;
  font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.09em;text-transform:uppercase;
  padding:13px 18px;transition:transform .06s ease,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid #3d2225}
.btn.sm{padding:9px 13px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- stat chips ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;text-align:left}
.stat .v{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.1}
.stat .v small{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.03em}
.stat .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.delta-up{color:var(--green);font-size:12px;font-weight:600}
.delta-dn{color:var(--red);font-size:12px;font-weight:600}

/* ---------- plate day selector (signature) ---------- */
.plates{display:flex;gap:14px;justify-content:center;padding:14px 0 4px}
.plate{position:relative;width:82px;height:82px;border-radius:50%;border:0;
  display:grid;place-items:center;color:#101010;background:var(--pc,#888);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.28), inset 0 0 0 11px rgba(255,255,255,.09), inset 0 0 0 12px rgba(0,0,0,.22), 0 6px 16px rgba(0,0,0,.35);
  filter:grayscale(.85) brightness(.55);transform:scale(.93);transition:filter .18s,transform .18s}
.plate::after{content:"";position:absolute;inset:29px;border-radius:50%;background:var(--bg);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7)}
.plate span{position:relative;z-index:1;font-family:var(--disp);font-weight:700;font-size:19px;color:var(--ink)}
.plate.on{filter:none;transform:scale(1)}
.plate.lock{pointer-events:none;opacity:.45}
.plate-a{--pc:var(--a)} .plate-b{--pc:var(--b)} .plate-c{--pc:var(--c)}
.platelbl{display:flex;gap:14px;justify-content:center;margin-bottom:6px}
.platelbl div{width:82px;text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);line-height:1.35}
.mini-plate{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:7px;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.35)}
.mp-a{background:var(--a)}.mp-b{background:var(--b)}.mp-c{background:var(--c)}

/* ---------- exercise cards ---------- */
.ex{border-left:3px solid var(--dc,var(--line))}
.ex .name{font-family:var(--disp);font-weight:600;font-size:16.5px;letter-spacing:.03em}
.ex .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
  border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:var(--card2)}
.tag.hot{color:var(--ink);border-color:transparent;background:rgba(240,237,227,.12)}
.lastline{font-size:12.5px;color:var(--mut);margin-top:8px}
.lastline b{color:var(--ink);font-weight:600}
.hint{font-size:12.5px;margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--card2);border:1px dashed var(--line)}
.hint.up{border-color:rgba(62,207,142,.4);color:var(--green)}
.hint b{color:var(--ink)}
.hint.up b{color:var(--green)}
.ramp{font-size:12px;color:var(--mut);margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--card2)}
.ramp b{color:var(--ink);font-weight:600}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-thumb{width:56px;height:56px;border-radius:11px;object-fit:cover;background:#efece3;border:1px solid var(--line);flex-shrink:0}
div.ex-thumb.ph{background:var(--card2)}
.exname{display:flex;gap:10px;align-items:flex-start}
.techimg{width:100%;max-height:220px;object-fit:cover;background:#efece3;border-radius:14px;border:1px solid var(--line);margin-bottom:12px;display:block}
.techbtn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:9px;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;white-space:nowrap}
.techbtn:hover{color:var(--ink)}
.exbtns{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.tag.swp{color:#f3b73f;border-color:rgba(243,183,63,.4)}
.swaplist{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.swopt{display:flex;align-items:center;gap:11px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;color:var(--ink);text-align:left}
.swopt.on{border-color:var(--green)}
.swopt .swtxt{flex:1;min-width:0}
.swopt .swtxt b{display:block;font-size:14px;line-height:1.25}
.swopt .swtxt small{color:var(--mut);font-size:11.5px}
.swopt .swck{flex:none;color:var(--green);font-size:17px;width:18px;text-align:center}
.ex-thumb.ph{display:flex;align-items:center;justify-content:center;font-size:22px}

/* ---------- set rows ---------- */
.sethdr,.setrow{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:6px;align-items:center}
.sethdr{margin:12px 0 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}
.setrow{margin:7px 0}
.setrow .idx{font-family:var(--disp);font-weight:600;color:var(--mut);text-align:center}
.stepper{display:flex;align-items:stretch;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:32px;flex:none;background:transparent;border:0;color:var(--mut);font-size:19px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.stepper button:active{background:rgba(240,237,227,.1);color:var(--ink)}
.stepper input{flex:1;min-width:0;width:100%;background:transparent;border:0;
  color:var(--ink);padding:12px 0;font-size:16px;text-align:center;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}
.stepper input::placeholder{color:var(--dim)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.check{width:46px;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
  color:var(--dim);font-size:17px;line-height:1;transition:background .12s}
.check.done{background:var(--green);border-color:var(--green);color:#0b120e}

/* ---------- inputs ---------- */
.field{margin:10px 0}
.field label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;
  color:var(--ink);padding:12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inline-log{display:flex;gap:8px}
.inline-log input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:12px;font-size:16px;text-align:center}
.supprow{display:flex;flex-direction:column;gap:8px}
.suppbtn{display:flex;align-items:center;gap:11px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink);text-align:left}
.suppbtn .si{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.suppbtn.on{border-color:var(--green)}
.suppbtn.on .si{background:var(--green);border-color:var(--green);color:#0b120e}
.suppbtn .st{flex:1}
.suppbtn .st b{display:block;font-size:14px}
.suppbtn .st small{color:var(--mut);font-size:11px}
.suppbtn .sk{font-size:12px;color:var(--mut);white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--chalk)}

/* ---------- rules / details ---------- */
details.rules{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
details.rules summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:"+";font-size:19px;color:var(--mut);font-weight:400}
details.rules[open] summary::after{content:"–"}
details.rules .inner{padding:0 16px 14px;border-top:1px solid var(--line)}
.rule{padding:11px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule b{display:block;font-size:13.5px;margin-bottom:2px}
.rule p{font-size:13px;color:var(--mut)}

/* ---------- coach tip ---------- */
.coach{display:flex;gap:12px;align-items:flex-start}
.coach .cq{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--c);line-height:.8;margin-top:2px}
.coach p{font-size:14px;color:var(--ink)}
.coach .who{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:6px}

/* ---------- fuel ---------- */
.bignum{font-family:var(--disp);font-weight:700;font-size:42px;line-height:1;letter-spacing:.02em}
.bignum small{font-size:15px;color:var(--mut);font-weight:600;letter-spacing:.06em}
.kcalrow{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:10px}
.kcalrow b{color:var(--ink)}
.macro{margin:13px 0 4px}
.macro .mrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.macro .mrow b{font-variant-numeric:tabular-nums}
.mbar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px}
.meal{padding:11px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .mt{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.meal .mt span:last-child{color:var(--mut);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.meal p{font-size:13px;color:var(--mut);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chips span{font-size:12.5px;border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:5px 12px;color:var(--ink)}

/* ---------- progress ---------- */
.chartbox{margin:8px 0 4px}
.chartbox svg{width:100%;height:auto;display:block}
.loglist{margin-top:6px}
.logrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.logrow:last-child{border-bottom:0}
.logrow .d{color:var(--mut)}
.xdel{background:none;border:0;color:var(--dim);font-size:15px;padding:4px 8px}
.xdel:hover{color:var(--red)}
select.lift{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:12px;font-size:15px;margin:8px 0}
.prbadge{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#151515;background:var(--c);
  border-radius:7px;padding:3px 9px;font-weight:700;margin-left:8px}
details.hist{border-bottom:1px solid var(--line);padding:4px 0}
details.hist:last-child{border-bottom:0}
details.hist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13.5px}
details.hist summary::-webkit-details-marker{display:none}
details.hist .hs{color:var(--mut);font-size:12.5px}
.histset{font-size:12.5px;color:var(--mut);padding:3px 0 3px 10px;border-left:2px solid var(--line);margin:4px 0}
.histset b{color:var(--ink)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;
  display:flex;gap:2px;background:rgba(14,17,22,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:8px 10px calc(9px + env(safe-area-inset-bottom));z-index:40}
.tabbar button{flex:1;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:6px 2px;border-radius:11px}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--chalk);margin-top:1px}

/* ---------- rest timer (full-screen) ---------- */
.timer{position:fixed;inset:0;background:rgba(8,9,12,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:70;
  padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
.timer.on{display:flex}
.timer .tlab{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut);text-align:center}
.timer .exlab{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.03em;text-align:center;margin-top:2px}
.tring{position:relative;width:min(72vw,290px);height:min(72vw,290px);display:grid;place-items:center}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .trk{fill:none;stroke:var(--card2);stroke-width:9}
.tring .prg{fill:none;stroke:var(--red);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(224,72,78,.55));transition:stroke-dashoffset .25s linear}
.timer .digits{position:absolute;font-family:var(--mono);font-weight:700;font-size:min(15vw,60px);line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums}
.timer.done .tring .prg{stroke:var(--green);filter:drop-shadow(0 0 10px rgba(62,207,142,.55))}
.timer.done .digits{animation:blink .5s steps(2) 3}
@keyframes blink{50%{opacity:.25}}
.timer .tbtns{display:flex;gap:12px;width:100%;max-width:320px}
.timer .tbtns .btn{flex:1}

/* ---------- əzələ xəritəsi ---------- */
.bodypair{display:flex;gap:8px;justify-content:center;margin:10px 0 4px}
.bodymap{width:100%;max-width:150px;height:auto}
.bodypair.heat .bodymap{max-width:158px}
.musclekey{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:12px;color:var(--mut);margin-top:4px}
.musclekey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.musclekey .k-pri{background:var(--muscle-pri)} .musclekey .k-sec{background:var(--muscle-sec)}
.heatkey{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:11px;color:var(--dim);margin:6px 0 2px}
.heatkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.heatkey .h0{background:var(--heat-0)} .heatkey .h1{background:var(--heat-1)}
.heatkey .h2{background:var(--heat-2)} .heatkey .h3{background:var(--heat-3)}
.heatkey .h4{background:var(--heat-4)}
.weakbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.weakbox b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.weakbox.ok b{color:var(--green)}
.weakbox p{font-size:13px;color:var(--mut);margin-top:3px}
.barrows{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.barrow{display:grid;grid-template-columns:78px 1fr 32px;align-items:center;gap:8px;font-size:12px}
.barrow .bl{color:var(--mut)}
.barrow .bt{position:relative;height:8px;border-radius:99px;background:var(--card2);overflow:visible}
.barrow .bt i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.barrow .bt u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mut);opacity:.75}
.barrow .bv{text-align:right;color:var(--ink)}
details.rules.flat{background:transparent;border:0;margin:10px 0 0}

/* ---------- zal saatı ---------- */
.clocknow{font-size:12px;color:var(--mut)}
.gymbadge{font-style:normal;font-size:8.5px;letter-spacing:.14em;background:var(--c);color:#15181d;
  border-radius:4px;padding:1px 4px;vertical-align:1px;font-weight:700}
.timer .tback{font-size:12.5px;color:var(--mut);letter-spacing:.04em;margin:-2px 0 2px}
.mini{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:8px;
  padding:3px 9px;font-size:11.5px}

/* ---------- yük tipi / disk hesabı ---------- */
.unitbar{display:flex;flex-direction:column;gap:1px;background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:7px 10px;margin:10px 0 2px}
.unitbar b{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.unitbar span{font-size:11.5px;color:var(--mut);line-height:1.35}
.howload{display:block;margin-top:5px;font-size:12px;color:var(--mut)}
.hint.up .howload{color:var(--mut)}
.unit-explain{font-size:12.5px;color:var(--mut);margin:8px 0 2px;line-height:1.45}
.unit-explain b{color:var(--ink)}
.platepick{display:flex;flex-wrap:wrap;gap:7px}
.platepick .chip{background:var(--card2);border:1px solid var(--line);color:var(--mut);
  border-radius:99px;padding:7px 13px;font-size:13px;font-variant-numeric:tabular-nums}
.platepick .chip.on{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk);font-weight:700}
.gymgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gymgrid .field{margin:0}

/* ---------- sheet / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,8,11,.66);backdrop-filter:blur(3px);z-index:60;display:none}
.overlay.on{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:500px;z-index:61;
  background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  display:none;max-height:86vh;overflow:hidden;
  transition:transform .18s ease}
.sheet.on{display:flex;flex-direction:column}
/* The header never scrolls away, so the close button is always reachable —
   a long technique sheet used to hide it below the fold. */
.sheet-head{flex:0 0 auto;position:relative;padding:12px 52px 10px 18px;background:var(--card);
  border-bottom:1px solid var(--line)}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet-x{position:absolute;top:14px;right:12px;width:34px;height:34px;border-radius:50%;
  background:var(--card2);color:var(--ink);border:1px solid var(--line);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.sheet-x:active{transform:scale(.94)}
.sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.03em}
.sheet .stag{font-size:12px;color:var(--mut);margin:2px 0 0}
.cuelist{margin:8px 0 4px}
.cue{display:flex;gap:10px;padding:7px 0;font-size:13.5px}
.cue .ic{flex-shrink:0;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.cue.good .ic{background:rgba(62,207,142,.15);color:var(--green)}
.cue.bad .ic{background:rgba(224,72,78,.14);color:var(--red)}
.cue p{color:#cfd6de}
.sheet .protoc{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}

/* ---------- misc ---------- */
.banner{background:rgba(74,125,255,.1);border:1px solid rgba(74,125,255,.35);border-radius:13px;padding:11px 14px;font-size:13px;margin:12px 0}
.warnnote{background:rgba(243,183,63,.09);border:1px solid rgba(243,183,63,.3);border-radius:13px;padding:10px 14px;font-size:12.5px;color:#e8d9b0;margin:12px 0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);z-index:80;
  background:var(--chalk);color:var(--chalk-ink);font-weight:600;font-size:14px;border-radius:12px;padding:11px 18px;
  transition:transform .25s ease;box-shadow:0 10px 26px rgba(0,0,0,.4);max-width:88%;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 8px}
.view{display:none}.view.on{display:block}
.footnote{font-size:11.5px;color:var(--dim);text-align:center;margin:20px 0 6px;line-height:1.6}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

function syncGymClock(hhmm){
  const m = /^(\d{1,2})[:.\s]?(\d{2})$/.exec(String(hhmm||"").trim());
  if(!m){ toast("Saatı HH:MM kimi yazın, məsələn 18:47"); return; }
  const h = Number(m[1]), mi = Number(m[2]);
  if(h > 23 || mi > 59){ toast("Bu düzgün vaxt deyil."); return; }
  const now = new Date(), target = new Date(now);
  target.setHours(h, mi, 0, 0);
  let diff = Math.round((target - now)/60000);
  if(diff >  720) diff -= 1440;          /* gecəyarısından keçmə */
  if(diff < -720) diff += 1440;
  state.gym = {...gymOf(), clockOffsetMin:diff};
  save(); renderDateChip(); renderToday();
  if(tEnd) tickRender();                 /* açıq taymerin "davam" vaxtı da sürüşür */
  toast(diff ? `Zal saatı quruldu: ${Math.abs(diff)} dəq ${diff>0?"irəli":"geri"}.` : "Saat onsuz da uyğundur.");
}
function clearGymClock(){
  state.gym = {...gymOf(), clockOffsetMin:0};
  save(); renderDateChip(); renderToday();
  if(tEnd) tickRender();
  toast("Zal saatı telefon vaxtına qaytarıldı.");
}
function offsetText(){
  const o = clockOffset();
  if(!o) return "telefonunuzla eynidir";
  return `telefondan ${Math.abs(o)} dəq ${o>0?"irəli":"geri"}`;
}

/* Ştanqın düzəldə bildiyi bütün ümumi çəkilər (disklər cüt-cütdür). */
function reachableBarTotals(barKg, plates, max){
  const set = new Set([barKg]);
  const uniq = [...new Set(plates)].sort((a,b)=>b-a);
  const cap = max || barKg + 300;
  const walk = (i, total) => {
    if(total > cap) return;
    set.add(round2(total));
    if(i >= uniq.length) return;
    for(let n=0;n<=6;n++){
      const t = total + uniq[i]*2*n;
      if(t > cap) break;
      walk(i+1, t);
    }
  };
  walk(0, barKg);
  return [...set].sort((a,b)=>a-b);
}

/* Bir tərəfə hansı disklər — tam düzəlmirsə null. */
function platesPerSide(total, barKg, plates){
  let side = (total - barKg)/2;
  if(side < -1e-9) return null;
  const uniq = [...new Set(plates)].sort((a,b)=>b-a);
  const out = [];
  for(const p of uniq){ while(side >= p-1e-9){ out.push(p); side = round2(side-p); } }
  return Math.abs(side) < 1e-9 ? out : null;
}
function greedySide(target, plates){
  let left = target;
  const uniq = [...new Set(plates)].sort((a,b)=>b-a);
  const out = [];
  for(const p of uniq){ while(left >= p-1e-9){ out.push(p); left = round2(left-p); } }
  return Math.abs(left) < 1e-9 ? out : null;
}

function multiplesOf(step, max){
  const out = [];
  const s = Number(step) || 2.5;
  for(let w = s; w <= max + 1e-9; w = round2(w + s)) out.push(w);
  return out;
}

/* Bu tipdə zalın verə bildiyi bütün çəkilər, artan sıra ilə. */
function ladderFor(type, g){
  switch(type){
    case "bar":    return reachableBarTotals(g.barKg, g.plates);
    case "ez":     return reachableBarTotals(g.ezKg, g.plates);
    case "smith":  return reachableBarTotals(0, g.plates);
    case "plate":  { const out=[0]; const st=Math.min(...g.plates);
                     for(let w=st; w<=300; w=round2(w+st)) out.push(w); return out; }
    /* Rəflər və bloklar öz addımlarının KATLARI ilə gedir: 2.5 addımlı rəf
       2.5, 5, 7.5 … verir — 2-dən başlayıb 4.5, 7 kimi mövcud olmayan
       hantellər təklif etmir. */
    case "db":
    case "db1":    return multiplesOf(g.dbStep, g.dbMax);
    case "stack":  return multiplesOf(g.stackStep, g.stackMax);
    case "bw":
    case "assist": { const out=[0]; const st=Math.min(...g.plates, 1.25);
                     for(let w=st; w<=100; w=round2(w+st)) out.push(w); return out; }
    case "band":   return [1,2,3,4,5];
    default:       return [];
  }
}

/* İstənilən artımdan (inc) SONRAKI real çəki. Zal 2.5-i düzəldə bilmirsə,
   yalan danışmaq əvəzinə düzəldə bildiyi növbəti çəkini deyir. */
function nextLoad(cur, type, g, wantStep){
  const ladder = ladderFor(type, g);
  const from = (Number(cur)||0) + (Number(wantStep)||0);
  if(!ladder.length) return round2(from);
  if(type === "assist"){                       /* köməkli: irəli getmək = daha AZ kömək */
    const below = ladder.filter(w => w < (Number(cur)||0) - 1e-9);
    return below.length ? below[below.length-1] : 0;
  }
  const above = ladder.find(w => w >= from - 1e-9);
  return above !== undefined ? above : round2(from);
}

function snapLoad(v, type, g){
  const ladder = ladderFor(type, g);
  const n = Number(v);
  if(!isFinite(n) || !ladder.length) return n;
  let best = ladder[0], bd = Infinity;
  for(const w of ladder){ const d = Math.abs(w-n); if(d < bd){ bd = d; best = w; } }
  return best;
}

/* "20 ştanq + 21.25/tərəf (20 + 1.25)" — "necə yığım?" sualının cavabı. */
function loadingText(kg, type, g){
  const n = Number(kg);
  if(!isFinite(n)) return "";
  if(type === "bar" || type === "ez" || type === "smith"){
    const bar = type==="bar" ? g.barKg : type==="ez" ? g.ezKg : 0;
    if(type === "smith"){
      const side = greedySide(n/2, g.plates);
      return n<=0 ? "boş arabа" : `hər tərəfə ${round2(n/2)} kq${side?` (${side.join(" + ")})`:""}`;
    }
    if(n <= bar + 1e-9) return `boş ${bar} kq ştanq`;
    const side = platesPerSide(n, bar, g.plates);
    return side ? `${bar} ştanq + hər tərəfə ${round2((n-bar)/2)} (${side.join(" + ")})`
                : `${bar} ştanq + hər tərəfə ${round2((n-bar)/2)}`;
  }
  if(type === "plate"){ const s = greedySide(n, g.plates);
    return s ? `hər tərəfə ${n} kq (${s.join(" + ")})` : `hər tərəfə ${n} kq`; }
  if(type === "db")     return `2 × ${n} kq hantel`;
  if(type === "db1")    return `bir ${n} kq hantel`;
  if(type === "stack")  return `pin ${n} kq-da`;
  if(type === "bw")     return n > 0 ? `bədən çəkisi + ${n} kq` : "yalnız bədən çəkisi";
  if(type === "assist") return n > 0 ? `${n} kq kömək` : "köməksiz";
  if(type === "band")   return `rezin səviyyəsi ${n}`;
  return `${n} kq`;
}

function bodyView(view, shade, uid){
  const spec = BODY[view];
  const parts = [];
  for(const key of Object.keys(spec)){
    const g = spec[key];
    const fill = (shade||{})[key] || "var(--muscle-off)";
    const id = `${uid}-${view}-${key}`;
    /* incə kontur — rənglər yaxın olanda da əzələ sərhədi görünsün */
    parts.push(`<path id="${id}" d="${g.d}" fill="${fill}" stroke="var(--muscle-edge)" stroke-width="0.8"/>`);
    if(!g.center) parts.push(`<use href="#${id}" transform="translate(240,0) scale(-1,1)"/>`);
  }
  return `<svg viewBox="0 0 240 440" class="bodymap" role="img" aria-label="${view==="front"?"ön":"arxa"} görünüş">
    <path d="${BODY_OUTLINE}" fill="var(--muscle-body)" stroke="var(--muscle-edge)" stroke-width="1.5"/>
    ${parts.join("")}
  </svg>`;
}

/* bir hərəkət üçün: əsas güclü, köməkçi solğun */
function exerciseBody(key, uid){
  const m = musclesOf(key), shade = {};
  (m.s||[]).forEach(k => shade[k] = "var(--muscle-sec)");
  (m.p||[]).forEach(k => shade[k] = "var(--muscle-pri)");
  return `<div class="bodypair">${bodyView("front",shade,uid)}${bodyView("back",shade,uid)}</div>`;
}

/* həftəlik dövr sayı → istilik rəngi */
function heatShade(vol){
  const shade = {};
  for(const k of Object.keys(MUSCLES)){
    const n = vol[k] || 0, [lo,hi] = WEEKLY_SETS[k] || [8,16];
    shade[k] = n<=0 ? "var(--heat-0)" : n < lo*0.5 ? "var(--heat-1)"
             : n < lo ? "var(--heat-2)" : n <= hi ? "var(--heat-3)" : "var(--heat-4)";
  }
  return shade;
}

/* son 7 gündə əzələ başına dövr — köməkçi əzələ yarım sayılır */
function setsPerMuscle(days){
  const cut = new Date(); cut.setHours(0,0,0,0); cut.setDate(cut.getDate()-((days||7)-1));
  const out = {};
  for(const s of state.sessions){
    const [y,m,d] = s.d.split("-").map(Number);
    if(new Date(y,m-1,d) < cut) continue;
    for(const e of s.ex||[]){
      const mm = musclesOf(e.key);
      const n = (e.sets||[]).filter(x=>Number(x.reps)>0).length;
      for(const k of mm.p) out[k] = (out[k]||0) + n;
      for(const k of mm.s) out[k] = (out[k]||0) + n*0.5;
    }
  }
  for(const k of Object.keys(out)) out[k] = Math.round(out[k]*10)/10;
  return out;
}

function weakestMuscles(vol, n){
  return Object.keys(MUSCLES)
    .map(k => ({ key:k, name:MUSCLES[k].n, sets:vol[k]||0, deficit:(WEEKLY_SETS[k]||[8])[0]-(vol[k]||0) }))
    .filter(x => x.deficit > 0)
    .sort((a,b) => b.deficit - a.deficit)
    .slice(0, n||3);
}

function applyLoaded(v){
  if(!v) return;
  const d = (typeof v === "string") ? JSON.parse(v) : v;
  state = {...JSON.parse(JSON.stringify(DEFAULTS)), ...d, profile:{...DEFAULTS.profile, ...(d.profile||{})}};
  migrate();
}
/* köhnə yaddaşı səssizcə yeni sxemə keçirir — heç bir qeyd itmir */
function migrate(){
  if(!Array.isArray(state.weights)) state.weights = [];
  if(!Array.isArray(state.sessions)) state.sessions = [];
  if(!Array.isArray(state.supps)) state.supps = [];
  if(!state.weights.length && parseFloat(state.profile.w))
    state.weights.push({ d: todayISO(), kg: parseFloat(state.profile.w) });
  if(!state.profile.sex) state.profile.sex = "m";
  if(!state.profile.weeklyTarget) state.profile.weeklyTarget = 3;
  if(typeof state.deloadAt !== "number") state.deloadAt = 0;
  if(!state.gym || typeof state.gym !== "object") state.gym = {...DEFAULT_GYM};
  if(!Array.isArray(state.gym.plates) || !state.gym.plates.length) state.gym.plates = [...DEFAULT_GYM.plates];
  state.weights.sort((a,b)=>a.d<b.d?-1:1);
}
/* ---- local backup ring ----
   Cloud sync only helps if you are signed in and online. On the device
   itself there was a single key: one bad write, one quota error or one
   corrupted value and everything was gone. Now the previous good value
   is rotated into a 3-deep ring once a day, every source is parsed in
   its own try/catch, and the newest VALID one wins. */
const DATA_KEY = "forge-data";
const BAK_KEYS = ["forge-bak-0","forge-bak-1","forge-bak-2"];
const BAK_DAY  = "forge-bak-day";
let dataFrozen = false;      // we could not read what is stored — refuse to write over it
let rawSalvage = null;
let recoveredFrom = null;

function rawGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function rawSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }

function parseCandidate(str, source){
  if(!str) return null;
  try{
    const d = JSON.parse(str);
    if(!d || typeof d !== "object") return null;
    // A FORGE payload always carries at least one of these.
    if(!Array.isArray(d.sessions) && !Array.isArray(d.weights) && !d.profile) return null;
    return { data:d, source, ts:Number(d.ts)||0, raw:str };
  }catch(e){ return null; }
}

function bestStored(){
  const cands = [];
  const primary = rawGet(DATA_KEY);
  const p = parseCandidate(primary, "əsas");
  if(p) cands.push(p);
  BAK_KEYS.forEach((k,i)=>{
    const c = parseCandidate(rawGet(k), `ehtiyat ${i+1}`);
    if(c) cands.push(c);
  });
  cands.sort((a,b)=>b.ts-a.ts);
  return { best: cands[0] || null, hadRaw: !!primary };
}

/* Rotate the last good value into the ring, at most once per day, so the
   ring spans days rather than the last three keystrokes. */
function rotateBackups(prev, next){
  if(!prev || prev === next) return;
  const today = todayISO();
  if(rawGet(BAK_DAY) === today) return;
  rawSet(BAK_KEYS[2], rawGet(BAK_KEYS[1]) || "");
  rawSet(BAK_KEYS[1], rawGet(BAK_KEYS[0]) || "");
  rawSet(BAK_KEYS[0], prev);
  rawSet(BAK_DAY, today);
}

async function loadState(){
  try{ /* inside Claude: artifact storage */
    if(typeof window.storage !== "undefined"){
      const r = await window.storage.get("forge-data");
      applyLoaded(r && r.value);
      return;
    }
  }catch(e){ /* açar hələ yoxdur və ya artefakt yaddaşı əlçatmazdır — localStorage-a keçirik */ }

  try{ /* self-hosted website: browser localStorage */
    const { best, hadRaw } = bestStored();
    if(best){
      applyLoaded(best.data);
      if(best.source !== "əsas") recoveredFrom = best.source;
      return;
    }
    if(hadRaw){
      /* There IS something stored but nothing could be parsed. Do NOT
         start from empty defaults — the next save would overwrite it. */
      dataFrozen = true;
      rawSalvage = rawGet(DATA_KEY);
      storageOK = false;
      return;
    }
    return;                    /* genuine first run */
  }catch(e){}
  storageOK = false;
}
/* Lokal yazma sürətlidir və heç vaxt şəbəkəni gözləmir (350 ms).
   Bulud yazması ayrıca və NADİR olur — hər rəqəm yazılanda upsert
   göndərmək zalın zəif siqnalında növbə yaradır və batareya yeyir.
   save({cloud:true}) yalnız mənalı hadisələrdə çağırılır:
   məşq bitdikdə, çəki qeyd edildikdə, silmə əməliyyatlarında. */
let cloudT = null, cloudDirty = false;

/* The actual write. Kept separate from save() so it can also be called
   synchronously when the page is going away. */
function writeNow(){
  if(dataFrozen) return false;          /* never overwrite data we failed to read */
  state.ts = Date.now();
  let json;
  try{ json = JSON.stringify(state); }
  catch(e){ if(storageOK){ storageOK=false; renderSaveNote(); } return false; }

  if(typeof window.storage !== "undefined"){
    try{ Promise.resolve(window.storage.set("forge-data", json)).catch(()=>{}); }
    catch(e){ if(storageOK){ storageOK=false; renderSaveNote(); } return false; }
    return true;
  }
  const prev = rawGet(DATA_KEY);
  if(!rawSet(DATA_KEY, json)){
    if(storageOK){ storageOK=false; renderSaveNote(); }
    return false;
  }
  rotateBackups(prev, json);
  return true;
}

function save(opts){
  if(dataFrozen) return;
  clearTimeout(saveT);
  saveT = setTimeout(writeNow, 350);
  cloudDirty = true;
  if(opts && opts.cloud) scheduleCloud();
}

/* A 350 ms debounce is invisible until you tap Bitir and immediately lock
   the phone — iOS freezes the tab and the timer never fires, losing the
   whole session. Flush synchronously whenever the page may be going away. */
function flushSave(){
  if(dataFrozen) return;
  clearTimeout(saveT); saveT = null;
  try{ writeNow(); }catch(e){}
}
window.addEventListener("pagehide", flushSave);
window.addEventListener("beforeunload", flushSave);

/* HƏQİQİ birləşdirmə. Köhnə kod bütün state-i əvəz edirdi: iki cihazda
   oflayn işləsən, birinin məşqləri tamamilə itirdi. İndi hər massiv
   açar üzrə birləşir və heç bir qeyd silinmir. */
function mergeStates(local, remote){
  const out = JSON.parse(JSON.stringify(local));
  const preferRemote = (remote.ts||0) > (local.ts||0);
  const index = (arr, kf) => { const m={}; (arr||[]).forEach(x=>{ m[kf(x)] = x; }); return m; };
  const union = (a, b) => [...new Set([...Object.keys(a), ...Object.keys(b)])];

  /* məşqlər: açar = tarix + gün; toqquşmada daha çox dövr qeyd olunanı saxlayırıq */
  const setsOf = s => (s.ex||[]).reduce((a,e)=>a+(e.sets?e.sets.length:0), 0);
  const ls = index(local.sessions, s=>s.d+"|"+s.day), rs = index(remote.sessions, s=>s.d+"|"+s.day);
  out.sessions = union(ls, rs).map(k=>{
    const a=ls[k], b=rs[k];
    if(!a) return b; if(!b) return a;
    return setsOf(b) > setsOf(a) ? b : a;
  }).sort((x,y)=> x.d<y.d?-1:1);

  /* çəki: açar = tarix; toqquşmada daha yeni state-dəki dəyər */
  const lw = index(local.weights, x=>x.d), rw = index(remote.weights, x=>x.d);
  out.weights = union(lw, rw).map(k=>{
    const a=lw[k], b=rw[k];
    if(!a) return b; if(!b) return a;
    return preferRemote ? b : a;
  }).sort((x,y)=> x.d<y.d?-1:1);

  /* əlavələr: açar = tarix; işarələr MƏNTIQİ VƏ YA ilə birləşir */
  const lp = index(local.supps, x=>x.d), rp = index(remote.supps, x=>x.d);
  out.supps = union(lp, rp).map(k=>{
    const a=lp[k]||{d:k}, b=rp[k]||{d:k};
    return { d:k, creatine: !!(a.creatine||b.creatine), protein: !!(a.protein||b.protein) };
  }).sort((x,y)=> x.d<y.d?-1:1);

  out.profile  = preferRemote ? {...local.profile, ...remote.profile} : {...remote.profile, ...local.profile};
  out.deloadAt = Math.max(local.deloadAt||0, remote.deloadAt||0);
  out.active   = local.active;   /* davam edən məşq HEÇ VAXT sinxronizasiya ilə silinmir */
  out.ts       = Math.max(local.ts||0, remote.ts||0);
  return out;
}

/* Təməl məşqi qəsdən yüngüldür (~50-60%, setlər yarıya endirilib).
   Proqressiya hesablamaları onu NƏZƏRƏ ALMAMALIDIR, yoxsa app aylarla
   real işçi çəkidən aşağıda qalır. Tarixçə və qrafiklər isə göstərir. */
function lastPerf(key, opts){
  const inc = opts && opts.includeFoundation;
  for(let i=state.sessions.length-1;i>=0;i--){
    if(state.sessions[i].foundation && !inc) continue;
    const f = state.sessions[i].ex.find(e=>e.key===key);
    if(f && f.sets.length) return { d:state.sessions[i].d, sets:f.sets };
  }
  return null;
}
/* yalnız təməl məşqi var, ondan sonrakı ilk real məşqdəyik? */
function afterFoundationOnly(key){
  return !lastPerf(key) && !!lastPerf(key, {includeFoundation:true});
}
function perfStr(p){ return p.sets.map(s=>`${s.kg>0?s.kg:"BÇ"}×${s.reps}`).join(", "); }
function suggestKg(key){
  const p = lastPerf(key), ex = EXMAP[key];
  if(!p) return null;
  const top = Math.max(...p.sets.map(s=>s.kg));
  /* bədən çəkisi hərəkəti hələ yüksüz gedirsə, proqressiya çəki ilə yox, təkrarla olur */
  if(ex.bw && top === 0) return 0;
  const allTop = p.sets.every(s=>s.reps>=ex.rMax);
  if(!allTop) return round2(top);
  /* İstənilən artım ex.inc-dir, amma real addımı zalın diskləri müəyyən edir. */
  return round2(nextLoad(top, loadOf(key), gymOf(), ex.inc));
}
/* Bu hərəkətdə növbəti artımın əsl böyüklüyü — "+2.5" yazıb 5 vermək yox. */
function realStep(key){
  const p = lastPerf(key), ex = EXMAP[key];
  if(!p) return ex.inc;
  const top = Math.max(...p.sets.map(s=>s.kg));
  return round2(Math.abs(nextLoad(top, loadOf(key), gymOf(), ex.inc) - top));
}
function hintFor(ex, p){
  if(!p){
    if(afterFoundationOnly(ex.key))
      return { cls:"up", txt:`Təməl məşqi tamamlandı — o, qəsdən yüngül idi və proqressiyaya sayılmır. <b>Bu gün real işçi çəkinizi qoyun:</b> ${ex.rMax} təkrardan sonra hələ 1-2 təkrar qalacaq ağırlıq. Bundan sonrasını app hesablayacaq.` };
    return { cls:"", txt:"İlk dəfə: ~2 əlavə təkrar edə biləcəyiniz çəki seçin. Qeyd edin — davamını mən götürəcəyəm." };
  }
  const sug = suggestKg(ex.key);
  const allTop = p.sets.every(s=>s.reps>=ex.rMax);
  const type = loadOf(ex.key), g = gymOf();
  const how = loadingText(sug, type, g);
  if(ex.bw && sug === 0){
    if(allTop) return { cls:"up", txt:`Bədən çəkisi ilə bütün dövrlərdə ${ex.rMax} təkrara çatdınız — indi döşünüzə <b>+${ex.inc} kq</b> disk əlavə edin.` };
    return { cls:"", txt:`Bədən çəkisi ilə davam — çəki xanası boş qala bilər. Hədəf: hər dövrdə ${ex.rMax} təkrar, sonra disk əlavə edirik.` };
  }
  if(allTop){
    const step = realStep(ex.key);
    const note = step > ex.inc
      ? ` Zalınızdakı ən kiçik disklə +${ex.inc} kq düzəlmir, ona görə addım +${step} kq-dır.`
      : "";
    return { cls:"up", txt:`Bu gün bütün dövrlər: <b>${sug} kq</b> (+${step} kq) — keçən dəfə hamısı ${ex.rMax} təkrara çatdı. Haqq etmisiniz.${note} <span class="howload">${how}</span>` };
  }
  return { cls:"", txt:`Bu gün bütün dövrlər: <b>${sug} kq</b> — çəkini saxlayın, hər dövrdə ${ex.rMax} təkrara doğru çalışın. Proqres = əvvəl təkrar, sonra çəki. <span class="howload">${how}</span>` };
}
const r25 = v => Math.round(v/2.5)*2.5;
/* Sürüşən 7 gün — bazar ertəsinə bağlı deyil, gün-aşırı rejimdə də doğru sayır. */
function weekCount(){
  const cut = new Date(); cut.setHours(0,0,0,0); cut.setDate(cut.getDate()-6);
  return state.sessions.filter(s=>{const [y,m,d]=s.d.split("-").map(Number); return new Date(y,m-1,d)>=cut;}).length;
}
function weeklyTarget(){ return parseInt(state.profile.weeklyTarget) || 3; }
/* Hər gün üçün real vaxt təxmini: iş dövrləri + istirahət + qızışma. */
function estMinutes(dayKey){
  const ex = PROGRAM[dayKey].ex;
  const secs = ex.reduce((a,e)=>a + e.sets*(40+e.rest), 0);
  const ramp = ex.filter(e=>e.rest>=120).length * 150;   /* ağır hərəkətlərin qızışma dövrləri */
  const total = Math.round((secs + ramp + 480) / 60);     /* +8 dəq ümumi qızışma */
  return `${Math.round(total/5)*5-5}-${Math.round(total/5)*5+5} dəq`;
}
/* Yüngülləşdirmə həftəsi: son deload-dan bəri 18 real (təməl olmayan) məşq. */
function deloadDue(){
  const real = state.sessions.filter(s=>!s.foundation).length;
  return real - (state.deloadAt||0) >= 18;
}
function dismissDeload(){ state.deloadAt = state.sessions.filter(s=>!s.foundation).length; save(); renderToday(); }
function profileDone(){ const p=state.profile; return p.name && p.age && p.h && (p.w || state.weights.length); }
function isFirstEver(){ return state.sessions.length===0; }
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function suppToday(kind){ const e=state.supps.find(x=>x.d===todayISO()); return !!(e && e[kind]); }
function toggleSupp(kind){
  const t = todayISO();
  let e = state.supps.find(x=>x.d===t);
  if(!e){ e = {d:t, creatine:false, protein:false}; state.supps.push(e); state.supps.sort((a,b)=>a.d<b.d?-1:1); }
  e[kind] = !e[kind];
  save(); renderToday();
}
function suppStreak(kind){
  let n=0, d=new Date();
  while(true){
    const e = state.supps.find(x=>x.d===isoOf(d));
    if(!e || !e[kind]) break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}

function setGym(k, v){
  const n = parseFloat(v);
  if(!isFinite(n) || n <= 0) return;
  state.gym = {...gymOf(), [k]:n};
  save(); renderToday();
}

function togglePlate(v){
  const g = gymOf();
  const plates = g.plates.slice();
  const i = plates.indexOf(v);
  if(i >= 0){
    if(plates.length <= 1){ toast("Ən azı bir disk cütü qalmalıdır."); return; }
    plates.splice(i,1);
  } else plates.push(v);
  plates.sort((a,b)=>b-a);
  state.gym = {...g, plates};
  save(); renderToday();
}
function saveSetup(){
  const p = state.profile;

/* Bədən çəkisinin YEGANƏ mənbəyi state.weights[]-dir.
   Bütün yollar (Bugün, Proqres, Qida) buradan keçir. */
function setWeight(v, opts){
  v = parseFloat(v);
  if(!v || v<25 || v>350) return false;
  const t = todayISO(), ex = state.weights.find(x=>x.d===t);
  if(ex) ex.kg = v; else state.weights.push({d:t, kg:v});
  state.weights.sort((a,b)=>a.d<b.d?-1:1);
  state.profile.w = v;                       /* yalnız geriyə uyğunluq üçün güzgü */
  save({cloud:true});
  if(!(opts && opts.quiet)) toast(`${v} kq qeyd edildi`);
  return true;
}

  if(!setWeight($("#"+inputId).value)){ toast("Kiloqramla çəki daxil edin"); return; }

function renderTrain(){
  if(viewDay===null) viewDay = nextDay();
  if(state.active) viewDay = state.active.day;
  const D = PROGRAM[viewDay];
  const plates = ROT.map(k=>`<button class="plate plate-${PROGRAM[k].cls} ${viewDay===k?"on":""} ${state.active&&state.active.day!==k?"lock":""}" onclick="selDay('${k}')" aria-label="${PROGRAM[k].name}"><span>${k}</span></button>`).join("");
  const lbls = ROT.map(k=>`<div>${PROGRAM[k].sub}</div>`).join("");

  const rules = `<details class="rules"><summary>Məşqçinin qaydaları — bir dəfə oxuyun</summary><div class="inner">
      <div class="rule" style="border-bottom:1px solid var(--line)"><p style="padding-top:10px">${WARMUP}</p></div>
      ${RULES.map(r=>`<div class="rule"><b>${r.t}</b><p>${r.d}</p></div>`).join("")}
    </div></details>`;

  let body;
  if(state.active && state.active.day===viewDay){
    body = D.ex.map((ex,i)=>{
      const eff = effEx(ex.key), swapped = eff.key!==ex.key;
      const p = lastPerf(eff.key), st = state.active.ex[ex.key];
      const rows = st.map((s,si)=>{
        const pkg = smartKg(ex.key,si), prep = smartReps(ex.key,si);
        return `<div class="setrow">
          <div class="idx num">${si+1}</div>
          <div class="stepper">
            <button onclick="stepVal('${ex.key}',${si},'kg',-1)" aria-label="minus kg">−</button>
            <input id="in-${ex.key}-${si}-kg" type="number" inputmode="decimal" step="0.5" placeholder="${pkg??"kq"}" value="${s.kg}" oninput="setVal('${ex.key}',${si},'kg',this.value)">
            <button onclick="stepVal('${ex.key}',${si},'kg',1)" aria-label="plus kg">+</button>
          </div>
          <div class="stepper">
            <button onclick="stepVal('${ex.key}',${si},'reps',-1)" aria-label="minus reps">−</button>
            <input id="in-${ex.key}-${si}-reps" type="number" inputmode="numeric" placeholder="${prep}" value="${s.reps}" oninput="setVal('${ex.key}',${si},'reps',this.value)">
            <button onclick="stepVal('${ex.key}',${si},'reps',1)" aria-label="plus reps">+</button>
          </div>
          <button class="check ${s.done?"done":""}" data-set="${ex.key}-${si}" onclick="toggleDone('${ex.key}',${si})" aria-label="set done">✓</button>
        </div>`;
      }).join("");
      const h = hintFor(eff,p);
      const wk = parseFloat(st[0].kg) || suggestKg(eff.key);
      const ramp = (eff.rest>=120 && wk && wk>=30) ? `<div class="ramp">Qızışma dövrləri: <b class="num">${r25(wk*0.4)} kq × 8 → ${r25(wk*0.6)} kq × 5 → ${r25(wk*0.8)} kq × 3</b> — sonra iş dövrləri (sayılmır)</div>` : "";
      return `<div class="card ex" style="--dc:var(--${D.cls})">

    }).join("");
    body += `<button class="btn block" style="margin-top:6px" onclick="finishSession()">Bitir və yadda saxla</button>
             <button class="btn block danger" style="margin-top:10px" onclick="cancelSession()">Məşqi ləğv et</button>`;
  } else {
    body = `<div class="card tight"><div class="small"><b style="color:var(--ink)">Əvvəlcə qızışın.</b> ${WARMUP}</div></div>` +
      D.ex.map((ex,i)=>{

        return `<div class="card ex" style="--dc:var(--${D.cls})">

            <div>
              <div class="name">${i+1}. ${ex.name}</div>
              <div class="meta"><span class="tag hot">${ex.sets} × ${ex.rMin}-${ex.rMax}</span><span class="tag">istirahət ${Math.round(ex.rest/60*10)/10} dəq</span><span class="tag">${ex.tag}</span></div>
            </div>
          </div><button class="techbtn" onclick="openTech('${viewDay}',${i})">Texnika</button></div>
          ${p?`<div class="lastline">Son (${fmtD(p.d)}): <b class="num">${perfStr(p)}</b></div>`:""}

      }).join("") +

  }

  $("#view-train").innerHTML = `
    <div class="plates">${plates}</div>

}
function selDay(k){ if(state.active && state.active.day!==k){ toast("Əvvəlcə cari məşqi bitirin və ya ləğv edin"); return; } viewDay=k; renderTrain(); }
function startSession(day){
  const foundation = isFirstEver();
  const exState = {};
  PROGRAM[day].ex.forEach(ex=>{
    const sug = suggestKg(ex.key);
    const setCount = foundation ? Math.max(2, Math.round(ex.sets/2)) : ex.sets;
    exState[ex.key] = Array.from({length:setCount},()=>({ kg: sug ?? "", reps:"", done:false }));
  });
  state.active = { day, started: todayISO(), ex: exState, foundation };
  viewDay = day; save(); switchTab("train");
  toast(foundation ? "Təməl məşqi başladı — yüngül saxlayın." : `${PROGRAM[day].name} başladı — işə başlayın.`);
}
function setVal(key,i,f,v){ state.active.ex[key][i][f] = v; save(); }
function smartKg(key,i){
  const st = state.active.ex[key];
  for(let j=i-1;j>=0;j--){ const v=parseFloat(st[j].kg); if(v) return v; }
  const p = lastPerf(effEx(key).key);
  if(p) return p.sets[i]?.kg ?? p.sets[p.sets.length-1].kg;
  return null;
}
/* DİQQƏT: bu yalnız placeholder (göz üçün ipucu) qaytarır.
   Heç vaxt state-ə YAZILMIR — istifadəçinin daxil etmədiyi təkrar
   proqressiyaya sayılsaydı, app uydurma məlumat üzərində çəki artırardı. */
function smartReps(key,i){
  const st = state.active.ex[key];
  for(let j=i-1;j>=0;j--){ const v=parseFloat(st[j].reps); if(v) return v; }
  return EXMAP[key].rMax;
}
function stepVal(key,i,f,dir){
  const s = state.active.ex[key][i];
  const step = f==="kg" ? (EXMAP[key].inc || 2.5) : 1;
  let v = parseFloat(s[f]);
  if(!v){ v = f==="kg" ? (smartKg(key,i) ?? step) : smartReps(key,i); } /* first tap = accept suggestion */
  else v += dir*step;
  v = Math.max(0, Math.round(v*10)/10);
  s[f] = String(v);
  const inp = document.getElementById(`in-${key}-${i}-${f}`);
  if(inp) inp.value = v;
  save();
}
function toggleDone(key,i){
  const s = state.active.ex[key][i]; s.done = !s.done;
  if(s.done){
    /* çəkini əvvəlki dövrdən götürmək məntiqlidir; təkrarı UYDURMAQ olmaz */
    if(s.kg === "" ){ const k = smartKg(key,i); if(k !== null && k !== undefined) s.kg = String(k); }
    const kgIn = document.getElementById(`in-${key}-${i}-kg`);
    if(kgIn) kgIn.value = s.kg;
    if(!parseFloat(s.reps)) toast("Təkrar sayını yazın — boş dövr proqressiyaya sayılmır.");
    startTimer(EXMAP[key].rest, effEx(key).name);
  }
  /* yalnız həmin düyməni yenilə — bütün görünüşü yenidən qurmaq
     açıq qaydalar panelini bağlayır və input fokusunu itirir */
  const btn = document.querySelector(`.check[data-set="${key}-${i}"]`);
  if(btn) btn.classList.toggle("done", s.done); else renderTrain();
  save();
}
function finishSession(){
  const a = state.active; if(!a) return;
  const rec = { d: todayISO(), day: a.day, ex: [], foundation: !!a.foundation };
  let n = 0, skipped = 0;
  PROGRAM[a.day].ex.forEach(ex=>{
    const eff = effEx(ex.key);
    /* Çəki 0 ola bilər (bədən çəkisi hərəkətləri). Yeganə şərt: təkrar yazılıb.
       Köhnə kod kg>0 tələb edirdi və Back Extension kimi hərəkətləri səssizcə silirdi. */
    const raw = a.ex[ex.key];
    skipped += raw.filter(s=>s.done && !(parseFloat(s.reps)>0)).length;
    const sets = raw.filter(s=>parseFloat(s.reps)>0)
      .map(s=>({kg:parseFloat(s.kg)||0, reps:parseFloat(s.reps)}));
    if(sets.length){ rec.ex.push({key:eff.key, name:eff.name, sets}); n += sets.length; }
  });
  if(!n){ alert("Bitirmədən əvvəl ən azı bir dövrün təkrar sayını yazın."); return; }
  const warn = skipped ? `\n\nDİQQƏT: ${skipped} işarələnmiş dövrdə təkrar sayı boşdur — onlar qeyd olunmayacaq.` : "";
  if(!confirm(`${PROGRAM[a.day].name} yadda saxlanılsın? ${n} dövr qeyd edilib.${warn}`)) return;
  state.sessions.push(rec); state.active = null; timerSkip(); save({cloud:true});
  toast(`${PROGRAM[rec.day].name} yadda saxlanıldı · növbəti: ${ROT[(ROT.indexOf(rec.day)+1)%3]} Məşqi`);
  viewDay = ROT[(ROT.indexOf(rec.day)+1)%3];
  switchTab("today");
}
function cancelSession(){ if(!confirm("Bu məşqi ləğv etmək istəyirsiniz? Qeyd edilən dövrlər itiriləcək.")) return; state.active=null; timerSkip(); save(); renderTrain(); }

/* ---- sheet plumbing ----
   The old sheet just toggled a class. The page behind it stayed
   scrollable, so on a phone the scroll gesture went to the page instead
   of the sheet, the sheet's own Bağla button sat below the fold on long
   technique sheets, and there was no Esc — which is why it felt like the
   modal ate the page and needed a reload. */
let sheetOpen=false, sheetScrollY=0;

function openSheet(title, sub, bodyHTML){
  $("#sheet").innerHTML = `
    <div class="sheet-head">
      <div class="grab" aria-hidden="true"></div>
      <h3>${title}</h3>
      ${sub?`<div class="stag">${sub}</div>`:""}
      <button class="sheet-x" onclick="closeSheet()" aria-label="Bağla">✕</button>
    </div>
    <div class="sheet-body">${bodyHTML}</div>`;
  $("#overlay").classList.add("on");
  $("#sheet").classList.add("on");
  $("#sheet").style.transform = "";
  const body = $("#sheet .sheet-body");
  if(body) body.scrollTop = 0;

  // Freeze the page behind without losing where the user was.
  sheetScrollY = window.scrollY;
  document.body.style.position="fixed";
  document.body.style.top = `-${sheetScrollY}px`;
  document.body.style.width="100%";
  sheetOpen = true;
}

function closeSheet(){
  $("#overlay").classList.remove("on");
  $("#sheet").classList.remove("on");
  $("#sheet").style.transform = "";
  if(sheetOpen){
    document.body.style.position="";
    document.body.style.top="";
    document.body.style.width="";
    window.scrollTo(0, sheetScrollY);
    sheetOpen = false;
  }
}

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && sheetOpen){ e.preventDefault(); closeSheet(); }
});

/* Swipe the sheet down to dismiss, but only from the top of its scroll. */
(function(){
  let y0=null, dragging=false;
  const sheet = () => $("#sheet");
  document.addEventListener("touchstart", e => {
    if(!sheetOpen) return;
    const body = $("#sheet .sheet-body");
    if(body && body.scrollTop > 0) return;
    if(!e.target.closest("#sheet")) return;
    y0 = e.touches[0].clientY; dragging = true;
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if(!dragging || y0===null) return;
    const dy = e.touches[0].clientY - y0;
    if(dy > 0) sheet().style.transform = `translateX(-50%) translateY(${dy}px)`;
  }, {passive:true});
  document.addEventListener("touchend", e => {
    if(!dragging) return;
    dragging = false;
    const dy = e.changedTouches[0].clientY - y0;
    y0 = null;
    sheet().style.transform = "";
    if(dy > 90) closeSheet();
  });
})();

/* ================= rest timer =================
   The countdown is derived from a target TIMESTAMP, never from a
   counter that setInterval decrements. Backgrounded tabs get their
   timers throttled to once a minute (or frozen outright on iOS), so
   a `tLeft--` clock loses minutes every time the phone locks. Reading
   the wall clock instead means throttling only costs redraw smoothness,
   and the remaining time is still right when you come back — or after
   a reload, because the target is persisted. */
let tInt=null, tEnd=0, tTotal=0, tLabel="", tFired=false;
const RING_C = 565.5; // 2*pi*90, matches the SVG circle radius
const TIMER_KEY = "forge-timer";

function tRemaining(){ return Math.max(0, Math.ceil((tEnd - Date.now())/1000)); }
function tRunning(){ return tEnd > Date.now(); }

function tPersist(){
  try{
    if(tRunning()) localStorage.setItem(TIMER_KEY, JSON.stringify({tEnd, tTotal, tLabel}));
    else localStorage.removeItem(TIMER_KEY);
  }catch(e){}
}

function restoreTimer(){
  try{
    const raw = localStorage.getItem(TIMER_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d && d.tEnd > Date.now()){
      tEnd=d.tEnd; tTotal=d.tTotal||0; tLabel=d.tLabel||"";
      $("#timerLab").textContent = tLabel;
      $("#timer").classList.add("on");
      tLoop();
    } else {
      localStorage.removeItem(TIMER_KEY);
    }
  }catch(e){ /* a lost timer is not worth an error */ }
}

function startTimer(sec,label){
  if(!sec || sec<=0) return;
  tEnd = Date.now() + sec*1000; tTotal = sec; tFired = false;
  tLabel = String(label||"İSTİRAHƏT").toUpperCase();
  const el=$("#timer"); el.classList.add("on"); el.classList.remove("done");
  $("#timerLab").textContent = tLabel;
  tPersist();
  acquireWakeLock();
  tLoop();
}

function tLoop(){
  clearInterval(tInt);
  tickRender();
  tInt = setInterval(tick,250);
}

function tick(){
  tickRender();
  if(tRunning() || tFired) return;
  tFired = true;
  clearInterval(tInt); tInt=null;
  $("#timer").classList.add("done");
  tPersist();
  // Only make noise if we are actually on screen — a beep fired ten
  // minutes late, after the phone wakes, is worse than no beep.
  if(document.visibilityState === "visible"){
    beep();
    try{navigator.vibrate && navigator.vibrate([160,90,160]);}catch(e){}
  }
  releaseWakeLock();
  setTimeout(()=>{ if(!tRunning()){ $("#timer").classList.remove("on"); $("#timer").classList.remove("done"); } },1900);
}

function tickRender(){
  const left = tRemaining();
  const m=Math.floor(left/60), s=left%60;
  $("#timerDigits").textContent = m+":"+String(s).padStart(2,"0");
  const frac = tTotal>0 ? Math.min(1,Math.max(0,left/tTotal)) : 0;
  $("#timerRing").setAttribute("stroke-dashoffset", (RING_C*(1-frac)).toFixed(1));
  /* divar saatı ilə: "18:45-də davam" — dövrlər arasında baxdığınız saat */
  const b = $("#timerBack");
  if(b) b.textContent = left > 0 ? `${backAt(left)}-də davam` : "başla";
}

function timerAdd(){
  if(!tRunning()) tEnd = Date.now();
  tEnd += 30000;
  tTotal = Math.max(tTotal, Math.ceil((tEnd-Date.now())/1000));
  tFired = false;
  $("#timer").classList.remove("done");
  $("#timer").classList.add("on");
  acquireWakeLock();
  tPersist();
  tLoop();
}

function timerSkip(){
  clearInterval(tInt); tInt=null; tEnd=0; tTotal=0; tFired=false;
  $("#timer").classList.remove("on"); $("#timer").classList.remove("done");
  tPersist();
  releaseWakeLock();
}

/* ---- keep the screen awake while resting (iOS 16.4+ Safari) ---- */
let wakeLock = null;
async function acquireWakeLock(){
  try{ if("wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); } }catch(e){}
}
function releaseWakeLock(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible") return;
  // Coming back from a locked screen: redraw from the clock at once, and
  // settle the timer if it ran out while we were away.
  if(tEnd){ tickRender(); if(!tRunning()) tick(); else { acquireWakeLock(); tLoop(); } }
});
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="square"; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.16);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.18);
    });
  }catch(e){}
}

  renderFuelOut();
}
/* şablonu hesablanmış hədəfə uyğunlaşdıran əmsal */
function mealRatio(){
  const p = state.profile, w = latestW();
  if(!(p.age && p.h && w)) return 1;
  const bmr = 10*w + 6.25*p.h - 5*p.age + (p.sex === "f" ? -161 : 5);
  const target = bmr*p.act + p.sur;
  return Math.max(0.5, Math.min(1.6, target/MEAL_BASE));
}
function fuelIn(){
  const p = state.profile;
  p.age = parseFloat($("#f-age").value)||"";
  p.h = parseFloat($("#f-h").value)||"";
  p.sex = $("#f-sex").value;
  p.act = parseFloat($("#f-act").value);
  p.sur = parseInt($("#f-sur").value);
  $("#surV").textContent = "+"+p.sur;
  save(); renderFuelOut();
}
function renderFuelOut(){
  /* Çəki HƏMİŞƏ state-dən oxunur, DOM inputundan yox — tək mənbə qaydası (bax setWeight). */
  const p = state.profile, w = latestW();
  const box = $("#fuelOut");
  if(!(p.age && p.h && w)){ box.innerHTML = `<div class="card"><div class="empty">Hədəflərinizi görmək üçün yaş, boy və çəkinizi daxil edin.</div></div>`; return; }
  const bmr = 10*w + 6.25*p.h - 5*p.age + (p.sex === "f" ? -161 : 5);   /* Mifflin-St Jeor */
  const tdee = bmr*p.act, target = Math.round((tdee+p.sur)/10)*10;
  const pr = Math.round(2.0*w), fat = Math.round(0.9*w);
  const carbs = Math.max(0, Math.round((target - pr*4 - fat*9)/4));
  const pct = v => Math.round(v/target*100);
  box.innerHTML = `<div class="card">
    <div class="small" style="letter-spacing:.16em;text-transform:uppercase;font-size:10.5px">Gündəlik hədəf · kütlə artımı</div>
    <div class="bignum num">${target.toLocaleString()} <small>kkal</small></div>
    <div class="kcalrow"><span>Saxlama ≈ <b class="num">${Math.round(tdee).toLocaleString()}</b></span><span>Hədəf: <b class="num">+${(w*0.0025).toFixed(1)}–${(w*0.005).toFixed(1)} kq/həftə</b></span></div>
    <div class="macro">
      <div class="mrow"><span>Zülal</span><b class="num">${pr} q · ${pct(pr*4)}%</b></div><div class="mbar"><i style="width:${pct(pr*4)}%;background:var(--b)"></i></div>
    </div>
    <div class="macro">
      <div class="mrow"><span>Karbohidrat</span><b class="num">${carbs} q · ${pct(carbs*4)}%</b></div><div class="mbar"><i style="width:${pct(carbs*4)}%;background:var(--c)"></i></div>
    </div>
    <div class="macro">
      <div class="mrow"><span>Yağ</span><b class="num">${fat} q · ${pct(fat*9)}%</b></div><div class="mbar"><i style="width:${pct(fat*9)}%;background:var(--a)"></i></div>
    </div>
  </div>`;
}

/* ================= PROGRESS ================= */
function chartSVG(pts,color,unit){
  if(!pts.length) return `<div class="empty">Hələ heç nə qeyd edilməyib — məlumat burada özü çəkilir.</div>`;
  const W=340,H=150,L=8,R=14,T=18,B=22;
  const ys = pts.map(p=>p.y);
  let mn=Math.min(...ys), mx=Math.max(...ys);
  if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  const X=i=> L + (W-L-R) * (pts.length===1 ? 0.5 : i/(pts.length-1));
  const Y=v=> T + (H-T-B) * (1-(v-mn)/(mx-mn));
  const path = pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const dots = pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?color:"#171b21"}" stroke="${color}" stroke-width="2"/>`).join("");
  const lastX=X(pts.length-1), lastY=Y(pts[pts.length-1].y);
  const anchor = lastX > W-64 ? "end" : "middle";
  const grid = [0.25,0.5,0.75].map(f=>`<line x1="${L}" x2="${W-R}" y1="${(T+(H-T-B)*f).toFixed(1)}" y2="${(T+(H-T-B)*f).toFixed(1)}" stroke="#232933" stroke-width="1"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${grid}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${lastX}" y="${Math.max(lastY-11,12)}" text-anchor="${anchor}" font-size="12.5" font-weight="700" fill="${color}" font-family="var(--mono)">${pts[pts.length-1].y}${unit}</text>
    <text x="${L}" y="${H-4}" font-size="10" fill="#6b7480">${fmtD(pts[0].d)}</text>
    <text x="${W-R}" y="${H-4}" text-anchor="end" font-size="10" fill="#6b7480">${fmtD(pts[pts.length-1].d)}</text>
  </svg>`;
}
function renderProg(){
  const wPts = state.weights.map(x=>({d:x.d, y:Math.round(x.kg*10)/10}));
  const liftKeys = [...new Set(state.sessions.flatMap(s=>s.ex.map(e=>e.key)))];
  if(!selLift || !liftKeys.includes(selLift)) selLift = liftKeys.includes("sq") ? "sq" : liftKeys[0] || null;

  let liftBlock = `<div class="empty">İlk məşqinizi bitirin, güc qrafikləri burada görünəcək.</div>`;
  if(selLift){
    /* Bədən çəkisi ilə edilən hərəkətdə 1TM mənasızdır (kg=0 → düz sıfır xətti).
       Belə hallarda ümumi təkrar sayının trendini göstəririk. */
    const bwOnly = state.sessions.every(s=>{
      const f=s.ex.find(e=>e.key===selLift);
      return !f || f.sets.every(st=>!(st.kg>0));
    });
    const pts=[]; let pr=null;
    state.sessions.forEach(s=>{
      const f=s.ex.find(e=>e.key===selLift); if(!f) return;
      if(bwOnly){
        const reps = f.sets.reduce((a,st)=>a+st.reps,0);
        pts.push({d:s.d, y:reps});
        if(!pr||reps>pr.v) pr={v:reps, kg:0, reps, d:s.d};
        return;
      }
      let best=null;
      f.sets.forEach(st=>{ const v=e1rm(st.kg,st.reps); if(!best||v>best.v) best={v,kg:st.kg,reps:st.reps}; });
      if(best){ pts.push({d:s.d, y:Math.round(best.v)}); if(!pr||best.v>pr.v) pr={...best,d:s.d}; }
    });
    liftBlock = `
      <select class="lift" onchange="pickLift(this.value)">${liftKeys.map(k=>`<option value="${k}" ${k===selLift?"selected":""}>${EXMAP[k].name}</option>`).join("")}</select>
      <div class="chartbox">${chartSVG(pts,"#f3b73f", bwOnly?" təkrar":" kq")}</div>
      ${pr?( bwOnly
        ? `<div class="small">Bədən çəkisi · ümumi təkrar trendi · Ən yaxşı məşq: <b style="color:var(--ink)" class="num">${pr.reps} təkrar</b> (${fmtD(pr.d)})<span class="prbadge">REKORD ${pr.v} təkrar</span></div>`
        : `<div class="small">Təxmini 1TM trendi · Ən yaxşı dövr: <b style="color:var(--ink)" class="num">${pr.kg} kq × ${pr.reps}</b> (${fmtD(pr.d)})<span class="prbadge">REKORD ${Math.round(pr.v)} kq</span></div>`):""}`;
  }

  const hist = state.sessions.length ? state.sessions.slice().reverse().map((s,ri)=>{
    const i = state.sessions.length-1-ri;
    const n = s.ex.reduce((a,e)=>a+e.sets.length,0);
    return `<details class="hist"><summary><span><span class="mini-plate mp-${PROGRAM[s.day].cls}"></span><b>${PROGRAM[s.day].name}</b>${s.foundation?` <span class="prbadge">TƏMƏL</span>`:""} · ${fmtD(s.d)}</span><span class="hs num">${n} dövr</span></summary>
      ${s.ex.map(e=>`<div class="histset"><b>${e.name}</b> — <span class="num">${e.sets.map(x=>`${x.kg}×${x.reps}`).join(", ")}</span></div>`).join("")}
      <button class="btn sm danger" style="margin:8px 0 10px" onclick="delSession(${i})">Məşqi sil</button>
    </details>`;
  }).join("") : `<div class="empty">Hələ məşq yoxdur. Məşq etdikcə tarixçə özü yazılacaq.</div>`;

  $("#view-prog").innerHTML = `
    <div class="sect">Bədən çəkisi</div>
    <div class="card">
      <div class="chartbox">${chartSVG(wPts,"#4a7dff"," kq")}</div>
      <div class="inline-log" style="margin-top:10px">
        <input id="pw" type="number" inputmode="decimal" step="0.1" placeholder="Bugünkü çəkini qeyd et (kq)">
        <button class="btn sm" onclick="addWeight('pw')">Qeyd et</button>
      </div>
      ${state.weights.length?`<div class="loglist">${state.weights.slice(-6).reverse().map(x=>{
        const idx = state.weights.indexOf(x);
        return `<div class="logrow"><span class="num"><b>${x.kg} kq</b></span><span class="d">${fmtD(x.d)}</span><button class="xdel" onclick="delWeight(${idx})">✕</button></div>`;
      }).join("")}</div>`:""}
    </div>

    <div class="sect">Güc · təxmini 1TM</div>
    <div class="card">${liftBlock}</div>

    <div class="sect">Bu həftənin həcmi</div>
    <div class="card">${volumeHTML()}</div>

    <div class="sect">Tarixçə</div>
    <div class="card">${hist}</div>`;
}

/* Hansı əzələni az işlədirsən — rəqəmlə deyil, bədən üzərində. */
function volumeHTML(){
  const vol = setsPerMuscle(7);
  const total = Object.values(vol).reduce((a,b)=>a+b,0);
  if(!total) return `<div class="empty">Son 7 gündə məşq yoxdur — bir məşq edin, xəritə özü dolacaq.</div>`;
  const shade = heatShade(vol);
  const weak = weakestMuscles(vol, 4);
  const rows = Object.keys(MUSCLES)
    .map(k => ({ k, name:MUSCLES[k].n, v:vol[k]||0, lo:(WEEKLY_SETS[k]||[8])[0] }))
    .sort((a,b) => b.v - a.v);
  const max = Math.max(1, ...rows.map(r => Math.max(r.v, r.lo)));

  return `
    <div class="bodypair heat">${bodyView("front",shade,"heat")}${bodyView("back",shade,"heat")}</div>
    <div class="heatkey">
      <span><i class="h0"></i>yox</span><span><i class="h1"></i>çox az</span>
      <span><i class="h2"></i>az</span><span><i class="h3"></i>yaxşı</span><span><i class="h4"></i>çox</span>
    </div>
    ${weak.length
      ? `<div class="weakbox"><b>Bu həftə az işlənib</b><p>${weak.map(x=>`${x.name} (${x.sets}/${(WEEKLY_SETS[x.key]||[8])[0]})`).join(" · ")}</p></div>`
      : `<div class="weakbox ok"><b>Bu həftə bütün əzələlər örtülüb.</b></div>`}
    <details class="rules flat"><summary>Əzələ başına dövr</summary><div class="inner">
      <div class="barrows">${rows.map(r=>`
        <div class="barrow">
          <span class="bl">${r.name}</span>
          <span class="bt"><i style="width:${(r.v/max*100).toFixed(1)}%;background:${r.v>=r.lo?"var(--green)":r.v>0?"var(--c)":"var(--line)"}"></i>
            <u style="left:${(r.lo/max*100).toFixed(1)}%"></u></span>
          <span class="bv num">${r.v}</span>
        </div>`).join("")}</div>
      <p class="small" style="margin-top:10px">İşarə — artım üçün həftəlik minimum.
        Köməkçi əzələ yarım dövr sayılır. Son 7 gün.</p>
    </div></details>`;
}
function pickLift(k){ selLift=k; renderProg(); }
function delWeight(i){ if(!confirm("Bu çəki qeydini silmək istəyirsiniz?")) return; state.weights.splice(i,1); if(state.weights.length) state.profile.w = state.weights[state.weights.length-1].kg; save({cloud:true}); renderProg(); }
function delSession(i){ if(!confirm("Bu məşqi tarixçədən silmək istəyirsiniz?")) return; state.sessions.splice(i,1); save({cloud:true}); renderProg(); }

/* ================= boot ================= */

  const d = gymNow();
  $("#dateChip").innerHTML =
    `<b>${GUN_ADI[d.getDay()]}</b><br>${d.getDate()} ${AY_QISA[d.getMonth()]} ${d.getFullYear()}` +

renderDateChip();
/* offset yükləndikdən sonra yenidən — və dəqiqə dəyişdikcə */
loadState().then(()=>{ renderSaveNote(); renderNetNote(); renderDateChip(); renderToday(); restoreTimer(); });
setInterval(renderDateChip, 30000);

/* Service worker — zalın zirzəmisində siqnal olmayanda app yenə açılsın.
   Nisbi yol: alt qovluqda (məs. /gym/) yerləşdirmə üçün vacibdir. */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
window.addEventListener("load", ()=>{ sbBoot(); }); /* CDN skripti (defer) yükləndikdən sonra */
