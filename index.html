<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FORGE</title>
<meta name="description" content="Məşq jurnalı — çəki proqressiyası, əzələ həcmi, texnika.">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1116; --card:#161a21; --card2:#1c222b; --line:#252c37;
  --ink:#e8edf5; --dim:#8b96a7; --dim2:#5d6878;
  --acc:#f3b73f; --good:#3ecf8e; --bad:#ff6b6b; --info:#5b9cff;
  --r:14px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(78px + var(--sab));overscroll-behavior-y:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(14,17,22,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{font-size:19px;font-weight:800;letter-spacing:.16em}
.logo b{color:var(--acc)}
.hclock{margin-left:auto;text-align:right;line-height:1.15}
.hclock .t{font-size:17px;font-weight:700}
.hclock .l{font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.08em}
.iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--dim);
  width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;flex:none}
.iconbtn:active{background:var(--line)}

main{padding:14px 16px 20px;max-width:760px;margin:0 auto}
.view{display:none}
.view.on{display:block}

/* ---------- building blocks ---------- */
.sect{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);
  margin:22px 0 9px;font-weight:700}
.sect:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px}
.card.tight{padding:12px}
.card.flat{background:var(--card2)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.small{font-size:13px;color:var(--dim);line-height:1.55}
.tiny{font-size:11.5px;color:var(--dim2)}
.mut{color:var(--dim)}
.acc{color:var(--acc)} .good{color:var(--good)} .bad{color:var(--bad)}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.huge{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}

.btn{background:var(--acc);color:#151206;border:0;border-radius:11px;padding:13px 16px;
  font-weight:700;font-size:15px;cursor:pointer;width:100%;display:block}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:9px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);
  border-radius:99px;padding:4px 10px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.pill.on{background:var(--acc);color:#151206;border-color:var(--acc);font-weight:700}
.pill.g{color:var(--good);border-color:rgba(62,207,142,.35)}
.pill.b{color:var(--bad);border-color:rgba(255,107,107,.35)}

.field{margin-bottom:11px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--dim2);margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{width:100%;background:var(--card2);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- today brief ---------- */
.brief{background:linear-gradient(160deg,#1b212b,#151920);border:1px solid var(--line);
  border-radius:var(--r);padding:17px;margin-bottom:11px}
.brief .day{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--acc);font-weight:700}
.brief h2{font-size:23px;margin:5px 0 3px}
.focus{list-style:none;margin:13px 0 0;padding:0}
.focus li{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45}
.focus li:first-child{border-top:0}
.focus .ic{flex:none;width:18px;text-align:center;opacity:.9}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 9px;text-align:center}
.stat .v{font-size:19px;font-weight:800}
.stat .v small{font-size:11px;color:var(--dim2);font-weight:600}
.stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim2);margin-top:3px}

/* ---------- exercise / set logging ---------- */
.exc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.exc.done{border-color:rgba(62,207,142,.4)}
.exh{padding:13px 14px;display:flex;align-items:flex-start;gap:10px}
.exh .nm{font-weight:700;font-size:15.5px;line-height:1.3}
.exh .sub{font-size:11.5px;color:var(--dim2);margin-top:3px}
.exh .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.mini{background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:8px;
  padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.mini:active{background:var(--line)}
.loadnote{margin:0 14px 10px;background:rgba(91,156,255,.09);border:1px solid rgba(91,156,255,.25);
  border-radius:9px;padding:8px 10px;font-size:12px;color:#a8c7ff}
.hint{margin:0 14px 11px;background:var(--card2);border-left:2px solid var(--dim2);
  border-radius:0 8px 8px 0;padding:9px 11px;font-size:12.5px;color:var(--dim);line-height:1.5}
.hint.up{border-left-color:var(--good);color:#b6e8d0}
.hint.hold{border-left-color:var(--acc);color:#f0dcae}

.sets{padding:0 14px 13px}
.shead,.srow{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center}
.shead{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2);
  padding-bottom:6px;font-weight:700}
.srow{margin-bottom:7px}
.srow .n{font-size:12px;color:var(--dim2);text-align:center;font-weight:700}
.srow input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:11px 8px;text-align:center;font-weight:700;font-size:15px;outline:0}
.srow input:focus{border-color:var(--acc);background:#20262f}
.srow.done input{border-color:rgba(62,207,142,.3);color:#9fe3c2}
.check{background:var(--card2);border:1px solid var(--line);color:var(--dim2);border-radius:9px;
  height:42px;font-size:16px;cursor:pointer;font-weight:800}
.check.done{background:var(--good);border-color:var(--good);color:#062516}
.addset{width:100%;background:transparent;border:1px dashed var(--line);color:var(--dim2);
  border-radius:9px;padding:8px;font-size:12.5px;cursor:pointer;margin-top:2px}

/* ---------- rest timer ---------- */
.timer{position:fixed;left:0;right:0;bottom:calc(70px + var(--sab));z-index:45;
  padding:0 16px;transform:translateY(140%);transition:transform .25s ease;pointer-events:none}
.timer.on{transform:none;pointer-events:auto}
.timerin{max-width:760px;margin:0 auto;background:var(--acc);color:#151206;border-radius:13px;
  padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.timerin .tl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;opacity:.75}
.timerin .tv{font-size:24px;font-weight:800;line-height:1}
.timerin button{background:rgba(0,0,0,.16);border:0;color:#151206;border-radius:9px;
  padding:8px 11px;font-weight:700;font-size:12.5px;cursor:pointer}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(14,17,22,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + var(--sab))}
.tabbar button{flex:1;background:0;border:0;color:var(--dim2);padding:7px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
.tabbar button .ti{font-size:17px;line-height:1}
.tabbar button .tt{font-size:10px;font-weight:700;letter-spacing:.02em}
.tabbar button.on{color:var(--acc)}

/* ---------- MODAL (mobil: aşağıdan; masaüstü: mərkəzdə, məhdud hündürlük) ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);
  opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;
  left:0;right:0;bottom:0;border-radius:20px 20px 0 0;max-height:86vh;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:none}
@media(min-width:700px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(620px,92vw);max-height:82vh;
    border-radius:16px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:.2s}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.shh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:10px;flex:none;position:relative}
.grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;
  border-radius:9px;background:var(--line)}
@media(min-width:700px){.grab{display:none}.shh{padding-top:16px}}
.shh .st{font-weight:700;font-size:16px;flex:1;min-width:0}
.shx{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
  width:34px;height:34px;font-size:17px;cursor:pointer;flex:none;font-weight:700}
.shb{padding:15px 16px calc(20px + var(--sab));overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
@media(min-width:700px){.shb{padding-bottom:20px}}

/* ---------- technique ---------- */
.tsec{margin-bottom:15px}
.tsec h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);margin:0 0 7px}
.tlist{margin:0;padding-left:18px}
.tlist li{margin-bottom:6px;font-size:13.5px;line-height:1.55}
.tlist.err li{color:#ffb3b3}
.vidbtn{display:flex;align-items:center;gap:10px;background:#2a1013;border:1px solid #52212a;
  border-radius:11px;padding:12px 14px;color:#ff9d9d;text-decoration:none;font-weight:700;font-size:14px}
.vidbtn span.p{background:#ff3b3b;color:#fff;border-radius:6px;padding:2px 7px;font-size:11px;flex:none}

/* ---------- muscle map ---------- */
.bodywrap{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bodywrap svg{width:100%;height:auto;display:block}
.bodylab{text-align:center;font-size:10.5px;color:var(--dim2);text-transform:uppercase;
  letter-spacing:.09em;margin-top:2px;font-weight:700}
.legend{display:flex;align-items:center;gap:5px;justify-content:center;margin-top:11px;flex-wrap:wrap}
.legend i{width:15px;height:9px;border-radius:2px;display:inline-block}
.mrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mn{font-size:13px;width:88px;flex:none}
.mbar{flex:1;height:7px;background:var(--card2);border-radius:9px;overflow:hidden;position:relative}
.mbar i{display:block;height:100%;border-radius:9px}
.mbar .tgt{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--dim2);opacity:.55}
.mrow .mv{font-size:12px;color:var(--dim);width:52px;text-align:right;flex:none}

/* ---------- charts ---------- */
.chartbox{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 8px 6px}
.chartbox svg{width:100%;height:auto;display:block}

/* ---------- misc ---------- */
.warn{background:rgba(243,183,63,.1);border:1px solid rgba(243,183,63,.3);color:#f6dca2;
  border-radius:11px;padding:11px 13px;font-size:13px;margin-bottom:11px;line-height:1.5}
.err{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.3);color:#ffbcbc}
.ok{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.3);color:#a9e8cb}
.empty{text-align:center;color:var(--dim2);padding:26px 12px;font-size:13.5px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translate(-50%,20px);
  background:#e8edf5;color:#11151b;padding:11px 17px;border-radius:11px;font-weight:700;font-size:13.5px;
  z-index:70;opacity:0;transition:.22s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.srch{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;outline:0;margin-bottom:10px}
.srch:focus{border-color:var(--acc)}
.libitem{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;margin-bottom:7px;cursor:pointer}
.libitem:active{background:var(--card2)}
.libitem .nm{font-weight:600;font-size:14px;line-height:1.3}
.libitem .mt{font-size:11px;color:var(--dim2);margin-top:2px}
.libitem .go{margin-left:auto;color:var(--dim2);flex:none;font-size:18px}
.plate{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.plate span{background:var(--card2);border:1px solid var(--line);border-radius:7px;
  padding:3px 8px;font-size:11.5px;font-weight:700}
</style>
</head>
<body>

<header>
  <div class="logo">F<b>O</b>RGE</div>
  <div class="hclock" onclick="openClock()">
    <div class="t num" id="clkT">--:--</div>
    <div class="l" id="clkL">zal saatı</div>
  </div>
  <button class="iconbtn" onclick="openSettings()" aria-label="Ayarlar">⚙</button>
</header>

<main>
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-train"></section>
  <section class="view" id="v-prog"></section>
  <section class="view" id="v-lib"></section>
</main>

<div class="timer" id="timer">
  <div class="timerin">
    <div style="flex:1;min-width:0">
      <div class="tl" id="tLabel">İSTİRAHƏT</div>
      <div class="tv num" id="tVal">0:00</div>
    </div>
    <button onclick="timerAdd(30)">+30s</button>
    <button onclick="timerSkip()">Keç</button>
  </div>
</div>

<nav class="tabbar">
  <button data-tab="today" class="on" onclick="tab('today')"><span class="ti">◎</span><span class="tt">Bugün</span></button>
  <button data-tab="train" onclick="tab('train')"><span class="ti">▦</span><span class="tt">Məşq</span></button>
  <button data-tab="prog" onclick="tab('prog')"><span class="ti">◈</span><span class="tt">Proqres</span></button>
  <button data-tab="lib" onclick="tab('lib')"><span class="ti">☰</span><span class="tt">Hərəkətlər</span></button>
</nav>

<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="shh"><div class="grab"></div>
    <div class="st" id="sheetTitle"></div>
    <button class="shx" onclick="closeSheet()" aria-label="Bağla">✕</button>
  </div>
  <div class="shb" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   HƏRƏKƏT KİTABXANASI
   eq (avadanlıq) çəkinin NECƏ qeyd olunduğunu təyin edir — bu, appın
   ən vacib qaydasıdır və hər kartda açıq yazılır:
     barbell / smith / ez  → ÜMUMİ çəki, ştanq daxil (plate calculator var)
     dumbbell              → BİR hantelin çəkisi
     machine / cable       → dəstədəki rəqəm
     bodyweight            → ƏLAVƏ çəki (0 = sırf bədən çəkisi)
     assisted              → kömək çəkisi (çox = asan)
   m = əsas əzələlər, s = köməkçi əzələlər (əzələ xəritəsi bunlardan qurulur)
   ================================================================== */
const LIB = [
/* ---------------- DÖŞ ---------------- */
{k:"bb-bench",n:"Ştanqla uzanaraq press",en:"Barbell Bench Press",eq:"barbell",m:["chest"],s:["triceps","front-delt"],rep:[8,12],rest:150,
 cue:["Kürək sümüklərini arxaya və aşağı sıx, döşü qabağa çıxar. Ayaqlar yerə möhkəm bassın.","Ştanqı döşün alt hissəsinə endir, dirsəklər bədəndən 45° bucaqda.","Aşağıda 1 saniyə dayan — sıçratma yoxdur.","Yuxarı və bir az arxaya itələ, ştanq çiyinlərin üzərində bitsin."],
 err:["Dirsəkləri 90° açmaq — çiyin zədəsi riski.","Ştanqı döşdən sıçratmaq.","Ombanı skamyadan qaldırmaq."]},
{k:"db-bench",n:"Hantellə uzanaraq press",en:"Dumbbell Bench Press",eq:"dumbbell",m:["chest"],s:["triceps","front-delt"],rep:[8,12],rest:120,
 cue:["Hantellər döş xəttində, biləklər düz.","Aşağıda döşdə dərin gərilmə hiss et.","Yuxarıda hantelləri toqquşdurma — gərginlik itir."],
 err:["Aşağı nöqtədən sıçrayışla qalxmaq.","Biləklərin geri qatlanması."]},
{k:"incline-bb",n:"Maili ştanqla press",en:"Incline Barbell Press",eq:"barbell",m:["chest"],s:["front-delt","triceps"],rep:[8,12],rest:150,
 cue:["Skamya 30° — daha dik olsa çiyin presinə çevrilir.","Ştanq körpücük sümüyünün altına ensin."],
 err:["Skamyanın çox dik olması.","Yarımçıq amplituda."]},
{k:"incline-db",n:"Maili hantellə press",en:"Incline Dumbbell Press",eq:"dumbbell",m:["chest"],s:["front-delt","triceps"],rep:[8,12],rest:120,
 cue:["Skamya 30°. Hantelləri çiyin səviyyəsindən başlat.","Yuxarı və bir az bir-birinə doğru itələ."],
 err:["Çox dik skamya.","Aşağıda gərilməni tam etməmək."]},
{k:"machine-press",n:"Aparatda döş presi",en:"Machine Chest Press",eq:"machine",m:["chest"],s:["triceps","front-delt"],rep:[10,15],rest:90,
 cue:["Oturacağı tutacaqlar döş xəttində olacaq şəkildə qur.","Kürəkləri arxaya sıx, qolları tam aç."],
 err:["Oturacağın çox hündür qalması.","Çiyinləri qabağa yumrulamaq."]},
{k:"dips",n:"Paralel qollarda enmə (döş)",en:"Chest Dips",eq:"bodyweight",m:["chest"],s:["triceps","front-delt"],rep:[8,12],rest:120,
 cue:["Gövdəni önə əy — dik dursan triseps işləyir.","Çiyin dirsək səviyyəsinə çatana qədər en."],
 err:["Çox dərin enmək — çiyin zədəsi.","Yellənərək ətalətlə qalxmaq."]},
{k:"cable-fly",n:"Kabellə döş açması",en:"Cable Chest Fly",eq:"cable",m:["chest"],s:[],rep:[12,15],rest:75,
 cue:["Dirsəklərdə yüngül bükülmə sabit qalır — qövs dəyişmir.","Öndə döşü sıx, geridə dərin gərilməyə aç."],

const EQ = {

  ez:        {n:"EZ ştanq",     note:"ÜMUMİ çəki — ştanq daxil", bar:true},

/* ==================================================================
   1. STATE
   ================================================================== */
const KEY = "forge-data";
const DEF = {
  v: 3,
  profile: { name:"", sex:"m", age:"", h:"", weeklyTarget:3, clockOffset:0 },
  settings: {
    inc: { barbell:2.5, ez:2.5, smith:2.5, dumbbell:2, machine:5, cable:5, bodyweight:2.5, assisted:5 },
    barWeight: 20, ezWeight: 10,
    plates: [20,15,10,5,2.5,1.25],
    repMin: 8, repMax: 12, useLibRange: false,
    autoRest: true
  },
  plan: {
    A: { name:"A · Ağır",  ex:["back-squat","bb-bench","lat-pulldown","rdl","lateral-raise","pushdown"] },
    B: { name:"B · Orta",  ex:["leg-press","cable-row","db-ohp","leg-curl","ez-curl","calf-standing"] },
    C: { name:"C · Həcm",  ex:["bulgarian","incline-db","chest-row","back-ext","face-pull","cable-crunch"] }
  },
  sessions: [], weights: [], active: null, deloadAt: 0, ts: 0
};
let state = JSON.parse(JSON.stringify(DEF));
let storageOK = true;

const EXBY = {}; LIB.forEach(e => EXBY[e.k] = e);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ---- köhnə versiyadan açar uyğunluğu — tarixçə itmir ---- */
const OLDKEY = {
  sq:"back-squat", bp:"bb-bench", lp:"lat-pulldown", rdl:"rdl", lat:"lateral-raise", tri:"pushdown",
  lpz:"leg-press", row:"cable-row", ohp:"ohp", llc:"leg-curl", cur:"ez-curl", calf:"calf-standing",
  bss:"bulgarian", idp:"incline-db", csmr:"chest-row", be:"back-ext", fp:"face-pull", abs:"cable-crunch",
  hsq:"hack-squat", gsq:"goblet", dbp:"db-bench", mchp:"machine-press", apu:"pullup", ht:"hip-thrust",
  cpt:"hip-thrust", clr:"cable-lateral", ohte:"oh-ext", skc:"skull", smsq:"back-squat", oadr:"db-row",
  sdp:"db-ohp", mshp:"machine-ohp", slc:"seated-curl", dbcu:"db-curl", cbcu:"cable-curl", ham:"hammer",
  scr:"calf-seated", lpcr:"calf-standing", wlg:"lunge", stpu:"lunge", incm:"incline-bb", fly:"cable-fly",
  pdk:"pec-deck", dbfl:"cable-fly", mhr:"machine-row", ght:"back-ext", rpd:"rear-fly", bpa:"rear-fly",
  hkr:"hanging-raise", dsu:"cable-crunch"
};

function migrate(d){
  const s = {...JSON.parse(JSON.stringify(DEF)), ...d};
  s.profile  = {...DEF.profile,  ...(d.profile||{})};
  s.settings = {...DEF.settings, ...(d.settings||{})};
  s.settings.inc = {...DEF.settings.inc, ...((d.settings||{}).inc||{})};
  s.plan = (d.plan && d.plan.A && d.plan.A.ex) ? d.plan : JSON.parse(JSON.stringify(DEF.plan));
  s.sessions = Array.isArray(d.sessions) ? d.sessions : [];
  s.weights  = Array.isArray(d.weights)  ? d.weights  : [];

  /* v1/v2 → v3: hərəkət açarlarını yeni kitabxanaya bağla */
  s.sessions.forEach(ss => {
    (ss.ex||[]).forEach(e => {
      if(!EXBY[e.key] && OLDKEY[e.key]) e.key = OLDKEY[e.key];
      if(EXBY[e.key]) e.name = EXBY[e.key].n;
      (e.sets||[]).forEach(st => { st.kg = parseFloat(st.kg)||0; st.reps = parseFloat(st.reps)||0; });
    });
    if(!ss.id) ss.id = "s" + (ss.d||"") + Math.random().toString(36).slice(2,7);
  });
  if(s.active && s.active.ex){
    const fixed = {};
    Object.keys(s.active.ex).forEach(k => { fixed[EXBY[k] ? k : (OLDKEY[k]||k)] = s.active.ex[k]; });
    s.active.ex = fixed;
  }
  /* köhnə profile.w → weights[] */
  if(!s.weights.length && d.profile && parseFloat(d.profile.w))
    s.weights.push({ d: todayISO(), kg: parseFloat(d.profile.w) });
  s.weights.sort((a,b)=> a.d < b.d ? -1 : 1);
  s.v = 3;
  return s;
}

let saveT = null;
function save(){
  state.ts = Date.now();
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ storageOK = false; }
  }, 250);
}
/* Təcili yazma — brauzer tabı bağlayanda və ya məşq bitəndə
   250 ms-lik gecikməni gözləmirik, dərhal diskə yazırıq. */
function flush(){
  clearTimeout(saveT);
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ storageOK = false; }
}
document.addEventListener("visibilitychange", () => { if(document.hidden) flush(); });
window.addEventListener("pagehide", flush);
window.addEventListener("beforeunload", flush);

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if(raw) state = migrate(JSON.parse(raw));
  } catch(e){ storageOK = false; }
}

/* ==================================================================
   2. TARİX + ZAL SAATI
   ================================================================== */
function todayISO(d){ const x = d || new Date(); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; }
function fmtD(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("az",{day:"numeric",month:"short"}); }
function daysAgo(iso){ const [y,m,d]=iso.split("-").map(Number); return Math.round((Date.now()-new Date(y,m-1,d).getTime())/864e5); }

/* Zalın divar saatı real saatdan fərqlənir — ofset dəqiqə ilə saxlanılır
   və APP-dakı bütün vaxtlar zal saatı ilə göstərilir. */
function gymNow(){ return new Date(Date.now() + (state.profile.clockOffset||0)*60000); }
function hhmm(d){ return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function tickClock(){
  const el = $("#clkT"); if(!el) return;
  el.textContent = hhmm(gymNow());
  const off = state.profile.clockOffset||0;
  $("#clkL").textContent = off ? `zal saatı (${off>0?"+":""}${off} dəq)` : "zal saatı";
}

/* ==================================================================
   3. ÇƏKİ QAYDALARI — appın ən vacib hissəsi
   ================================================================== */
function eqOf(k){ const e = EXBY[k]; return e ? e.eq : "machine"; }
function incOf(k){
  const e = EXBY[k]; if(!e) return 2.5;
  return parseFloat(state.settings.inc[e.eq]) || 2.5;
}
function loadNote(k){
  const e = EXBY[k]; if(!e) return "";
  let t = `${EQ[e.eq].n} — ${EQ[e.eq].note}`;
  if(e.unil) t += " · hər ayaq/qol üçün";
  return t;
}
function repRange(k){
  const e = EXBY[k];
  if(state.settings.useLibRange && e && e.rep) return e.rep;
  return [state.settings.repMin, state.settings.repMax];
}
function restOf(k){ const e = EXBY[k]; return e && e.rest ? e.rest : 90; }

/* Ştanq üçün disk hesabı: hər tərəfə nə qoymalı.
   "2.5 kq artırmaq" sualının cavabı budur — hər tərəfə 1.25. */
function plates(total, eq){
  const bar = eq === "ez" ? (parseFloat(state.settings.ezWeight)||10) : (parseFloat(state.settings.barWeight)||20);
  let side = (total - bar) / 2;
  if(side < 0) return { bar, side: 0, list: null, err:"Çəki ştanqdan yüngüldür" };
  const avail = (state.settings.plates||[]).slice().sort((a,b)=>b-a);
  const list = []; let rem = Math.round(side*100)/100;
  avail.forEach(p => { while(rem >= p - 1e-9){ list.push(p); rem = Math.round((rem-p)*100)/100; } });
  return { bar, side, list, err: rem > 0.01 ? `${rem} kq disklərlə yığılmır` : null };
}

/* ==================================================================
   4. PROQRESSİYA MÜHƏRRİKİ
   Keçmiş nəticə + istifadəçinin "necə keçdi" rəyi → növbəti təklif.
   ================================================================== */
function history(k){
  const out = [];
  state.sessions.forEach(s => {
    const f = (s.ex||[]).find(e => e.key === k);
    if(f && f.sets && f.sets.length) out.push({ d:s.d, sets:f.sets, feel:f.feel, note:f.note });
  });
  return out;
}
function lastOf(k){ const h = history(k); return h.length ? h[h.length-1] : null; }

/* Bir məşqin "işçi çəkisi" = ən çox təkrar edilən/ən ağır iş dövrü */
function workKg(sets){ return sets.length ? Math.max(...sets.map(s => s.kg)) : 0; }
function topReps(sets, kg){ const at = sets.filter(s => s.kg === kg); return at.length ? Math.max(...at.map(s=>s.reps)) : 0; }

function suggest(k){
  const h = history(k), [rMin, rMax] = repRange(k), inc = incOf(k), e = EXBY[k];
  if(!h.length) return { kg:null, reps:rMin, why:"first" };
  const last = h[h.length-1];
  const kg = workKg(last.sets);
  const allTop = last.sets.length >= 2 && last.sets.every(s => s.reps >= rMax);
  const anyLow = last.sets.some(s => s.reps < rMin);

  /* iki ardıcıl uğursuz məşq → həmin hərəkət üçün 10% geri çəkilmə */
  if(h.length >= 2){
    const prev = h[h.length-2];
    const failNow  = last.sets.some(s => s.reps < rMin);
    const failPrev = prev.sets.some(s => s.reps < rMin);
    if(failNow && failPrev && kg > 0)
      return { kg: roundTo(kg*0.9, inc), reps:rMin, why:"deload" };
  }
  if(e && e.eq === "bodyweight" && kg === 0){
    return allTop ? { kg:inc, reps:rMin, why:"bw-add" } : { kg:0, reps:rMax, why:"bw-hold" };
  }
  if(allTop && last.feel === "easy") return { kg: kg + inc*2, reps:rMin, why:"double" };
  if(allTop)                          return { kg: kg + inc,   reps:rMin, why:"up" };
  if(anyLow || last.feel === "hard")  return { kg, reps:rMax, why:"hold" };
  return { kg, reps:rMax, why:"grind" };
}
function roundTo(v, step){ return Math.round(v/step)*step; }

function hintText(k){
  const s = suggest(k), [rMin,rMax] = repRange(k), inc = incOf(k), last = lastOf(k);
  const prev = last ? ` Keçən dəfə: ${last.sets.map(x=>`${x.kg>0?x.kg:"BÇ"}×${x.reps}`).join(", ")} (${fmtD(last.d)}).` : "";
  switch(s.why){
    case "first":   return { cls:"", t:`İlk dəfə. ${rMax} təkrardan sonra hələ 1-2 təkrar qalacaq çəki seç — o rəqəmi yaz, qalanını mən hesablayacağam.` };
    case "up":      return { cls:"up", t:`Keçən dəfə bütün dövrlərdə ${rMax} təkrara çatdın → <b>+${inc} kq</b>. Bu gün ${s.kg} kq, hədəf ${rMin} təkrar.${prev}` };
    case "double":  return { cls:"up", t:`Keçən dəfə hamısı ${rMax} idi və "asan" qeyd etmişdin → <b>+${inc*2} kq</b>. Bu gün ${s.kg} kq.${prev}` };
    case "hold":    return { cls:"hold", t:`Çəki eyni qalır — ${s.kg} kq. Hədəf: hər dövrdə ${rMax} təkrara çatmaq, sonra çəki artır.${prev}` };
    case "deload":  return { cls:"hold", t:`İki məşq ardıcıl hədəfə çatmadın. Çəkini <b>${s.kg} kq</b>-a endir (−10%), texnikanı bərpa et, yenidən qalx.${prev}` };
    case "bw-add":  return { cls:"up", t:`Bədən çəkisi ilə hədəfə çatdın → indi <b>+${inc} kq</b> əlavə çəki götür.${prev}` };
    case "bw-hold": return { cls:"", t:`Bədən çəkisi ilə davam — çəki xanası 0 qala bilər. Hədəf ${rMax} təkrar.${prev}` };
    default:        return { cls:"", t:`${s.kg} kq ilə davam et, ${rMax} təkrara çatmağa çalış.${prev}` };
  }
}

/* ==================================================================
   5. SESSİYA
   ================================================================== */
function nextDay(){
  const order = Object.keys(state.plan);
  if(!state.sessions.length) return order[0];
  const lastDay = state.sessions[state.sessions.length-1].day;
  const i = order.indexOf(lastDay);
  return order[(i+1) % order.length];
}

function startSession(dayKey){
  if(state.active && !confirm("Davam edən məşq var. Onu ləğv edib yenisini başladım?")) return;
  const plan = state.plan[dayKey];
  const ex = {};
  plan.ex.forEach(k => {
    const s = suggest(k), [rMin,rMax] = repRange(k);
    const n = 3;
    ex[k] = Array.from({length:n}, () => ({
      kg: s.kg === null ? "" : String(s.kg),
      reps: String(s.reps || rMin),
      done: false, pre: true            /* pre = təklif olunmuş, istifadəçi toxunmayıb */
    }));
  });
  state.active = { id:"s"+Date.now(), day:dayKey, d:todayISO(), start:Date.now(), ex, notes:{} };
  save(); tab("train");
}

/* Dövr ƏSLİNDƏ qeyd olunur: təklif olunan rəqəmlər real dəyərlərdir,
   ✓ isə "bunu etdim" təsdiqidir. Boş qalan heç nə yoxdur. */
function setVal(k, i, field, v){
  const s = state.active.ex[k][i];
  s[field] = v; s.pre = false; save();
}
function tick(k, i){
  const s = state.active.ex[k][i];
  s.done = !s.done;
  if(s.done && state.settings.autoRest) startTimer(restOf(k), EXBY[k] ? EXBY[k].n : "");
  save(); renderTrain(false);
}
function addSet(k){
  const arr = state.active.ex[k], last = arr[arr.length-1];
  arr.push({ kg:last?last.kg:"", reps:last?last.reps:"", done:false, pre:true });
  save(); renderTrain();
}
function delSet(k, i){ state.active.ex[k].splice(i,1); save(); renderTrain(); }

function doneCount(){
  if(!state.active) return 0;
  return Object.values(state.active.ex).reduce((a,arr)=>a+arr.filter(s=>s.done).length, 0);
}

/* ==================================================================
   7. TAYMER
   ================================================================== */
let tLeft = 0, tInt = null;
function startTimer(sec, label){
  tLeft = sec; $("#tLabel").textContent = label ? ("İSTİRAHƏT · " + label) : "İSTİRAHƏT";
  $("#timer").classList.add("on"); drawTimer();
  clearInterval(tInt);
  tInt = setInterval(() => {
    tLeft--; drawTimer();
    if(tLeft <= 0){ clearInterval(tInt); beep(); setTimeout(timerSkip, 1200); }
  }, 1000);
}
function drawTimer(){ $("#tVal").textContent = `${Math.floor(Math.max(0,tLeft)/60)}:${String(Math.max(0,tLeft)%60).padStart(2,"0")}`; }
function timerAdd(s){ tLeft += s; drawTimer(); }
function timerSkip(){ clearInterval(tInt); $("#timer").classList.remove("on"); }
function beep(){
  try{
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    const c = new C(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 780;
    g.gain.setValueAtTime(.22, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .5);
    o.start(); o.stop(c.currentTime + .5);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}


/* ==================================================================
   8. ƏZƏLƏ HƏCMİ VƏ XƏRİTƏ
   Əsas əzələ = 1 dövr, köməkçi əzələ = 0.5 dövr (standart yanaşma).
   ================================================================== */
function volume(days){
  const cut = todayISO(new Date(Date.now() - (days-1)*864e5));
  const v = {}; Object.keys(MUSC).forEach(m => v[m] = 0);
  state.sessions.filter(s => s.d >= cut).forEach(s => {
    (s.ex||[]).forEach(e => {
      const lib = EXBY[e.key]; if(!lib) return;
      const n = (e.sets||[]).length;
      (lib.m||[]).forEach(m => { if(v[m] !== undefined) v[m] += n; });
      (lib.s||[]).forEach(m => { if(v[m] !== undefined) v[m] += n*0.5; });
    });
  });
  return v;
}
function lerp(a,b,t){
  const h = x => [parseInt(x.slice(1,3),16), parseInt(x.slice(3,5),16), parseInt(x.slice(5,7),16)];
  const A = h(a), B = h(b);
  return "#" + A.map((c,i) => Math.round(c + (B[i]-c)*t).toString(16).padStart(2,"0")).join("");
}
function muscColor(sets, key){
  const t = MUSC_TARGET[key] || [8,16];
  if(sets <= 0) return "#1a1f27";
  if(sets < t[0]) return lerp("#3a3520", "#f3b73f", sets/t[0]);
  if(sets <= t[1]) return "#3ecf8e";
  return "#ff6b6b";
}

/* ==================================================================

function lineChart(pts, color, unit){
  if(pts.length < 2) return `<div class="empty">Trend üçün ən azı 2 qeyd lazımdır</div>`;
  const W = 320, H = 110, pad = 26;
  const ys = pts.map(p=>p.y), lo = Math.min(...ys), hi = Math.max(...ys), rng = (hi-lo)||1;
  const X = i => pad + i*(W-pad-8)/(pts.length-1);
  const Y = v => H-20 - ((v-lo)/rng)*(H-34);
  const d = pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = d + `L${X(pts.length-1).toFixed(1)},${H-20} L${pad},${H-20} Z`;
  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="g${color.slice(1)}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g${color.slice(1)})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?3.6:2.2}" fill="${color}"/>`).join("")}
    <text x="2" y="14" fill="#5d6878" font-size="9">${hi}${unit}</text>
    <text x="2" y="${H-16}" fill="#5d6878" font-size="9">${lo}${unit}</text>
    <text x="${pad}" y="${H-4}" fill="#5d6878" font-size="9">${fmtD(pts[0].d)}</text>
    <text x="${W-8}" y="${H-4}" fill="#5d6878" font-size="9" text-anchor="end">${fmtD(pts[pts.length-1].d)}</text>
  </svg>`;
}
function barChart(pts, color, unit){
  if(!pts.length) return `<div class="empty">Hələ məlumat yoxdur</div>`;
  const W = 320, H = 100, n = pts.length, bw = (W-16)/n;
  const hi = Math.max(...pts.map(p=>p.y)) || 1;
  return `<svg viewBox="0 0 ${W} ${H}">
    ${pts.map((p,i)=>{
      const h = Math.max(2, (p.y/hi)*(H-30));
      return `<rect x="${(8+i*bw+bw*.15).toFixed(1)}" y="${(H-20-h).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" opacity="${i===n-1?1:.55}"/>
              <text x="${(8+i*bw+bw*.5).toFixed(1)}" y="${H-7}" fill="#5d6878" font-size="8.5" text-anchor="middle">${p.l}</text>`;
    }).join("")}
    <text x="2" y="12" fill="#5d6878" font-size="9">${Math.round(hi)}${unit}</text>
  </svg>`;
}

function weekSessions(){ const cut = todayISO(new Date(Date.now()-6*864e5)); return state.sessions.filter(s=>s.d>=cut).length; }
function streak(){
  let n = 0; const seen = new Set(state.sessions.map(s=>s.d));
  for(let i=0;i<400;i++){
    const d = todayISO(new Date(Date.now()-i*864e5));
    if(seen.has(d)) n++;
    else if(i > 0 && n > 0 && i - n > 3) break;
  }
  return n;
}
function latestW(){ return state.weights.length ? state.weights[state.weights.length-1].kg : null; }

function renderToday(){
  const box = $("#v-today");
  if(!state.profile.h){ box.innerHTML = setupCard(); return; }

  /* bitirilməmiş sessiya bərpası */
  let recover = "";

      </div></div>`;
  }

  const nd = state.active ? state.active.day : nextDay();
  const plan = state.plan[nd];
  const vol = volume(7);
  const weak = Object.keys(MUSC_TARGET)
    .filter(m => (MUSC_TARGET[m][0] > 0) && (vol[m]||0) < MUSC_TARGET[m][0]*0.5)

    if(s.why === "first")
      return { ic:"◆", t:`<b>${e.n}</b> — ilk dəfə, çəkini özün seç` };
    return null;
  }).filter(Boolean).slice(0,4);

  const bw = latestW(), bwPrev = state.weights.length>1 ? state.weights[state.weights.length-2].kg : null;

    <div class="small">${plan.ex.length} hərəkət · ~${Math.round(est/60)} dəq · zal saatı ilə bitiş ≈ <b class="acc">${hhmm(endT)}</b></div>
    ${focus.length ? `<ul class="focus">${focus.map(f=>`<li><span class="ic acc">${f.ic}</span><span>${f.t}</span></li>`).join("")}</ul>` : ""}
    ${weak.length ? `<ul class="focus"><li><span class="ic">!</span><span>Bu həftə geridə: <b>${weak.map(m=>MUSC[m].n).join(", ")}</b></span></li></ul>` : ""}
    <button class="btn" style="margin-top:14px" onclick="${state.active ? "tab('train')" : `startSession('${nd}')`}">
      ${state.active ? "Məşqə qayıt" : "Başla"}</button>
  </div>

  <div class="statgrid">
    <div class="stat"><div class="v num">${weekSessions()}<small> / ${state.profile.weeklyTarget}</small></div><div class="l">Son 7 gün</div></div>
    <div class="stat"><div class="v num">${state.sessions.length}</div><div class="l">Ümumi məşq</div></div>
    <div class="stat"><div class="v num">${bw ? bw : "—"}${bw?'<small> kq</small>':''}</div>
      <div class="l">${dw !== null ? (dw>0?"▲ ":"▼ ")+Math.abs(dw).toFixed(1)+" kq" : "Çəki"}</div></div>
  </div>

  <div class="sect">Başqa gün seç</div>
  <div class="row wrap">
    ${Object.keys(state.plan).map(d=>`<button class="mini" onclick="startSession('${d}')">${esc(state.plan[d].name)}</button>`).join("")}
  </div>

  <div class="sect">Çəkini qeyd et</div>
  <div class="card tight"><div class="row">
    <input class="srch" style="margin:0;flex:1" id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="${bw||"kq"}">
    <button class="btn sm" style="width:auto;padding:12px 18px" onclick="addWeight()">Yaz</button>

}

function tick(k,i){
  const s = state.active.ex[k][i];
  s.done = !s.done;
  const row = document.getElementById(`row-${k}-${i}`), chk = document.getElementById(`chk-${k}-${i}`);
  if(row) row.classList.toggle("done", s.done);
  if(chk) chk.classList.toggle("done", s.done);
  const card = document.getElementById(`card-${k}`);
  if(card) card.classList.toggle("done", state.active.ex[k].every(x=>x.done));
  const c = document.getElementById("dcnt"); if(c) c.textContent = doneCount();
  if(s.done && state.settings.autoRest) startTimer(restOf(k), EXBY[k] ? EXBY[k].n : "");
  save();
}

function countable(s){ return s.done || (!s.pre && parseFloat(s.reps) > 0); }

function openFinish(){
  const a = state.active; if(!a) return;
  const body = Object.keys(a.ex).map(k => {
    const e = EXBY[k], sets = a.ex[k], keep = sets.filter(countable);
    const feel = (a.notes[k]||{}).feel || "";
    return `<div class="card tight" style="margin-bottom:9px">
      <div class="spread"><b style="font-size:14px">${esc(e.n)}</b>
        <span class="pill ${keep.length?"g":"b"}">${keep.length}/${sets.length} dövr</span></div>
      <div class="small" style="margin:6px 0 9px">${keep.length
        ? keep.map(s=>`${parseFloat(s.kg)||0}×${parseFloat(s.reps)||0}`).join("  ·  ")
        : `<span class="bad">İşarələnməyib — saxlanılmayacaq</span>`}</div>
      ${keep.length ? `<div class="row" style="gap:6px">
        <span class="tiny" style="width:62px">Necə keçdi?</span>
        ${["easy","ok","hard"].map(f=>`<button class="pill ${feel===f?"on":""}" onclick="setFeel('${k}','${f}')">${({easy:"Asan",ok:"Normal",hard:"Çətin"})[f]}</button>`).join("")}
      </div>` : `<button class="btn sm ghost" onclick="confirmAll('${k}')">Təklif olunan kimi saxla</button>`}
    </div>`;
  }).join("");

  openSheet("Məşqi bitir", `
    <div class="small" style="margin-bottom:12px">Rəyin növbəti məşqin çəki təklifinə birbaşa təsir edir: <b>Asan</b> → iki addım artım, <b>Çətin</b> → çəki saxlanılır.</div>
    ${body}
    <div class="field" style="margin-top:12px"><label>Qeyd (istəyə bağlı)</label>
      <textarea id="fNote" placeholder="Məs: sağ çiyin narahat idi, bench-i yüngül saxladım">${esc(a.note||"")}</textarea></div>
    <button class="btn ghost sm" style="margin-bottom:9px" onclick="confirmAllAll()">Bütün dövrləri təsdiqlə</button>
    <button class="btn" onclick="finishSession()">Saxla və bitir</button>`);
}
function setFeel(k,f){
  state.active.notes[k] = {...(state.active.notes[k]||{}), feel:f};
  save(); openFinish();
}
function confirmAll(k){ state.active.ex[k].forEach(s=>{ s.done = true; }); save(); openFinish(); }
function confirmAllAll(){ Object.keys(state.active.ex).forEach(k=>state.active.ex[k].forEach(s=>{s.done=true;})); save(); openFinish(); }

function finishSession(){
  const a = state.active;
  const noteEl = $("#fNote"); if(noteEl) a.note = noteEl.value;
  const rec = { id:a.id, d:a.d, day:a.day, ts:Date.now(), dur:Math.round((Date.now()-a.start)/60000), ex:[], note:a.note||"" };
  Object.keys(a.ex).forEach(k => {
    const keep = a.ex[k].filter(countable)
      .map(s => ({ kg: parseFloat(s.kg)||0, reps: parseFloat(s.reps)||0 }))
      .filter(s => s.reps > 0);
    if(keep.length) rec.ex.push({ key:k, name:EXBY[k]?EXBY[k].n:k, sets:keep, feel:(a.notes[k]||{}).feel||"" });
  });
  if(!rec.ex.length){ toast("Heç bir dövr işarələnməyib"); return; }
  const totalSets = rec.ex.reduce((x,e)=>x+e.sets.length,0);
  state.sessions.push(rec);
  state.sessions.sort((x,y)=> x.d<y.d?-1:1);
  state.active = null; save(); flush(); closeSheet(); timerSkip();
  toast(`Saxlanıldı — ${totalSets} dövr`);
  tab("today");
}

function renderProg(){
  const box = $("#v-prog");
  if(!state.sessions.length){
    box.innerHTML = `<div class="card"><div class="empty">Hələ məşq qeydi yoxdur.<br>Bir məşq bitirdikdən sonra burada trendlər görünəcək.</div></div>`;
    return;
  }
  const vol = volume(7);
  const muscles = Object.keys(MUSC).filter(m => (MUSC_TARGET[m]||[0,0])[1] > 0)
    .sort((a,b)=>(vol[b]||0)-(vol[a]||0));

  /* həftəlik dövr sayı — son 8 həftə */
  const wk = [];
  for(let i=7;i>=0;i--){
    const end = new Date(Date.now()-i*7*864e5), start = new Date(end.getTime()-6*864e5);
    const a = todayISO(start), b = todayISO(end);
    const sets = state.sessions.filter(s=>s.d>=a&&s.d<=b)
      .reduce((x,s)=>x+(s.ex||[]).reduce((y,e)=>y+e.sets.length,0),0);
    wk.push({ l:i===0?"bu":`-${i}`, y:sets });
  }

  /* güc cədvəli */
  const keys = [...new Set(state.sessions.flatMap(s=>(s.ex||[]).map(e=>e.key)))].filter(k=>EXBY[k]);
  const rows = keys.map(k => {
    const h = history(k); if(h.length < 2) return null;
    const now = workKg(h[h.length-1].sets);
    const monthAgo = h.filter(x => daysAgo(x.d) >= 28);
    const then = monthAgo.length ? workKg(monthAgo[monthAgo.length-1].sets) : workKg(h[0].sets);
    const diff = now - then;
    const stall = h.length >= 3 && h.slice(-3).every(x => workKg(x.sets) === now);
    return { k, n:EXBY[k].n, now, diff, stall, n2:h.length };
  }).filter(Boolean).sort((a,b)=>b.diff-a.diff);

  /* rekordlar */
  const prs = keys.map(k => {
    const h = history(k); let best = null;
    h.forEach(x => x.sets.forEach(s => {
      const e1 = s.kg > 0 ? s.kg*(1+s.reps/30) : s.reps;
      if(!best || e1 > best.e1) best = { e1, kg:s.kg, reps:s.reps, d:x.d };
    }));
    return best ? { n:EXBY[k].n, ...best } : null;
  }).filter(Boolean).sort((a,b)=>b.e1-a.e1).slice(0,6);

  const wpts = state.weights.slice(-20).map(w=>({d:w.d, y:w.kg}));

  box.innerHTML = `
  <div class="sect">Bu həftə</div>
  <div class="statgrid">
    <div class="stat"><div class="v num">${weekSessions()}</div><div class="l">Məşq</div></div>
    <div class="stat"><div class="v num">${Math.round(Object.values(vol).reduce((a,b)=>a+b,0))}</div><div class="l">Dövr (çəkili)</div></div>
    <div class="stat"><div class="v num">${state.sessions.slice(-1)[0].dur||"—"}<small> dəq</small></div><div class="l">Son məşq</div></div>
  </div>

  <div class="sect">Əzələ yükü · son 7 gün</div>
  <div class="card">
    <div class="bodywrap">
      <div><div>${bodySVG("front", vol)}</div><div class="bodylab">Ön</div></div>
      <div><div>${bodySVG("back", vol)}</div><div class="bodylab">Arxa</div></div>

let libQ = "", libM = "";
function renderLib(){
  const box = $("#v-lib");
  const groups = [...new Set(LIB.flatMap(e=>e.m))];
  const list = LIB.filter(e => {
    const q = libQ.toLowerCase();
    const okQ = !q || e.n.toLowerCase().includes(q) || e.en.toLowerCase().includes(q);
    const okM = !libM || (e.m||[]).includes(libM) || (e.s||[]).includes(libM);
    return okQ && okM;
  });
  box.innerHTML = `
    <input class="srch" id="libQ" placeholder="Hərəkət axtar (${LIB.length} hərəkət)" value="${esc(libQ)}"
      oninput="libQ=this.value;renderLibList()">
    <div class="row wrap" style="margin-bottom:12px">
      <button class="pill ${libM===""?"on":""}" onclick="libM='';renderLib()">Hamısı</button>
      ${groups.map(m=>`<button class="pill ${libM===m?"on":""}" onclick="libM='${m}';renderLib()">${MUSC[m].n}</button>`).join("")}
    </div>
    <div id="libList">${libList(list)}</div>`;
  const inp = $("#libQ"); if(inp && libQ){ inp.focus(); inp.setSelectionRange(libQ.length, libQ.length); }

function libList(list){
  if(!list.length) return `<div class="empty">Tapılmadı</div>`;

    <div style="min-width:0"><div class="nm">${esc(e.n)}</div>

    <div class="go">›</div></div>`).join("");
}
function renderLibList(){
  const q = libQ.toLowerCase();
  const list = LIB.filter(e => {
    const okQ = !q || e.n.toLowerCase().includes(q) || e.en.toLowerCase().includes(q);

}

function doSwap(from,to){
  const a = state.active; if(!a) return;
  const rebuilt = {};
  Object.keys(a.ex).forEach(k => {
    if(k === from){
      const s = suggest(to), [rMin] = repRange(to);
      rebuilt[to] = a.ex[from].map(() => ({ kg:s.kg===null?"":String(s.kg), reps:String(s.reps||rMin), done:false, pre:true }));
    } else rebuilt[k] = a.ex[k];
  });
  a.ex = rebuilt; save(); closeSheet(); renderTrain();
}

  state.profile.clockOffset = diff; save(); closeSheet(); tickClock();
  toast(`Fərq ${diff>0?"+":""}${diff} dəqiqə`);

   19. İXRAC / İDXAL
   ================================================================== */
function exportData(){
  try{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `forge-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    toast("Fayl yükləndi");
  }catch(e){ toast("İxrac alınmadı"); }
}
function importData(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try{ d = JSON.parse(r.result); }catch(e){ toast("Fayl oxunmadı"); return; }
    if(!d || !Array.isArray(d.sessions)){ toast("FORGE faylı deyil"); return; }
    if(!confirm(`${d.sessions.length} məşq qeydi idxal olunacaq. Mövcud qeydlərlə birləşdirilsin?`)) return;
    const inc = migrate(d);
    const seen = new Set(state.sessions.map(s=>s.d+"|"+s.day));
    inc.sessions.forEach(s => { if(!seen.has(s.d+"|"+s.day)) state.sessions.push(s); });
    const wd = new Set(state.weights.map(w=>w.d));
    inc.weights.forEach(w => { if(!wd.has(w.d)) state.weights.push(w); });
    state.sessions.sort((a,b)=>a.d<b.d?-1:1);
    state.weights.sort((a,b)=>a.d<b.d?-1:1);
    save(); closeSheet(); refresh(); toast(`Birləşdirildi — ${state.sessions.length} məşq`);
    input.value = "";
  };
  r.readAsText(f);
}
function wipe(){
  if(!confirm("BÜTÜN məşq tarixçəsi silinəcək. Bu geri qaytarıla bilməz. Davam?")) return;
  if(!confirm("Əminsən? Əvvəlcə İxrac etməyi tövsiyə edirəm.")) return;
  state = JSON.parse(JSON.stringify(DEF)); save(); closeSheet(); tab("today");
}

load();
tickClock(); setInterval(tickClock, 20000);
renderToday();
if(!storageOK){
  const w = document.createElement("div");
  w.className = "warn err"; w.style.margin = "12px 16px";
  w.textContent = "Bu brauzerdə yaddaş bağlıdır — qeydlər saxlanılmayacaq. Gizli rejimdən çıx.";
  document.querySelector("main").prepend(w);
}
if("serviceWorker" in navigator)
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));

</script>
