}
function selDay(k){ if(state.active && state.active.day!==k){ toast("Əvvəlcə cari məşqi bitirin və ya ləğv edin"); return; } viewDay=k; renderTrain(); }
function startSession(day){
  const foundation = isFirstEver();
  const exState = {};
  PROGRAM[day].ex.forEach(ex=>{
    const sug = suggestKg(ex.key);
    const setCount = foundation ? Math.max(2, Math.round(ex.sets/2)) : ex.sets;
    exState[ex.key] = Array.from({length:setCount},()=>({ kg: sug ?? "", reps:"", done:false }));
  });
  /* startedAt: saat “Başla”dan işə düşür. Zala gec açmısınızsa Məşq səhifəsindəki
     saat çipindən geriyə sürüşdürün — openClockFix(). */
  state.active = { day, started: todayISO(), startedAt: Date.now(), warmDone: false, ex: exState, foundation };
  viewDay = day; save(); switchTab("train");
  toast(foundation ? "Təməl məşqi başladı — yüngül saxlayın." : `${PROGRAM[day].name} başladı · saat işə düşdü.`);
}
function setVal(key,i,f,v){ state.active.ex[key][i][f] = v; save(); }
function smartKg(key,i){
  const st = state.active.ex[key];
  for(let j=i-1;j>=0;j--){ const v=parseFloat(st[j].kg); if(v) return v; }
  const p = lastPerf(effEx(key).key);
  if(p) return p.sets[i]?.kg ?? p.sets[p.sets.length-1].kg;
  return null;
}
function smartReps(key,i){
  const st = state.active.ex[key];
  for(let j=i-1;j>=0;j--){ const v=parseFloat(st[j].reps); if(v) return v; }
  return EXMAP[key].rMax;
}
function stepVal(key,i,f,dir){
  const s = state.active.ex[key][i];
  const step = f==="kg" ? (EXMAP[key].inc || 2.5) : 1;
  let v = parseFloat(s[f]);
  if(!v){ v = f==="kg" ? (smartKg(key,i) ?? step) : smartReps(key,i); } /* first tap = accept suggestion */
  else v += dir*step;
  v = Math.max(0, Math.round(v*10)/10);
  s[f] = String(v);
  const inp = document.getElementById(`in-${key}-${i}-${f}`);
  if(inp) inp.value = v;
  save();
}
/* Taymerdən asılı olmamaq üçün: hər dövrdən sonra növbəti dövrün DƏQİQ saatı
   yazılır (zal saatı fərqi tətbiq olunmuş). Sonuncu dövrdən sonra istirahət
   göstərilmir — növbəti hərəkətə keçilir. */
function restLineHTML(key){
  const a = state.active; if(!a || !a.ex[key]) return "";
  const sets = a.ex[key], eff = effEx(key);
  let last = -1;
  sets.forEach((s,i)=>{ if(s.done && s.t) last = i; });
  if(last < 0) return "";
  if(last === sets.length-1)
    return `<div class="restline done">Bu hərəkət bitdi — istirahət etmədən növbəti hərəkətə keç.</div>`;
  const at = sets[last].t + eff.rest*1000;
  const over = Date.now() > at;
  return `<div class="restline ${over?"over":""}">İstirahət <b>${Math.round(eff.rest/60*10)/10} dəq</b> — `
    + `növbəti dövr:<br><b class="at">${fmtClock(at, false, true)}</b> <span class="atn">zal saatı ilə</span>${over?" · vaxt gəlib":""}</div>`;
}
function toggleDone(key,i){
  const s = state.active.ex[key][i]; s.done = !s.done;
  if(s.done){
    s.t = Date.now();   /* real vaxt bu nöqtələrdən hesablanır — sessionMinutes() */
    /* ✓ = "bu dövrü göstərildiyi kimi etdim". Boz rəqəm yalnız təklifdir; onu
       həqiqi dəyərə çevirməsək, dövr yadda saxlanarkən atılırdı və növbəti məşqdə
       hərəkət "ilk dəfə" kimi görünürdü. Fərqli olubsa xananı əl ilə düzəldirsən. */
    if(!parseFloat(s.kg)){ const k = smartKg(key,i); if(k > 0) s.kg = String(k); }
    if(!(parseFloat(s.reps) > 0)){ const r = smartReps(key,i); if(r > 0) s.reps = String(r); }
    const inp = document.getElementById(`in-${key}-${i}-kg`), inr = document.getElementById(`in-${key}-${i}-reps`);
    if(inp) inp.value = s.kg;
    if(inr) inr.value = s.reps;
    /* qızışmanı bitdi kimi işarələməyi unutmaq adi haldır: iş dövrünə başladınsa
       qızışma onsuz da bitib */
    if(!state.active.warmDone){ state.active.warmDone = true; redrawWarm(); }
    /* sonuncu dövrdən sonra istirahət yoxdur — növbəti hərəkətə keçilir */
    if(i < state.active.ex[key].length - 1) startTimer(EXMAP[key].rest, effEx(key).name);
    else toast("Hərəkət bitdi — növbəti hərəkətə keç");
  }
  save();
  /* Task 9.1: full renderTrain() here rebuilt the whole view, collapsing the open
     rules <details> and dropping input focus mid-workout. Only the tick changes. */
  const btn = document.getElementById(`ck-${key}-${i}`);
  const rl = document.getElementById(`rl-${key}`);
  if(rl) rl.innerHTML = restLineHTML(key);
  if(btn) btn.classList.toggle("done", s.done); else renderTrain();
}
/* qeyd qurma ayrıca: həm “Bitir” düyməsi, həm avtomatik bağlama eyni məntiqi işlədir */
function buildRecord(a){
  /* d: məşqin BAŞLADIĞI gün — gecə yarısını keçən məşq dünənə yazılsın deyə */
  const startISO = a.startedAt ? isoOf(new Date(a.startedAt)) : (a.started || todayISO());
  const rec = { d: startISO, day: a.day, ex: [], foundation: !!a.foundation, min: sessionMinutes(a, staleHours() ? 0 : TAIL_CAP) };
  let n = 0, skipped = 0;
  PROGRAM[a.day].ex.forEach(ex=>{
    const eff = effEx(ex.key);
    const raw = a.ex[ex.key];
    /* a ticked set with no reps cannot be scored — count it so we can say so out loud */
    skipped += raw.filter(s=>s.done && !(parseFloat(s.reps)>0)).length;
    /* reps is the only requirement: kg 0 is legitimate (Back Extension, Assisted Pull-Up,
       Hanging Knee Raise, Decline Sit-Up, Band Pull-Apart all start unloaded) */
    const sets = raw.filter(s=>parseFloat(s.reps)>0)
      .map(s=>({kg:parseFloat(s.kg)||0, reps:parseFloat(s.reps)}));
    if(sets.length){ rec.ex.push({key:eff.key, name:eff.name, sets}); n += sets.length; }
  });
  return { rec, n, skipped };
}
function finishSession(){
  const a = state.active; if(!a) return;
  const { rec, n, skipped } = buildRecord(a);
  if(!n){
    info("Təkrar sayı yazılmayıb",
      "Məşqi yadda saxlamaq üçün ən azı bir dövrün TƏKRAR xanası dolu olmalıdır — tək ✓ işarəsi kifayət etmir, çünki proqressiya təkrar sayına baxır.\n\nÇəki xanası boş qala bilər (bədən çəkisi ilə edilən hərəkətlərdə normaldır).");
    return;
  }
  const warn = skipped ? `<div class="hint" style="margin-top:10px">Diqqət: işarələnmiş ${skipped} dövr təkrar sayı boş olduğu üçün qeyd edilməyəcək.</div>` : "";
  const dur = rec.min!=null ? ` · <b>${hm(rec.min)}</b>` : "";
  const prev = lastNote(a.day);
  $("#sheet").innerHTML = `${SHEETHEAD}
    <h3>${PROGRAM[a.day].name} yadda saxlanılsın?</h3>
    <div class="stag">${n} dövr${dur}</div>

    ${prev ? `<div class="small" style="margin-top:10px">Keçən dəfəki qeydin: <i>“${esc(prev)}”</i></div>` : ""}
    <div class="field" style="margin-top:12px"><label>Bu məşq üçün qeyd (istəyə bağlı)</label>
      <textarea id="fin-note" rows="3" placeholder="məs. bench çətin gəldi, çiyin ağrıdı — növbəti dəfə çəkini saxla"></textarea></div>
    <button class="btn block" onclick="saveWithNote()">Bəli, yadda saxla</button>
    <button class="btn block ghost" style="margin-top:8px" onclick="closeSheet()">İmtina</button>`;
  pendingRec = rec;
  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
}
let pendingRec = null;
function saveWithNote(){
  const rec = pendingRec; if(!rec) return;

/* həmin gün tipi üçün sonuncu qeyd — növbəti dəfə göz önünə çıxarılır */
function lastNote(day){
  for(let i=state.sessions.length-1;i>=0;i--){

/* “Bitir”i unutmaq daha məlumat itirmir: 3 saatdan çox toxunulmayan məşq

  } else {
    state.active = null; save();
    migrationNote = "Yarımçıq qalmış məşq bağlandı — heç bir dövr qeyd edilmədiyi üçün tarixçəyə yazılmadı.";

/* ================= rest timer =================
   Saat DİVAR VAXTINA bağlıdır (tEnd), saymağa yox: brauzer fon rejimində
   setInterval-i dayandırır və köhnə variantda taymer qaldığı yerdən davam edirdi.
   İndi qayıdanda real qalan vaxt göstərilir, vaxt keçibsə bitmiş sayılır.
   Vaxt state.active.rest-də saxlanılır — səhifə yenilənsə də davam edir. */
let tInt=null, tEnd=0, tTotal=0;
const RING_C = 565.5; // 2*pi*90, matches the SVG circle radius
function tLeftNow(){ return Math.max(0, Math.ceil((tEnd - Date.now())/1000)); }
function startTimer(sec,label){
  clearInterval(tInt);
  tTotal = sec; tEnd = Date.now() + sec*1000;
  if(state.active){ state.active.rest = { end:tEnd, total:sec, label }; save(); }
  if(state.profile.noTimer) return;          /* ekran taymeri söndürülüb — yalnız saat */
  const el=$("#timer"); el.classList.add("on"); el.classList.remove("done");
  $("#timerLab").textContent = String(label||"").toUpperCase();
  $("#timerStart").textContent = "Başla: " + fmtClock(tEnd, false, true);
  tickRender();
  acquireWakeLock();
  tInt = setInterval(tick,1000);
}
function tick(){
  tickRender();
  if(tLeftNow()<=0){
    clearInterval(tInt); tInt=null; $("#timer").classList.add("done"); beep();
    try{navigator.vibrate && navigator.vibrate([160,90,160]);}catch(e){}
    releaseWakeLock();
    setTimeout(()=>{ if(tLeftNow()<=0) $("#timer").classList.remove("on"); },1900);
  }
}
function tickRender(){
  const left = tLeftNow();
  const m=Math.floor(left/60), s=left%60;
  $("#timerDigits").textContent = m+":"+String(s).padStart(2,"0");
  const frac = tTotal>0 ? Math.min(1,Math.max(0,left/tTotal)) : 0;
  $("#timerRing").setAttribute("stroke-dashoffset", (RING_C*(1-frac)).toFixed(1));
}
function timerAdd(){
  tEnd = Math.max(tEnd, Date.now()) + 30000;
  tTotal = Math.max(tTotal, Math.ceil((tEnd-Date.now())/1000));
  if(state.active && state.active.rest) { state.active.rest.end = tEnd; save(); }
  $("#timer").classList.remove("done");
  $("#timerStart").textContent = "Başla: " + fmtClock(tEnd, false, true);
  if(!tInt){ $("#timer").classList.add("on"); acquireWakeLock(); tInt=setInterval(tick,1000); }
  tickRender();
}
function timerSkip(){ clearInterval(tInt); tInt=null; tEnd=0; tTotal=0; $("#timer").classList.remove("on"); releaseWakeLock(); if(state.active) delete state.active.rest; }
/* səhifə yenidən açılanda davam edən istirahəti bərpa et */
function resumeTimer(){
  const r = state.active && state.active.rest;
  if(!r || !r.end) return;
  const left = Math.round((r.end - Date.now())/1000);
  if(left <= 0){ if(state.active) delete state.active.rest; return; }
  tTotal = r.total || left; tEnd = r.end;
  if(state.profile.noTimer) return;
  const el=$("#timer"); el.classList.add("on"); el.classList.remove("done");
  $("#timerLab").textContent = String(r.label||"").toUpperCase();
  $("#timerStart").textContent = "Başla: " + fmtClock(tEnd, false, true);
  tickRender(); acquireWakeLock(); tInt = setInterval(tick,1000);
}

/* ---- keep the screen awake while resting (iOS 16.4+ Safari) ---- */
let wakeLock = null;
async function acquireWakeLock(){
  try{ if("wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); } }catch(e){}
}
function releaseWakeLock(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible") return;
  if(tInt){ acquireWakeLock(); tickRender(); if(tLeftNow()<=0) tick(); }   /* fonda keçən vaxt nəzərə alınır */
  const el = document.querySelector(".clock"); if(el) el.outerHTML = clockChip();
});
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="square"; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.16);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.18);
    });
  }catch(e){}
}

/* ================= PROGRESS ================= */
function chartSVG(pts,color,unit){
  if(!pts.length) return `<div class="empty">Hələ heç nə qeyd edilməyib — məlumat burada özü çəkilir.</div>`;
  const W=340,H=150,L=8,R=14,T=18,B=22;
  const ys = pts.map(p=>p.y);
  let mn=Math.min(...ys), mx=Math.max(...ys);
  if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  const X=i=> L + (W-L-R) * (pts.length===1 ? 0.5 : i/(pts.length-1));
  const Y=v=> T + (H-T-B) * (1-(v-mn)/(mx-mn));
  const path = pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const dots = pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?color:"#171b21"}" stroke="${color}" stroke-width="2"/>`).join("");
  const lastX=X(pts.length-1), lastY=Y(pts[pts.length-1].y);
  const anchor = lastX > W-64 ? "end" : "middle";
  const grid = [0.25,0.5,0.75].map(f=>`<line x1="${L}" x2="${W-R}" y1="${(T+(H-T-B)*f).toFixed(1)}" y2="${(T+(H-T-B)*f).toFixed(1)}" stroke="#232933" stroke-width="1"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${grid}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${lastX}" y="${Math.max(lastY-11,12)}" text-anchor="${anchor}" font-size="12.5" font-weight="700" fill="${color}" font-family="var(--mono)">${pts[pts.length-1].y}${unit}</text>
    <text x="${L}" y="${H-4}" font-size="10" fill="#6b7480">${fmtD(pts[0].d)}</text>
    <text x="${W-R}" y="${H-4}" text-anchor="end" font-size="10" fill="#6b7480">${fmtD(pts[pts.length-1].d)}</text>
  </svg>`;
}
function renderProg(){

    const loaded = rows.some(r=>r.sets.some(st=>st.kg>0));

        r.sets.forEach(st=>{ if(!(st.kg>0)) return; /* a 0 kg set would flatten the 1RM line */
          const v=e1rm(st.kg,st.reps); if(!best||v>best.v) best={v,kg:st.kg,reps:st.reps}; });
        if(best){ pts.push({d:r.d, y:Math.round(best.v)}); if(!pr||best.v>pr.v) pr={...best,d:r.d}; }

    } else {
      /* unloaded lift: 1RM is meaningless, total reps per session is the real progression */
      const pts = rows.map(r=>({ d:r.d, y:r.sets.reduce((a,st)=>a+st.reps,0) }));
      const best = pts.reduce((m,p)=>(!m||p.y>m.y)?p:m, null);

  const hist = state.sessions.length ? state.sessions.slice().reverse().map((s,ri)=>{
    const i = state.sessions.length-1-ri;

      ${s.note ? `<div class="histnote">“${esc(s.note)}”</div>` : ""}
      ${s.ex.map(e=>`<div class="histset"><b>${esc(e.name)}</b> — <span class="num">${perfStr(e)}</span></div>`).join("")}
      <button class="btn sm danger" style="margin:8px 0 10px" onclick="delSession(${i})">Məşqi sil</button>
    </details>`;
  }).join("") : `<div class="empty">Hələ məşq yoxdur. Məşq etdikcə tarixçə özü yazılacaq.</div>`;

  /* ---- ümumi göstəricilər ---- */
  const real = state.sessions.filter(s=>!s.foundation);
  const mins = real.filter(s=>s.min!=null);
  const avgMin = mins.length ? Math.round(mins.reduce((a,s)=>a+s.min,0)/mins.length) : null;
  const monthISO = todayISO().slice(0,7);
  const thisMonth = state.sessions.filter(s=>s.d.slice(0,7)===monthISO).length;
  const totTon = Math.round(state.sessions.reduce((a,s)=>a+tonnage(s),0));
  const vol = loggedVolume(14);
  const volRows = Object.keys(MUSN).map(m=>({m, v:vol[m]||0})).sort((a,b)=>b.v-a.v);
  const volMax = Math.max(10, ...volRows.map(r=>r.v));

  /* ---- rekord lenti: hər hərəkət üzrə ən yaxşı dövr nə vaxt qırılıb ---- */
  const prs = [];
  const best = {};
  state.sessions.forEach(s=>s.ex.forEach(e=>{
    e.sets.forEach(st=>{
      if(!(st.kg>0)) return;
      const v = e1rm(st.kg, st.reps);
      if(!best[e.key] || v > best[e.key].v + 0.01){
        best[e.key] = {v, kg:st.kg, reps:st.reps, d:s.d, name:e.name};
        prs.push({...best[e.key], key:e.key});
      }
    });
  }));
  const recentPR = prs.slice(-6).reverse();

  $("#view-prog").innerHTML = `
    <div class="stats">
      <div class="stat"><div class="v num">${real.length}</div><div class="l">Məşq</div></div>
      <div class="stat"><div class="v num">${thisMonth}</div><div class="l">Bu ay</div></div>
      <div class="stat"><div class="v num">${avgMin!=null?avgMin:"—"}<small> dəq</small></div><div class="l">Orta müddət</div></div>
    </div>
    <div class="card tight"><div class="kcalrow"><span>Ümumi qaldırılan yük</span><span><b class="num">${totTon.toLocaleString()}</b> kq</span></div></div>

    <div class="sect">Son 14 gün · əzələ yükü</div>
    <div class="card">
      ${state.sessions.length ? `<div class="mlist">${volRows.map(r=>`<div class="mrowv ${r.v?"":"zero"}">
        <span class="mn">${MUSN[r.m]}</span>
        <span class="mb"><i style="width:${Math.round(r.v/volMax*100)}%"></i></span>
        <span class="mv num">${r.v ? Math.round(r.v*10)/10 : "—"}</span>
      </div>`).join("")}</div>
      <div class="small" style="margin-top:10px">Həqiqətən qeyd etdiyin dövrlərdən hesablanıb (plandan yox). 2 həftədə əzələ başına <b style="color:var(--ink)">14-30 dövr</b> yaxşı aralıqdır — boş qalanlara hərəkət əlavə et.</div>`
      : `<div class="empty">İlk məşqini bitir, burada hansı əzələni nə qədər işlətdiyin görünəcək.</div>`}
    </div>

    <div class="sect">Rekordlar</div>
    <div class="card">
      ${recentPR.length ? recentPR.map(p=>`<div class="prrow">
        <span class="pn">${esc(p.name)}</span>
        <span class="pv num">${p.kg} kq × ${p.reps}</span>
        <span class="pd">${fmtD(p.d)}</span>
      </div>`).join("") : `<div class="empty">Hələ rekord yoxdur.</div>`}
    </div>

    <div class="sect">Bədən çəkisi</div>
    <div class="card">
      <div class="chartbox">${chartSVG(wPts,"#4a7dff"," kq")}</div>
      <div class="inline-log" style="margin-top:10px">
        <input id="pw" type="number" inputmode="decimal" step="0.1" placeholder="Bugünkü çəkini qeyd et (kq)">
        <button class="btn sm" onclick="addWeight('pw')">Qeyd et</button>
      </div>
      ${state.weights.length?`<div class="loglist">${state.weights.slice(-6).reverse().map(x=>{
        const idx = state.weights.indexOf(x);
        return `<div class="logrow"><span class="num"><b>${x.kg} kq</b></span><span class="d">${fmtD(x.d)}</span><button class="xdel" onclick="delWeight(${idx})">✕</button></div>`;

    </div>

    <details class="rules"><summary>Hərəkət üzrə güc qrafiki</summary><div class="inner">
      <div style="padding-top:10px">${liftBlock}</div>
    </div></details>

    <div class="sect">Tarixçə</div>
    <div class="card">${hist}</div>`;
}

    <div class="sect">Günü seçin</div>
    <div class="dayrow">${days}</div>

    ${locked ? `<div class="warnnote">Bu gün üzrə məşq davam edir — dəyişiklik etmək üçün əvvəlcə məşqi bitirin və ya ləğv edin.</div>` : ""}

    <div class="sect">${meta.name} · ${slots.length} hərəkət · ~${dayMinutes(D)} dəq</div>
    <div class="card">
      ${rows || `<div class="empty">Bu gün boşdur — aşağıdan hərəkət əlavə edin.</div>`}
      <button class="btn block ghost" style="margin-top:12px" onclick="openLibPick('${D}',null)">＋ Hərəkət əlavə et</button>
      ${custom ? `<button class="btn block danger" style="margin-top:10px" onclick="planReset('${D}')">↺ Standart plana qaytar</button>` : ""}
      <div class="small" style="margin-top:10px">Sıra vacibdir: ağır çox oynaqlı hərəkətlər əvvəldə, izolyasiya sonda. ⚙ düyməsi ilə dövr, təkrar diapazonu və istirahəti dəyişin.</div>
    </div>

    <div class="sect">Hansı əzələ nə qədər işləyir</div>
    ${volumeCard(D)}

    <div class="sect">Mənim hərəkətlərim</div>
    <div class="card">
      ${mine.length ? mine.map(k=>{
        const e = mkEx(defSlot(k), null);
        return `<div class="planrow">
          ${exImg(e,"exanim sm still")}
          <div class="ptxt"><b>${esc(e.name)}</b><small>${e.sets} × ${e.rMin}-${e.rMax} · ${esc(e.tag||"")}</small></div>
          <div class="pbtns">
            <button onclick="openCustom('${k}')" aria-label="düzəliş">⚙</button>
            <button class="del" onclick="delCustom('${k}')" aria-label="sil">✕</button>
          </div>
        </div>`;
      }).join("") : `<div class="empty">Hələ öz hərəkətiniz yoxdur.</div>`}
      <button class="btn block" style="margin-top:12px" onclick="openCustom('')">＋ Öz hərəkətini yarat</button>
      <div class="small" style="margin-top:10px">Kitabxanada olmayan bir hərəkət edirsinizsə onu buradan yaradın — sonra istənilən günə əlavə edə bilərsiniz.</div>
    </div>

    <div class="sect">Qeyd</div>
    <div class="card tight"><div class="small">Dəyişiklikləriniz yalnız gələcək məşqlərə təsir edir; tarixçə və qrafiklər olduğu kimi qalır. Bir hərəkəti plandan çıxarsanız belə, onun keçmiş qeydləri Proqres bölməsində saxlanılır.</div></div>`;
}

function planMove(D,i,dir){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  const p = ensurePlan(D), j = i+dir;
  if(j<0 || j>=p.length) return;
  const t = p[i]; p[i] = p[j]; p[j] = t;
  planTouch();
}
function planRemove(D,i){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  const p = ensurePlan(D);
  const nm = (libEx(p[i].k)||{}).name || p[i].k;
  ask("Hərəkət çıxarılsın?", `“${esc(nm)}” bu gündən çıxarılacaq.\n\nKeçmiş qeydləriniz və qrafikləriniz silinmir.`, "Çıxar",
      ()=>{ p.splice(i,1); planTouch(); toast("Çıxarıldı"); }, true);
}
function planReset(D){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  ask("Standart plana qaytarılsın?", "Bu gün üçün etdiyiniz dəyişikliklər itəcək — hərəkətlər ilkin siyahıya qayıdacaq.", "Qaytar",
      ()=>{ if(state.plan) delete state.plan[D]; planTouch(); toast("Standart plan bərpa edildi"); }, true);
}
function planPick(D, key, idx){
  const p = ensurePlan(D);
  if(p.some((s,i)=> s.k===key && i!==idx)){ toast("Bu hərəkət artıq həmin gündədir"); return; }
  if(idx===null || idx===undefined) p.push(defSlot(key));
  else p[idx] = { ...defSlot(key), sets:p[idx].sets, rMin:p[idx].rMin, rMax:p[idx].rMax, rest:p[idx].rest };
  closeSheet(); planTouch();
  toast(idx===null||idx===undefined ? "Əlavə edildi" : "Dəyişdirildi");
}

const GRP = { push:"İtələmə (döş · çiyin · triseps)", pull:"Çəkmə (kürək · biseps)", legs:"Ayaq", core:"Qarın · Bel", mine:"Mənim hərəkətlərim" };
function libSetFilter(g){ libFilter = g; renderLibList(); }
function libSearch(v){ libQuery = (v||"").toLowerCase(); renderLibList(); }
function openLibPick(D, idx){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  libFilter = { P:"push", L:"pull", G:"legs" }[D] || "all";   /* günün qrupu ilə başla */
  libQuery = "";
  $("#sheet").innerHTML = `${SHEETHEAD}
    <h3>${idx===null?"Hərəkət əlavə et":"Hərəkəti əvəz et"}</h3>
    <div class="stag">${DAY_META[D].name}</div>
    <input class="srch" id="libq" placeholder="Axtar: bench, hantel, triseps, fly..." oninput="libSearch(this.value)">
    <div class="chips fil" id="libfil"></div>
    <div id="liblist" class="swaplist"></div>
    <button class="btn block ghost" style="margin-top:6px" onclick="closeSheet()">Bağla</button>`;
  $("#sheet").dataset.d = D; $("#sheet").dataset.i = (idx===null||idx===undefined) ? "" : String(idx);
  renderLibList();
  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
}
function renderLibList(){
  const fil = $("#libfil"), box = $("#liblist");
  if(!box) return;
  const D = $("#sheet").dataset.d, iRaw = $("#sheet").dataset.i;
  const idx = iRaw==="" ? null : parseInt(iRaw);
  const groups = ["all","push","pull","legs","core","mine"];
  fil.innerHTML = groups.map(g=>`<span class="pick ${libFilter===g?"on":""}" onclick="libSetFilter('${g}')">${g==="all"?"Hamısı":(GRP[g]||g).split(" (")[0]}</span>`).join("");
  const mine = Object.keys(state.userEx||{});
  let keys = libFilter==="mine" ? mine : libKeys().filter(k => libFilter==="all" || (libEx(k)||{}).g===libFilter);
  /* axtarış ada, əzələ teqinə VƏ avadanlığa baxır — "hantel" yazıb aparatsız
     variantları tapmaq üçün (aparat dolu olanda lazım olur) */
  if(libQuery) keys = keys.filter(k => {
    const e = libEx(k) || {};
    const hay = [e.name, e.tag, LOAD_LBL[e.load] ? LOAD_LBL[e.load].s : "", e.load].join(" ").toLowerCase();
    return hay.includes(libQuery);
  });
  if(!keys.length){ box.innerHTML = `<div class="empty">Tapılmadı.</div>`; return; }
  box.innerHTML = keys.map(k=>{
    const e = mkEx(defSlot(k), null);
    return `<button class="swopt" onclick="planPick('${D}','${k}',${idx===null?"null":idx})">
      ${exImg(e,"exanim sm still")}
      <span class="swtxt"><b>${esc(e.name)}</b><small>${esc(e.tag||"")} · ${e.sets}×${e.rMin}-${e.rMax}</small></span>
      <span class="swck">＋</span>
    </button>`;
  }).join("");
}

function openSlotEdit(D,i){
  if(planLocked(D)){ toast("Aktiv məşq var — əvvəlcə onu bitirin"); return; }
  const sl = daySlots(D)[i], ex = mkEx(sl, D);
  $("#sheet").innerHTML = `${SHEETHEAD}
    ${exImg(ex,"exanim big")}
    <h3>${esc(ex.name)}</h3><div class="stag">${esc(ex.tag||"")}</div>
    <div class="grid2">
      <div class="field"><label>Dövr sayı</label><input id="sl-sets" type="number" inputmode="numeric" min="1" max="10" value="${esc(ex.sets)}"></div>
      <div class="field"><label>İstirahət (san)</label><input id="sl-rest" type="number" inputmode="numeric" min="15" max="300" step="15" value="${esc(ex.rest)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Təkrar — min</label><input id="sl-rmin" type="number" inputmode="numeric" min="1" max="50" value="${esc(ex.rMin)}"></div>
      <div class="field"><label>Təkrar — maks</label><input id="sl-rmax" type="number" inputmode="numeric" min="1" max="50" value="${esc(ex.rMax)}"></div>
    </div>
    <div class="small">Maks təkrara bütün dövrlərdə çatdıqda tətbiq çəkini +${ex.inc} kq artırmağı təklif edir.</div>
    <button class="btn block" style="margin-top:12px" onclick="applySlot('${D}',${i})">Yadda saxla</button>
    <button class="btn block ghost" style="margin-top:8px" onclick="openLibPick('${D}',${i})">⇄ Başqa hərəkətlə əvəz et</button>
    <button class="btn block danger" style="margin-top:8px" onclick="closeSheet();planRemove('${D}',${i})">Bu gündən çıxar</button>`;
  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
}
function applySlot(D,i){
  const p = ensurePlan(D);
  const n = (id,min,max,dflt) => { const v = parseInt($("#"+id).value); return (isNaN(v)||v<min||v>max) ? dflt : v; };
  const cur = p[i];
  cur.sets = n("sl-sets",1,10,cur.sets);
  cur.rest = n("sl-rest",15,300,cur.rest);
  let a = n("sl-rmin",1,50,cur.rMin), b = n("sl-rmax",1,50,cur.rMax);
  if(a > b){ const t=a; a=b; b=t; }
  cur.rMin = a; cur.rMax = b;
  closeSheet(); planTouch(); toast("Yadda saxlanıldı");
}

/* ---- öz hərəkətin ---- */
const clean = s => String(s||"").replace(/[<>]/g,"").trim();
function openCustom(key){
  const e = (key && state.userEx && state.userEx[key]) || { name:"", tag:"", g:"push", sets:3, rMin:10, rMax:12, rest:90, inc:2.5, cues:[] };
  $("#sheet").innerHTML = `${SHEETHEAD}
    <h3>${key?"Hərəkətə düzəliş":"Öz hərəkətini yarat"}</h3>
    <div class="field"><label>Ad</label><input id="cx-name" value="${esc(e.name)}" placeholder="məs. Landmine Press"></div>
    <div class="grid2">
      <div class="field"><label>Qrup</label><select id="cx-g">${["push","pull","legs","core"].map(g=>`<option value="${g}" ${e.g===g?"selected":""}>${GRP[g].split(" (")[0]}</option>`).join("")}</select></div>
      <div class="field"><label>İşləyən əzələ</label><input id="cx-tag" value="${esc(e.tag)}" placeholder="Döş · Triseps"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Dövr</label><input id="cx-sets" type="number" inputmode="numeric" value="${esc(e.sets)}"></div>
      <div class="field"><label>Təkrar min</label><input id="cx-rmin" type="number" inputmode="numeric" value="${esc(e.rMin)}"></div>
      <div class="field"><label>Təkrar maks</label><input id="cx-rmax" type="number" inputmode="numeric" value="${esc(e.rMax)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>İstirahət (san)</label><input id="cx-rest" type="number" inputmode="numeric" step="15" value="${esc(e.rest)}"></div>
      <div class="field"><label>Çəki addımı (kq)</label><input id="cx-inc" type="number" inputmode="decimal" step="0.5" value="${esc(e.inc)}"></div>
    </div>
    <div class="field"><label>Əsas işləyən əzələlər</label>
      <div class="chips fil" id="cx-pri">${Object.keys(MUSN).map(m=>`<span class="pick ${(e.pri||[]).includes(m)?"on":""}" data-m="${m}" onclick="this.classList.toggle('on')">${MUSN[m]}</span>`).join("")}</div></div>
    <div class="field"><label>Köməkçi əzələlər (yarım dövr sayılır)</label>
      <div class="chips fil" id="cx-sec">${Object.keys(MUSN).map(m=>`<span class="pick ${(e.sec||[]).includes(m)?"on":""}" data-m="${m}" onclick="this.classList.toggle('on')">${MUSN[m]}</span>`).join("")}</div></div>
    <div class="field"><label>Şəkil (istəyə bağlı)</label><input id="cx-img" value="${esc(e.url||e.file||"")}" placeholder="şəkil linki və ya Commons fayl adı"></div>
    <div class="field"><label>Texnika qeydləri — hər sətir ayrı</label><textarea id="cx-cues" rows="4" placeholder="Dirsəklər bədənə yaxın&#10;Yuxarıda bir saniyə sıxın">${esc((e.cues||[]).join("\n"))}</textarea></div>
    <button class="btn block" style="margin-top:6px" onclick="saveCustom('${key||""}')">Yadda saxla</button>
    <button class="btn block ghost" style="margin-top:8px" onclick="closeSheet()">İmtina</button>`;
  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
}
function saveCustom(key){
  const name = clean($("#cx-name").value);
  if(!name){ toast("Ad yazın"); return; }
  const num = (id,d,min,max) => { const v = parseFloat($("#"+id).value); return (isNaN(v)||v<min||v>max) ? d : v; };
  const img = clean($("#cx-img").value);
  const k = key || ("u" + Date.now().toString(36));
  state.userEx = state.userEx || {};
  const prev = state.userEx[k] || {};
  state.userEx[k] = {
    name, tag: clean($("#cx-tag").value) || "Öz hərəkətim", g: $("#cx-g").value,
    sets: num("cx-sets", 3, 1, 10), rMin: num("cx-rmin", 10, 1, 50), rMax: num("cx-rmax", 12, 1, 50),
    rest: num("cx-rest", 90, 15, 300), inc: num("cx-inc", 2.5, 0.5, 20),
    cues: clean($("#cx-cues").value).split("\n").map(s=>s.trim()).filter(Boolean),
    mist: prev.mist || [],
    pri: [...document.querySelectorAll("#cx-pri .pick.on")].map(el=>el.dataset.m),
    sec: [...document.querySelectorAll("#cx-sec .pick.on")].map(el=>el.dataset.m),
    url: safeURL(img), file: safeURL(img) ? "" : img.replace(/["'<>]/g,"")
  };
  if(state.userEx[k].rMin > state.userEx[k].rMax){
    const t = state.userEx[k].rMin; state.userEx[k].rMin = state.userEx[k].rMax; state.userEx[k].rMax = t;
  }
  closeSheet(); planTouch();
  toast(key ? "Yeniləndi" : `“${name}” yaradıldı — indi günə əlavə edin`);
}
function delCustom(k){
  const nm = (state.userEx[k]||{}).name || k;
  const used = DAYS.filter(D => daySlots(D).some(s => s.k===k));
  const extra = used.length ? `\n\nO, bu günlərdən də çıxarılacaq: ${used.map(D=>DAY_META[D].name).join(", ")}.` : "";
  ask("Hərəkət silinsin?", `“${esc(nm)}” kitabxanadan tamamilə silinəcək.${esc(extra)}`, "Sil", ()=>{
    used.forEach(D => { const p = ensurePlan(D); const i = p.findIndex(s=>s.k===k); if(i>=0) p.splice(i,1); });
    delete state.userEx[k];
    planTouch(); toast("Silindi");
  }, true);
}
